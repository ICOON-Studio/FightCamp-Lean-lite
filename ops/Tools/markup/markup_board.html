<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markup Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
:root{--ground:#1c2230;--panel:#2a3347;--panel-hi:#34405a;--panel-lo:#222a3b;--edge:#121722;--line:#4a5a78;--gym:#3f86cc;--gym-lo:#24558a;--gold:#f0c233;--gold-lo:#c99a1a;--text:#f3f5fa;--text2:#c9d1e0;--muted:#94a1b8;--wrong:#e5433a;--change:#f0a02a;--keep:#4fc46a;--move:#3f9dff;--d:"Bebas Neue",Impact,"Arial Narrow",sans-serif;--m:"IBM Plex Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--text);font:500 13px/1.4 var(--m);display:grid;grid-template-rows:56px 1fr;overflow:hidden}
header{display:flex;align-items:center;gap:12px;padding:0 14px;background:linear-gradient(180deg,var(--panel-hi),var(--panel-lo));border-bottom:1px solid var(--edge);box-shadow:0 1px 0 rgba(255,255,255,.12) inset}
.brand{font:400 26px var(--d);letter-spacing:.06em;color:var(--gold);white-space:nowrap}
.brand small{font:700 10px var(--m);letter-spacing:.14em;color:var(--muted);margin-left:8px;vertical-align:middle}
header input{height:34px;border:1px solid var(--edge);border-radius:3px;background:rgba(0,0,0,.28);color:var(--text);font:500 13px var(--m);padding:0 10px;min-width:0}
header input:focus-visible,li input:focus-visible{outline:2px solid var(--gold);outline-offset:0}
#title{flex:1 1 200px}
#source{flex:1 1 280px}
.hint{color:var(--muted);font-size:11px;letter-spacing:.06em;white-space:nowrap}
button{white-space:nowrap;height:34px;border:1px solid var(--edge);border-radius:3px;background:linear-gradient(180deg,var(--panel-hi),var(--panel-lo));color:var(--text);font:400 17px var(--d);letter-spacing:.06em;padding:0 14px;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.12) inset}
button:hover{filter:brightness(1.12)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button:disabled{opacity:.5;cursor:default}
button.primary{background:linear-gradient(180deg,var(--gold),var(--gold-lo));color:#1a1400;border-color:#7a5e0a}
main{display:grid;grid-template-columns:150px 1fr 330px;min-height:0}
aside{background:var(--panel-lo);border-right:1px solid var(--edge);padding:12px;display:flex;flex-direction:column;gap:8px;overflow:auto}
aside.marks{border-right:0;border-left:1px solid var(--edge)}
h2{font:400 18px var(--d);letter-spacing:.08em;color:var(--text2);margin:6px 0 2px}
.tool,.intent{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--edge);border-radius:3px;background:var(--panel);cursor:pointer;font:500 12px var(--m);letter-spacing:.06em;text-transform:uppercase;box-shadow:none}
.tool[aria-pressed=true]{background:linear-gradient(180deg,var(--gym),var(--gym-lo));box-shadow:0 1px 0 rgba(255,255,255,.18) inset}
.intent i{width:12px;height:12px;border-radius:50%;border:1px solid rgba(0,0,0,.5);background:var(--c)}
.intent[aria-pressed=true]{background:var(--c);color:#111;font-weight:700}
.intent[aria-pressed=true] i{border-color:#111}
kbd{margin-left:auto;font:700 10px var(--m);color:var(--muted)}
.intent[aria-pressed=true] kbd{color:#222}
.stage{position:relative;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 0%,#232b3c,#151a25 70%);overflow:hidden;padding:16px}
canvas{max-width:100%;max-height:100%;box-shadow:0 10px 30px rgba(0,0,0,.5);touch-action:none;cursor:crosshair}
canvas.hidden{display:none}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);pointer-events:none}
.empty[hidden]{display:none}
.empty b{display:block;font:400 34px var(--d);letter-spacing:.06em;color:var(--text2)}
.stage.over{outline:2px dashed var(--gold);outline-offset:-8px}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li{display:grid;grid-template-columns:28px 1fr 24px;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--edge);border-radius:3px;background:var(--panel)}
li .n{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--c);color:#111;font:400 15px var(--d)}
li .meta{font-size:10px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
li input{width:100%;height:28px;border:1px solid var(--edge);border-radius:2px;background:rgba(0,0,0,.28);color:var(--text);font:500 12px var(--m);padding:0 8px;margin-top:3px}
li button.x{height:24px;padding:0;font:700 14px var(--m);background:transparent;border-color:transparent;color:var(--muted);box-shadow:none}
li button.x:hover{color:var(--wrong)}
pre{margin:0;padding:10px;border:1px solid var(--edge);border-radius:3px;background:rgba(0,0,0,.3);color:var(--text2);font:500 11px/1.5 var(--m);white-space:pre-wrap;word-break:break-word}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;transition:.25s;background:linear-gradient(180deg,var(--gold),var(--gold-lo));color:#1a1400;border:1px solid #7a5e0a;border-radius:3px;padding:10px 16px;font:700 12px var(--m);letter-spacing:.04em;max-width:80vw}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{background:var(--wrong);color:#fff;border-color:#7a1a14}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
  <div class="brand">MARKUP BOARD <small>FIGHTCAMP FEEDBACK</small></div>
  <input id="title" placeholder="Title, e.g. Profile header">
  <input id="source" placeholder="Source, e.g. PROFILE_PREVIEW_2026-09-04.html or Football Manager">
  <span id="nav" hidden><button id="prev" title="Previous picture (Left arrow or P)">&#9664; Prev</button> <b id="pos"></b> <button id="next" title="Next picture (Right arrow or N)">Next &#9654;</button></span>
  <span class="hint">PASTE (CTRL+V) · DROP · OPEN</span>
  <button id="open">Open</button>
  <button id="save" class="primary">Save to repo</button>
  <input id="file" type="file" accept="image/*" hidden>
</header>
<main>
  <aside class="tools">
    <h2>Tool</h2>
    <button class="tool" data-tool="pin" aria-pressed="false">Pin<kbd>1</kbd></button>
    <button class="tool" data-tool="box" aria-pressed="true">Box<kbd>2</kbd></button>
    <button class="tool" data-tool="arrow" aria-pressed="false">Arrow<kbd>3</kbd></button>
    <button class="tool" data-tool="pen" aria-pressed="false">Pen<kbd>4</kbd></button>
    <h2>Intent</h2>
    <button class="intent" data-intent="wrong" style="--c:var(--wrong)" aria-pressed="true"><i></i>Wrong<kbd>W</kbd></button>
    <button class="intent" data-intent="change" style="--c:var(--change)" aria-pressed="false"><i></i>Change<kbd>C</kbd></button>
    <button class="intent" data-intent="keep" style="--c:var(--keep)" aria-pressed="false"><i></i>Keep<kbd>K</kbd></button>
    <button class="intent" data-intent="move" style="--c:var(--move)" aria-pressed="false"><i></i>Move<kbd>M</kbd></button>
    <h2>Edit</h2>
    <button id="undo">Undo<kbd>^Z</kbd></button>
    <button id="clear">Clear</button>
  </aside>
  <section class="stage" id="stage">
    <canvas id="c" class="hidden"></canvas>
    <div class="empty" id="empty"><div><b>DROP A SCREENSHOT</b>or paste one with Ctrl+V, or press Open</div></div>
  </section>
  <aside class="marks">
    <h2>Marks</h2>
    <ol id="list"></ol>
    <h2>Digest preview</h2>
    <pre id="digest">No marks yet.</pre>
  </aside>
</main>
<div id="toast" role="status"></div>
<script>
(() => {
const $ = s => document.querySelector(s);
const canvas = $('#c'), ctx = canvas.getContext('2d');
const COLORS = {wrong:'#e5433a', change:'#f0a02a', keep:'#4fc46a', move:'#3f9dff'};
const state = {img:null, W:0, H:0, scale:1, marks:[], tool:'box', intent:'wrong', drag:null};

function setTool(t){ state.tool = t; document.querySelectorAll('.tool').forEach(b => b.setAttribute('aria-pressed', b.dataset.tool === t)); if (t === 'arrow') setIntent('move'); }
function setIntent(i){ state.intent = i; document.querySelectorAll('.intent').forEach(b => b.setAttribute('aria-pressed', b.dataset.intent === i)); }
document.querySelectorAll('.tool').forEach(b => b.onclick = () => setTool(b.dataset.tool));
document.querySelectorAll('.intent').forEach(b => b.onclick = () => setIntent(b.dataset.intent));

function loadBlob(blob, name, marks){
  const url = URL.createObjectURL(blob); const img = new Image();
  img.onload = () => {
    state.img = img; state.W = img.naturalWidth; state.H = img.naturalHeight; state.marks = marks || [];
    canvas.classList.remove('hidden'); $('#empty').hidden = true;
    if (name) $('#source').value = name;
    if (!state.marks.length){ const d = loadDraft(); if (d.length){ state.marks = d; setTimeout(() => toast('Unsaved marks restored - Ctrl+S to save them'), 300); } }
    rebuild(); fit(); URL.revokeObjectURL(url);
  };
  img.src = url;
}
function fit(){
  if (!state.img) return;
  const st = $('#stage'), pad = 32;
  const s = Math.min((st.clientWidth - pad) / state.W, (st.clientHeight - pad) / state.H, 1);
  state.scale = s; const dpr = window.devicePixelRatio || 1;
  canvas.style.width = Math.round(state.W * s) + 'px'; canvas.style.height = Math.round(state.H * s) + 'px';
  canvas.width = Math.round(state.W * s * dpr); canvas.height = Math.round(state.H * s * dpr);
  render();
}
window.addEventListener('resize', fit);
function toImg(e){ const r = canvas.getBoundingClientRect(); return {x: (e.clientX - r.left) / state.scale, y: (e.clientY - r.top) / state.scale}; }

// Draws marks in image pixels; the caller has already scaled the context.
function drawMarks(g, preview){
  const lw = Math.max(3, state.W / 400), r = Math.max(13, state.W / 70);
  const all = preview ? state.marks.concat([preview]) : state.marks;
  all.forEach(m => {
    const c = COLORS[m.intent];
    g.strokeStyle = c; g.fillStyle = c; g.lineWidth = lw; g.lineCap = 'round'; g.lineJoin = 'round';
    g.shadowColor = 'rgba(0,0,0,.6)'; g.shadowBlur = lw * 2;
    let ax = m.x, ay = m.y;
    if (m.tool === 'box'){ g.strokeRect(m.x, m.y, m.w, m.h); g.globalAlpha = .12; g.fillRect(m.x, m.y, m.w, m.h); g.globalAlpha = 1; }
    else if (m.tool === 'arrow'){ arrow(g, m.x, m.y, m.x2, m.y2, lw); }
    else if (m.tool === 'pen'){ g.beginPath(); m.points.forEach((p, j) => j ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.stroke(); ax = m.points[0][0]; ay = m.points[0][1]; }
    else { g.beginPath(); g.arc(m.x, m.y, lw * 1.2, 0, Math.PI * 2); g.fill(); }
    if (m.n) badge(g, ax, ay, r, m.n, c);
  });
}
function arrow(g, x1, y1, x2, y2, lw){
  const a = Math.atan2(y2 - y1, x2 - x1), h = lw * 4;
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  g.beginPath(); g.moveTo(x2, y2); g.lineTo(x2 - h * Math.cos(a - .5), y2 - h * Math.sin(a - .5)); g.lineTo(x2 - h * Math.cos(a + .5), y2 - h * Math.sin(a + .5)); g.closePath(); g.fill();
}
function badge(g, x, y, r, n, c){
  g.shadowBlur = 0; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fillStyle = c; g.fill();
  g.lineWidth = Math.max(2, r / 7); g.strokeStyle = '#111'; g.stroke();
  g.fillStyle = '#111'; g.font = 'bold ' + Math.round(r * 1.25) + 'px "IBM Plex Mono", Consolas, monospace';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(String(n), x, y + r * .05);
}
function render(preview){
  if (!state.img) return;
  const dpr = window.devicePixelRatio || 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.scale(state.scale * dpr, state.scale * dpr); ctx.drawImage(state.img, 0, 0); drawMarks(ctx, preview);
}

canvas.addEventListener('pointerdown', e => { if (!state.img) return; canvas.setPointerCapture(e.pointerId); const p = toImg(e); state.drag = {x: p.x, y: p.y, points: [[p.x, p.y]]}; });
canvas.addEventListener('pointermove', e => {
  if (!state.drag) return; const p = toImg(e), d = state.drag;
  if (state.tool === 'pen'){ const l = d.points[d.points.length - 1]; if (Math.hypot(p.x - l[0], p.y - l[1]) > 2) d.points.push([p.x, p.y]); }
  d.cx = p.x; d.cy = p.y; render(previewMark());
});
canvas.addEventListener('pointerup', () => { if (!state.drag) return; const m = previewMark(); state.drag = null; if (m) commit(m); else render(); });
function previewMark(){
  const d = state.drag; if (!d) return null;
  const cx = d.cx ?? d.x, cy = d.cy ?? d.y, base = {tool: state.tool, intent: state.intent, note: ''};
  if (state.tool === 'pin') return Object.assign(base, {x: d.x, y: d.y});
  if (state.tool === 'box'){ const x = Math.min(d.x, cx), y = Math.min(d.y, cy), w = Math.abs(cx - d.x), h = Math.abs(cy - d.y); return (w < 4 || h < 4) ? null : Object.assign(base, {x, y, w, h}); }
  if (state.tool === 'arrow') return Math.hypot(cx - d.x, cy - d.y) < 6 ? null : Object.assign(base, {x: d.x, y: d.y, x2: cx, y2: cy});
  return d.points.length < 2 ? null : Object.assign(base, {points: d.points.slice()});
}
function commit(m){ state.marks.push(m); rebuild(); const inp = document.querySelector('#list li:last-child input'); if (inp) inp.focus(); }
function rebuild(){
  state.marks.forEach((m, i) => m.n = i + 1);
  const ol = $('#list'); ol.innerHTML = '';
  state.marks.forEach((m, i) => {
    const li = document.createElement('li'); li.style.setProperty('--c', COLORS[m.intent]);
    li.innerHTML = '<span class="n">' + m.n + '</span><div><div class="meta"></div><input placeholder="What is wrong / what to do"></div><button class="x" title="Remove">×</button>';
    li.querySelector('.meta').textContent = m.intent + ' · ' + m.tool + ' · ' + where(m);
    const inp = li.querySelector('input'); inp.value = m.note;
    inp.oninput = () => { m.note = inp.value; digest(); };
    inp.onkeydown = ev => { if (ev.key === 'Enter') inp.blur(); };
    li.querySelector('.x').onclick = () => { state.marks.splice(i, 1); rebuild(); };
    ol.appendChild(li);
  });
  digest(); render();
}
function pct(v, total){ return Math.round(v / total * 1000) / 10; }
function bbox(pts){ let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9; pts.forEach(p => { x1 = Math.min(x1, p[0]); y1 = Math.min(y1, p[1]); x2 = Math.max(x2, p[0]); y2 = Math.max(y2, p[1]); }); return {x: x1, y: y1, w: x2 - x1, h: y2 - y1}; }
function where(m){
  const P = (x, y) => pct(x, state.W) + '%,' + pct(y, state.H) + '%';
  if (m.tool === 'box') return P(m.x, m.y) + ' ' + pct(m.w, state.W) + 'x' + pct(m.h, state.H) + '%';
  if (m.tool === 'arrow') return P(m.x, m.y) + ' -> ' + P(m.x2, m.y2);
  if (m.tool === 'pen'){ const b = bbox(m.points); return P(b.x, b.y) + ' ' + pct(b.w, state.W) + 'x' + pct(b.h, state.H) + '%'; }
  return P(m.x, m.y);
}
// S287 (PC froze 2026-10-22 with marks unsaved): every change is kept per image until Save succeeds
function draftKey(){ return 'markupDraft:' + ($('#source').value.trim() || 'pasted'); }
function loadDraft(){ try { return JSON.parse(localStorage.getItem(draftKey()) || '[]') || []; } catch (e){ return []; } }
function keepDraft(){ try { if (state.marks.length && JSON.stringify(state.marks) !== state.savedJson) localStorage.setItem(draftKey(), JSON.stringify(state.marks)); else localStorage.removeItem(draftKey()); } catch (e){} }
function digest(){ keepDraft(); $('#digest').textContent = state.marks.length ? state.marks.map(m => m.n + '. ' + m.intent.toUpperCase() + ' ' + m.tool + ' at ' + where(m) + (m.note ? ' - ' + m.note : '')).join('\n') : 'No marks yet.'; }
function exportMarks(){
  return state.marks.map(m => {
    const o = {n: m.n, tool: m.tool, intent: m.intent, note: m.note || ''}, P = (x, y) => ({x: pct(x, state.W), y: pct(y, state.H)});
    if (m.tool === 'box') Object.assign(o, P(m.x, m.y), {w: pct(m.w, state.W), h: pct(m.h, state.H)});
    else if (m.tool === 'arrow'){ o.from = P(m.x, m.y); o.to = P(m.x2, m.y2); }
    else if (m.tool === 'pen'){ const b = bbox(m.points); Object.assign(o, P(b.x, b.y), {w: pct(b.w, state.W), h: pct(b.h, state.H)}); o.points = m.points.filter((_, i) => i % 3 === 0).map(p => [pct(p[0], state.W), pct(p[1], state.H)]); }
    else Object.assign(o, P(m.x, m.y));
    return o;
  });
}
function toast(msg, err){ const t = $('#toast'); t.textContent = msg; t.className = 'show' + (err ? ' err' : ''); clearTimeout(t._h); t._h = setTimeout(() => t.className = '', err ? 6000 : 6000); }

async function save(){
  if (!state.img){ toast('Load a screenshot first', true); return; }
  if (!state.marks.length){ toast('Make at least one mark', true); return; }
  const full = document.createElement('canvas'); full.width = state.W; full.height = state.H;
  const g = full.getContext('2d'); g.drawImage(state.img, 0, 0);
  const original = full.toDataURL('image/png'); drawMarks(g, null); const marked = full.toDataURL('image/png');
  const payload = {title: $('#title').value.trim(), source: $('#source').value.trim(), width: state.W, height: state.H, marks: exportMarks(), original, marked};
  $('#save').disabled = true;
  try {
    const r = await fetch('/save', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
    const j = await r.json(); if (!r.ok) throw new Error(j.error || r.statusText);
    state.savedJson = JSON.stringify(state.marks); try { localStorage.removeItem(draftKey()); } catch (e){}
    toast('Saved as ' + j.id + '. Tell the agent: "see feedback ' + j.id + '"');
    if (queue.length){ savedAt[queue[qi]] = state.marks.length; kept[queue[qi]] = state.marks; updateNav(); setTimeout(nextInQueue, 1200); }
  } catch (err){ toast('Save failed: ' + err.message, true); }
  $('#save').disabled = false;
}
$('#save').onclick = save;
$('#open').onclick = () => $('#file').click();
$('#file').onchange = e => { const f = e.target.files[0]; if (f) loadBlob(f, f.name); };
$('#undo').onclick = () => { state.marks.pop(); rebuild(); };
$('#clear').onclick = () => { if (state.marks.length && confirm('Remove all marks?')){ state.marks = []; rebuild(); } };
document.addEventListener('paste', e => { for (const it of e.clipboardData.items){ if (it.type.startsWith('image/')){ loadBlob(it.getAsFile(), ''); e.preventDefault(); return; } } });
const stage = $('#stage');
stage.addEventListener('dragover', e => { e.preventDefault(); stage.classList.add('over'); });
stage.addEventListener('dragleave', () => stage.classList.remove('over'));
stage.addEventListener('drop', e => { e.preventDefault(); stage.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f && f.type.startsWith('image/')) loadBlob(f, f.name); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return; const k = e.key.toLowerCase();
  if (e.ctrlKey && k === 'z'){ e.preventDefault(); $('#undo').click(); }
  else if (e.ctrlKey && k === 's'){ e.preventDefault(); save(); }
  else if (k === '1') setTool('pin'); else if (k === '2') setTool('box'); else if (k === '3') setTool('arrow'); else if (k === '4') setTool('pen');
  else if ((k === 'n' || k === 'arrowright') && queue.length) nextInQueue(); else if ((k === 'p' || k === 'arrowleft') && queue.length) prevInQueue(); else if (k === 'w') setIntent('wrong'); else if (k === 'c') setIntent('change'); else if (k === 'k') setIntent('keep'); else if (k === 'm') setIntent('move');
});
// ?q=a.png,b.png : a review queue from /img/; saving a board (or pressing N) loads the next picture.
const queue = (new URLSearchParams(location.search).get('q') || '').split(',').filter(Boolean);
let qi = -1;
try { const st = sessionStorage.getItem('qi'); if (st !== null) qi = parseInt(st, 10) - 1; } catch (e) {}
const kept = {};   // marks per picture, kept in memory while you move around (not written until you Save)
const savedAt = {}; // picture -> mark count at its last save
function updateNav(){
  if (!queue.length) return; $('#nav').hidden = false;
  const open = queue.filter(n => (kept[n] || []).length && (kept[n] || []).length !== savedAt[n]).length;
  $('#pos').textContent = (qi + 1) + ' / ' + queue.length + (open ? '  (' + open + ' unsaved)' : '');
}
function showQueue(i){
  if (i < 0 || i >= queue.length) return;
  if (qi >= 0 && qi < queue.length) kept[queue[qi]] = state.marks;
  qi = i;
  try { sessionStorage.setItem('qi', String(qi)); } catch (e) {}
  const name = queue[qi];
  fetch('/img/' + name).then(r => r.blob()).then(b => { loadBlob(b, name, kept[name] ? kept[name].slice() : []); updateNav(); toast('Picture ' + (qi + 1) + ' of ' + queue.length + ': ' + name + (kept[name] && kept[name].length ? ' (your earlier marks are back)' : '')); });
}
function nextInQueue(){ showQueue(qi + 1); }
function prevInQueue(){ showQueue(qi - 1); }
$('#next').onclick = nextInQueue; $('#prev').onclick = prevInQueue;
if (queue.length) nextInQueue();
if (new URLSearchParams(location.search).has('demo')) fetch('/demo.png').then(r => r.blob()).then(b => loadBlob(b, 'demo.png'));
})();
</script>
</body>
</html>
