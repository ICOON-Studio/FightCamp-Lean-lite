<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boxer Animations</title>
<style>
  :root {
    --bg: #0e1116; --bg2: #161b22; --bg3: #1c2330; --line: #2a3341;
    --text: #e6edf3; --muted: #8b949e; --dim: #6e7681;
    --good: #3fb950; --amber: #d29922; --bad: #f85149; --link: #58a6ff; --blue: #79c0ff;
    --pad: 14px; --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line);
           padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  header h1 { margin: 0; font-size: 1.15rem; }
  header a { color: var(--link); text-decoration: none; font-size: 0.9rem; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; }
  .filters button { background: var(--bg2); color: var(--text); border: 1px solid var(--line); border-radius: 999px;
                    padding: 5px 12px; font: inherit; font-size: 0.85rem; cursor: pointer; }
  .filters button.on { border-color: var(--link); background: rgba(88,166,255,.14); }
  main { padding: 12px 16px 40px; max-width: 1400px; margin: 0 auto; }
  .rule { color: var(--muted); font-size: 0.85rem; margin: 4px 0 14px; }
  h2 { font-size: 1rem; margin: 22px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
          display: flex; flex-direction: column; }
  .media { background: #000; aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; }
  .media video, .media img { width: 100%; height: 100%; object-fit: contain; display: block; cursor: zoom-in; }
  .media .none { color: var(--dim); font-size: 0.85rem; padding: 12px; text-align: center; }
  .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
  .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .name { font-weight: 600; }
  .id { font-family: var(--mono); font-size: 0.75rem; color: var(--dim); overflow-wrap: anywhere; }
  .badge { font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .CERTIFIED { background: rgba(63,185,80,.18); color: var(--good); }
  .IN_GAME { background: rgba(121,192,255,.16); color: var(--blue); }
  .NOT_READY { background: rgba(248,81,73,.16); color: var(--bad); }
  .NO_CLIP { background: rgba(210,153,34,.18); color: var(--amber); }
  .MISSING { background: rgba(248,81,73,.16); color: var(--bad); }
  .LOADED { background: rgba(139,148,158,.18); color: var(--muted); }
  .line { font-size: 0.82rem; color: var(--muted); }
  .line b { color: var(--text); font-weight: 600; }
  .note { font-size: 0.82rem; color: var(--text); border-left: 3px solid var(--amber); padding-left: 8px; }
  .probe { color: var(--amber); font-weight: 700; }
  .count { font-size: 0.85rem; color: var(--muted); }
  #zoom { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; z-index: 20; align-items: center;
          justify-content: center; padding: 16px; }
  #zoom.on { display: flex; }
  #zoom video, #zoom img { max-width: 100%; max-height: 100%; }
  .err { color: var(--bad); }
</style>
<style>
.fcnav{position:sticky;top:0;z-index:50;display:flex;gap:4px;align-items:center;background:#0e0c0b;border-bottom:1px solid #3a332d;padding:8px 16px}
.fcnav b{color:#e0703a;margin-right:14px;font-size:14px;letter-spacing:.04em}
.fcnav a{color:#a39a8e;text-decoration:none;font-size:14px;padding:5px 12px;border-radius:6px}
.fcnav a:hover{background:#2b2520;color:#efe9e1}
.fcnav a.cur{background:#e0703a;color:#14110f;font-weight:700}
</style>
</head>
<body>
<nav class="fcnav"><b>FIGHTCAMP</b><a href="/" data-p="/">Roadmap</a><a href="/agents" data-p="/agents">Agents live</a><a href="/animations" data-p="/animations">Boxer animations</a><a href="/old" data-p="/old">Old detailed board</a><a href="http://127.0.0.1:4101/" title="Model router live: every Claude session (desktop via the model-router mod)">Model router</a></nav>
<script>document.querySelectorAll('.fcnav a').forEach(a=>{if(a.dataset.p===location.pathname.replace(/\.html$/,'')||(a.dataset.p==='/'&&location.pathname==='/index.html'))a.classList.add('cur')})</script>

<header>
  <h1>Boxer animations</h1>
  <span class="count" id="counts"></span>
  <div class="filters" id="filters"></div>
  <a href="/">&larr; Ops board</a>
</header>
<main>
  <div class="rule" id="rule"></div>
  <div id="groups">Loading&hellip;</div>
</main>
<div id="zoom"></div>
<script>
const LABEL = {"CERTIFIED": "Ready (certified)", "IN GAME": "In game, not gated", "NOT READY": "Not ready",
               "NO CLIP": "No clip yet", "MISSING": "Missing", "NEW SOURCE": "New source - not in the fight yet",
               "LOADED": "Owned, never picked"};
// S365: the page now lists the Lean game's own clips (Tools/lean_anim_catalogue.py): IN GAME = a fight beat can pick it.
LABEL["IN GAME"] = "In the fight";
let data = null, filter = "ALL";
function cls(s) { return s.replace(/ /g, "_"); }
function esc(t) { return String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function media(r) {
  if (r.video) return `<video src="/media/${encodeURI(r.video)}" muted loop autoplay playsinline preload="metadata" data-z="v"></video>`;
  if (r.still) return `<img src="/media/${encodeURI(r.still)}" alt="${esc(r.label)} contact sheet" loading="lazy" data-z="i">`;
  return `<div class="none">No preview rendered yet</div>`;
}
function evidence(ev) {
  if (!ev || !ev.report) return "";
  const fails = Object.entries(ev.failures || {}).map(([k, v]) => `${k} ×${v}`).join(", ") || "none";
  return `<div class="line">Latest gate: <b>${ev.rigs_clean}/${ev.rigs}</b> fighters clean${ev.probe ? ' <span class="probe">(probe, not the game setup)</span>' : ''} · ${esc(ev.candidate)} · ${esc(fails)} <span class="id">${esc(ev.report)}</span></div>`;
}
function render() {
  const g = document.getElementById("groups");
  g.innerHTML = "";
  for (const group of data.groups) {
    if (group.hidden) continue;  // S270: old clips off the page (operator)
    const rows = group.rows.filter(r => filter === "ALL" || r.status === filter);
    if (!rows.length) continue;
    const sec = document.createElement("section");
    const hint = "";
    sec.innerHTML = `<h2>${esc(group.group)} (${rows.length})</h2>${hint}<div class="grid"></div>`;
    const grid = sec.querySelector(".grid");
    for (const r of rows) {
      const c = document.createElement("div");
      c.className = "card";
      c.innerHTML = `<div class="media">${media(r)}</div><div class="body">
        <div class="top"><span class="name">${esc(r.label)}</span><span class="badge ${cls(r.status)}">${esc(LABEL[r.status] || r.status)}</span></div>
        <div class="id">${esc(r.id)}${r.source ? " · " + esc(r.source) : ""}</div>
        ${r.why ? `<div class="line">${esc(r.why)}</div>` : ""}
        ${evidence(r.evidence)}
        ${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}
      </div>`;
      grid.appendChild(c);
    }
    g.appendChild(sec);
  }
}
function filters() {
  const f = document.getElementById("filters");
  const keys = ["ALL"].concat(Object.keys(data.counts));
  f.innerHTML = keys.map(k => `<button data-k="${k}" class="${k === filter ? "on" : ""}">${k === "ALL" ? "All" : LABEL[k]}${k === "ALL" ? "" : " " + (data.counts[k] || 0)}</button>`).join("");
  f.querySelectorAll("button").forEach(b => b.onclick = () => { filter = b.dataset.k; try { localStorage.setItem("animFilter", filter); } catch (e) {} filters(); render(); });
}
document.addEventListener("click", e => {
  const z = document.getElementById("zoom");
  if (e.target.dataset && e.target.dataset.z) {
    z.innerHTML = e.target.dataset.z === "v" ? `<video src="${e.target.src}" controls autoplay loop muted playsinline></video>` : `<img src="${e.target.src}">`;
    z.classList.add("on");
  } else if (e.target === z || z.contains(e.target) && e.target.tagName === "IMG") {
    z.classList.remove("on"); z.innerHTML = "";
  }
});
fetch("/api/animations").then(r => r.json()).then(d => {
  if (d.error) throw new Error(d.error);
  data = d;
  try { filter = localStorage.getItem("animFilter") || "ALL"; } catch (e) {}
  const total = Object.values(d.counts).reduce((a, b) => a + b, 0);
  document.getElementById("counts").textContent = `${total} clips · ${d.counts["IN GAME"] || 0} in the fight`;
  document.getElementById("rule").textContent = d.rule + ".";
  filters(); render();
}).catch(e => { document.getElementById("groups").innerHTML = `<p class="err">Could not load: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
