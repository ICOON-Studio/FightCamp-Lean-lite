<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grappling Animations</title>
<style>
  :root {
    --bg: #0e1116; --bg2: #161b22; --bg3: #1c2330; --line: #2a3341;
    --text: #e6edf3; --muted: #8b949e; --dim: #6e7681;
    --good: #3fb950; --amber: #d29922; --bad: #f85149; --link: #58a6ff; --blue: #79c0ff;
    --pad: 14px; --radius: 10px;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 15px; }
  header { padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 1.15rem; }
  .count { font-size: 0.85rem; color: var(--muted); }
  main { padding: 12px 16px 40px; max-width: 1400px; margin: 0 auto; }
  .strip { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; background: var(--bg2); border: 1px solid var(--line);
           border-radius: var(--radius); padding: 12px 14px; margin: 4px 0 10px; }
  .strip .n { font-size: 1.5rem; font-weight: 700; margin-right: 6px; }
  .strip .k { color: var(--muted); font-size: 0.85rem; }
  .strip .v .n { color: var(--good); } .strip .p .n { color: var(--amber); } .strip .s .n { color: var(--muted); }
  .bar { flex: 1 1 260px; height: 10px; border-radius: 999px; background: var(--bg3); overflow: hidden; display: flex; }
  .bar i { display: block; height: 100%; }
  .shown { font-size: 0.95rem; margin: 6px 0; }
  .rule { color: var(--muted); font-size: 0.85rem; margin: 4px 0 14px; }
  h2 { font-size: 1rem; margin: 22px 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .card { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden;
          display: flex; flex-direction: column; }
  .media { background: #000; aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; }
  .media video { width: 100%; height: 100%; object-fit: contain; display: block; cursor: zoom-in; }
  .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; }
  .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .name { font-weight: 600; }
  .belt { font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--line); }
  .belt.white { background: #e6edf3; color: #111; } .belt.blue { background: #1f4fbf; color: #fff; }
  .belt.purple { background: #6e3fbf; color: #fff; } .belt.brown { background: #6b4226; color: #fff; }
  .belt.other { background: var(--bg3); color: var(--muted); }
  .chip { align-self: flex-start; font-size: 0.75rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .chip.good { background: rgba(63,185,80,.18); color: var(--good); } .chip.bad { background: rgba(248,81,73,.16); color: var(--bad); }
  .chip.amber { background: rgba(210,153,34,.18); color: var(--amber); } .chip.none { background: var(--bg3); color: var(--muted); }
  .line { font-size: 0.82rem; color: var(--muted); }
  .line b { color: var(--text); font-weight: 600; }
  .id { font-family: var(--mono); font-size: 0.75rem; color: var(--dim); overflow-wrap: anywhere; }
  .checks { margin: 0; padding-left: 16px; font-size: 0.8rem; color: var(--muted); }
  .checks b { color: var(--text); }
  table.rest { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  table.rest td, table.rest th { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  table.rest th { color: var(--muted); font-weight: 600; }
  #zoom { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; z-index: 20; align-items: center;
          justify-content: center; padding: 16px; }
  #zoom.on { display: flex; }
  #zoom video { max-width: 100%; max-height: 100%; }
  .err { color: var(--bad); }
  @media (max-width: 520px) { main { padding: 10px 16px 30px; } .grid { grid-template-columns: 1fr; } }
</style>
<style>
.fcnav{position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:#0e0c0b;border-bottom:1px solid #3a332d;padding:8px 16px}
.fcnav b{color:#e0703a;margin-right:14px;font-size:14px;letter-spacing:.04em}
.fcnav a{color:#a39a8e;text-decoration:none;font-size:14px;padding:5px 12px;border-radius:6px}
.fcnav a:hover{background:#2b2520;color:#efe9e1}
.fcnav a.cur{background:#e0703a;color:#14110f;font-weight:700}
</style>
</head>
<body>
<nav class="fcnav"><b>FIGHTCAMP</b><a href="/" data-p="/">Roadmap</a><a href="/review" data-p="/review">Stills &amp; videos</a><a href="/agents" data-p="/agents">Agents live</a><a href="/animations" data-p="/animations">Boxer animations</a><a href="/grappling" data-p="/grappling">Grappling animations</a><a href="/old" data-p="/old">Old detailed board</a><a href="http://127.0.0.1:4101/" title="Model router live: every Claude session (desktop via the model-router mod)">Model router</a></nav>
<script>document.querySelectorAll('.fcnav a').forEach(a=>{if(a.dataset.p===location.pathname.replace(/\.html$/,''))a.classList.add('cur')})</script>

<header>
  <h1>Grappling animations</h1>
  <span class="count" id="counts"></span>
</header>
<main>
  <div class="strip" id="strip"></div>
  <div class="shown" id="shown"></div>
  <div class="rule" id="rule"></div>
  <div id="tiles">Loading&hellip;</div>
</main>
<div id="zoom"></div>
<script>
// S379 (operator: "make a new one for the grappling animations"): Tools/lean_grapple_catalogue.py -> /api/grappling.
function esc(t) { return String(t ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }
function beltCls(b) { const w = String(b || "").split(" ")[0]; return ["white", "blue", "purple", "brown"].includes(w) ? w : "other"; }
function beltText(b) { const w = beltCls(b); return w === "other" ? b : w[0].toUpperCase() + w.slice(1) + " belt"; }
function checks(list) {
  if (!list || !list.length) return "";
  return `<ul class="checks">${list.map(c => `<li><b>${esc(c.result)}</b> - ${esc(c.check)}${c.note ? ": " + esc(c.note) : ""}</li>`).join("")}</ul>`;
}
function measured(m) {
  if (!m || m.jerk_p95 === undefined) return "";
  return `<div class="line">Measured as drawn: jerk p95 <b>${m.jerk_p95}</b> m/s³ · <b>${m.flips_s}</b> flips/s · worst pop <b>${Math.round(m.spike_m * 100)}</b> cm · deepest inside the other body <b>${Math.round(m.overlap_peak_m * 100)}</b> cm (${m.overlap_deep_frames} of ${m.measured_frames} frames over 6 cm)${m.speed > 1 ? ` · played ${m.speed}x faster to fit (${m.length_s} s at the data's pace)` : ""}</div>`;
}
function card(r) {
  const same = r.same_name > 1 ? ` · 1 of ${r.same_name} GrappleMap moves with this name` : "";
  return `<div class="card"><div class="media"><video src="/media/${encodeURI(r.video)}" muted loop autoplay playsinline preload="metadata" data-z="v"></video></div>
    <div class="body">
      <div class="top"><span class="name">${esc(r.title)}</span><span class="belt ${beltCls(r.belt)}">${esc(beltText(r.belt))}</span></div>
      <span class="chip ${esc(r.status_cls)}">${esc(r.status_text)}</span>
      <div class="line"><b>${esc(r.kind)}</b>${r.syllabus ? " · " + esc(r.syllabus) : ""} · played ${r.plays}x in ${r.films} match films (${r.hits} landed)</div>
      <div class="line">${esc(r.from)} &rarr; ${esc(r.to)}${r.reverse ? " (the match plays it backwards)" : ""}</div>
      ${measured(r.measured)}
      ${checks(r.checks)}
      <div class="id">GrappleMap #${r.id} "${esc(r.gm_title)}" · ${r.keyframes} keyframes${same}</div>
    </div></div>`;
}
document.addEventListener("click", e => {
  const z = document.getElementById("zoom");
  if (e.target.dataset && e.target.dataset.z) {
    z.innerHTML = `<video src="${e.target.src}" controls autoplay loop muted playsinline></video>`;
    z.classList.add("on");
  } else if (e.target === z) { z.classList.remove("on"); z.innerHTML = ""; }
});
fetch("/api/grappling").then(r => r.json()).then(d => {
  if (d.error) throw new Error(d.error);
  const p = d.progress, total = d.total || 1;
  const pct = k => (100 * (p[k] || 0) / total).toFixed(1);
  document.getElementById("counts").textContent = `${d.total} moves · ${d.rendered} rendered`;
  document.getElementById("strip").innerHTML =
    `<span class="v"><span class="n">${p["verified"]}</span><span class="k">verified (your OK / Argon 9/10+)</span></span>
     <span class="p"><span class="n">${p["in progress"]}</span><span class="k">in progress (rendered, measured)</span></span>
     <span class="s"><span class="n">${p["not started"]}</span><span class="k">not started (not rendered yet)</span></span>
     <span class="bar"><i style="width:${pct("verified")}%;background:var(--good)"></i><i style="width:${pct("in progress")}%;background:var(--amber)"></i><i style="width:${pct("not started")}%;background:var(--line)"></i></span>`;
  document.getElementById("shown").textContent = d.shown_rule;
  document.getElementById("rule").textContent = d.rule + ".";
  const seen = new Set();
  const done = d.rows.filter(r => r.video && !seen.has(r.title) && seen.add(r.title));
  const rest = d.rows.filter(r => !r.video);
  let html = done.length ? `<h2>Rendered (${done.length})</h2><div class="grid">${done.map(card).join("")}</div>` : "";
  if (rest.length) html += `<h2>Not rendered yet (${rest.length})</h2><table class="rest"><tr><th>Move</th><th>Belt</th><th>What it does</th><th>Played</th></tr>` +
    rest.map(r => `<tr><td>${esc(r.title)}</td><td>${esc(r.id === null ? "not in GrappleMap" : beltText(r.belt))}</td><td>${esc(r.kind)}</td><td>${r.plays}x</td></tr>`).join("") + `</table>`;
  document.getElementById("tiles").innerHTML = html || "No moves found in the match films.";
}).catch(e => { document.getElementById("tiles").innerHTML = `<p class="err">Could not load: ${esc(e.message)}</p>`; });
</script>
</body>
</html>
