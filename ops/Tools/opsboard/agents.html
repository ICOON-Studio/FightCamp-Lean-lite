<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agents Live</title>
<style>
:root{--bg:#14110f;--panel:#1e1a17;--line:#3a332d;--ink:#efe9e1;--dim:#a39a8e;--good:#3fb950;--warn:#e3b341;--bad:#f85149;--cloud:#58a6ff;--pc:#e0703a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,Segoe UI,sans-serif}
main{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline}
h1{font-size:22px;margin:0}
header a{color:var(--dim);font-size:13px}
#at{color:var(--dim);font-size:13px;margin-left:auto}
h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:24px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px;display:flex;gap:10px;align-items:center}
h2 .count{color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--cloud);border-radius:8px;padding:10px 12px;min-width:0}
.card.pc{border-left-color:var(--pc)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em}
.who{background:#2b2520}
.t{font-weight:600;margin:6px 0}
.verdict{font-weight:600;font-size:14px}
.v-good{color:var(--good)}.v-warn{color:var(--warn)}.v-bad{color:var(--bad)}.v-work{color:var(--cloud)}
.meta{font-size:12.5px;color:var(--dim);margin-top:3px;overflow-wrap:anywhere}
.meta a{color:var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:13px}
.chip b{text-transform:capitalize}
table.lim{width:100%;min-width:640px;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
table.lim td,table.lim th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;font-size:14px}
table.lim th{font-size:12px;color:var(--dim);text-transform:uppercase}
.live{color:var(--good);font-size:11px;font-weight:700}
.out{color:var(--bad)}
pre{background:#100e0c;border:1px solid var(--line);border-radius:6px;padding:8px;margin:8px 0 0;font:12px/1.35 ui-monospace,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:200px;overflow:auto}
.empty{color:var(--dim);font-style:italic}
</style>
<style>
.fcnav{position:sticky;top:0;z-index:50;display:flex;gap:4px;align-items:center;background:#0e0c0b;border-bottom:1px solid #3a332d;padding:8px 16px}
.fcnav b{color:#e0703a;margin-right:14px;font-size:14px;letter-spacing:.04em}
.fcnav a{color:#a39a8e;text-decoration:none;font-size:14px;padding:5px 12px;border-radius:6px}
.fcnav a:hover{background:#2b2520;color:#efe9e1}
.fcnav a.cur{background:#e0703a;color:#14110f;font-weight:700}
</style>
</head>
<body>
<nav class="fcnav"><b>FIGHTCAMP</b><a href="/" data-p="/">Roadmap</a><a href="/agents" data-p="/agents">Agents live</a><a href="/animations" data-p="/animations">Boxer animations</a><a href="/old" data-p="/old">Old detailed board</a><a href="http://127.0.0.1:4101/" title="Model router live: every Claude session (desktop via the model-router mod)">Model router</a></nav>
<script>
// S222 (operator: timers on tasks): the leading date+time of a started string, a live ticking duration.
function when(s){ if(!s) return null; const m=String(s).match(/(\d{4}-\d{2}-\d{2})[ T](\d{1,2}:\d{2})/); const t=m? new Date(m[1]+"T"+m[2].padStart(5,"0")) : new Date(s); return isNaN(t)? null : t; }
function dur(ms){ if(ms==null||ms<0) return ""; const m=Math.floor(ms/60000); return m<60? m+" min" : Math.floor(m/60)+" h "+String(m%60).padStart(2,"0")+" min"; }
function timer(start){ const t=when(start); return t? `<b class="timer" data-start="${t.getTime()}">⏱ ${dur(Date.now()-t)}</b> · ` : ""; }
setInterval(()=>document.querySelectorAll(".timer[data-start]").forEach(e=>{ e.textContent="⏱ "+dur(Date.now()-Number(e.dataset.start)); }), 30000);
document.querySelectorAll('.fcnav a').forEach(a=>{if(a.dataset.p===location.pathname.replace(/\.html$/,'')||(a.dataset.p==='/'&&location.pathname==='/index.html'))a.classList.add('cur')})</script>

<main>
<header><h1>Agents live</h1><a href="/">← roadmap</a><span id="at">checking…</span></header>

<h2>Meters &amp; who gets the next task <span class="count" id="metat"></span></h2>
<style>
.mt{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin:6px 0 14px}
.mc{border:1px solid #2a3340;border-radius:10px;padding:10px 12px;background:#11161d}
.mc b{font-size:14px}.mc .pl{opacity:.65;font-size:12px}
.bar{height:9px;border-radius:5px;background:#222a35;margin:6px 0 2px;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;transition:width .6s}
.wr{font-size:12px;display:flex;justify-content:space-between;opacity:.85}
.pk{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.pk div{border:1px solid #2a3340;border-radius:8px;padding:8px 10px;font-size:13px}.pk .no{opacity:.6}
</style>
<div class="mt" id="meters"></div>
<div class="pk" id="picks"></div>
<h2>Usage &amp; limits <span class="count" id="limat"></span></h2>
<div style="overflow-x:auto"><table class="lim"><thead><tr><th>Agent</th><th>Plan / limit</th><th>Usage now</th><th>Resets</th></tr></thead><tbody id="limits"></tbody></table></div>

<h2>☁ Working in the cloud <span class="count" id="ncloud"></span></h2>
<div class="cards" id="cloud"></div>
<h2>☁ Cloud agents with no task</h2>
<div class="chips" id="idle"></div>

<h2>🖥 Working on this PC <span class="count" id="npc"></span></h2>
<div class="cards" id="pc"></div>
<h2>Out of rotation</h2>
<div class="chips" id="out"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const IDLE_WHAT={arena:"medium jobs, new chat per task",openhands:"short jobs, 10 a day",opencode:"'/oc' on a GitHub issue",goose:"long jobs: label an issue 'goose'",qwen:"label 'qwen'",cursor:"label 'cursor'",grok:"label 'grok'",antigravity:"small exact-spec jobs via agy CLI (free tier, runs on the PC - watchdog first)",codex:"Codex Cloud (browser) or label 'codex' with OPENAI_API_KEY - out by your S154 ruling"};
function ago(iso){if(!iso)return"";const t=new Date(iso);if(isNaN(t))return"";const m=Math.round((Date.now()-t)/60000);return m<1?"just now":m<60?m+" min ago":Math.floor(m/60)+" h "+(m%60)+" min ago";}
function vclass(v){v=v||"";return /merged|passed/.test(v)?"v-good":/PR open/.test(v)?"v-warn":/failure|failed|cancel/.test(v)?"v-bad":"v-work";}
async function get(u){try{const r=await fetch(u,{cache:"no-store"});return await r.json();}catch(e){return null;}}
async function load(){
  const [cloud,pc,roster]=await Promise.all([get("/api/cloud"),get("/api/agents"),get("/api/roster")]);
  const runs=(cloud&&cloud.runs)||[];
  $("ncloud").textContent=runs.length?`· ${runs.length}`:"";
  $("cloud").innerHTML=runs.map(r=>{
    const pr=r.pr?`<div class="meta">PR <a href="${esc(r.pr.url)}" target="_blank" rel="noopener">#${r.pr.number}</a> ${esc(r.pr.state.toLowerCase())}${r.pr.draft?" draft":""} · CI ${esc(r.pr.ci)}</div>`:"";
    const gr=r.gh_run?`<div class="meta">GitHub run: ${esc(r.gh_run.status)}${r.gh_run.conclusion?" · "+esc(r.gh_run.conclusion):""} · updated ${ago(r.gh_run.updatedAt)} · <a href="${esc(r.gh_run.url)}" target="_blank" rel="noopener">log</a></div>`:"";
    const br=r.branch?`<div class="meta">branch ${esc(r.branch)} ${r.branch_exists?(r.last_commit?`· last commit ${ago(r.last_commit.date)}: ${esc(r.last_commit.msg)}`:"· pushed"):"· not pushed yet"}</div>`:"";
    return `<div class="card"><span class="pill who">${esc(r.agent)}</span>
      <div class="t">${esc(r.title)}</div>
      <div class="verdict ${vclass(r.verdict)}">${esc(r.verdict)}</div>
      <div class="meta">${timer(r.started)}started ${ago(r.started)}${r.link?` · <a href="${esc(r.link)}" target="_blank" rel="noopener">watch</a>`:""}</div>${br}${pr}${gr}</div>`;}).join("")||`<p class="empty">No cloud agent is working.</p>`;
  $("idle").innerHTML=((cloud&&cloud.idle)||[]).map(a=>`<span class="chip"><b>${esc(a)}</b> · ${esc(IDLE_WHAT[a]||"")}</span>`).join("")||`<span class="empty">all busy</span>`;

  const rows=(pc&&pc.agents)||[];
  const live=rows.filter(r=>r.alive&&r.task);
  $("npc").textContent=live.length?`· ${live.length}`:"";
  $("pc").innerHTML=live.map(r=>`<div class="card pc"><span class="pill who">${esc(r.name)}</span>
      <div class="t">${esc(r.title||r.task)}</div>
      <div class="meta">${timer(r.started)}${esc(r.branch||"")} ${r.last_commit?"· "+esc(r.last_commit):""}</div>
      ${r.out_tail?`<pre>${esc(r.out_tail)}</pre>`:""}</div>`).join("")||`<p class="empty">No agent process is running on this PC.</p>`;
  const out=Object.entries(roster||{}).filter(([k,v])=>v&&typeof v==="object"&&!v.in_rotation).map(([k])=>k);
  $("out").innerHTML=out.map(a=>`<span class="chip"><b>${esc(a)}</b></span>`).join("")||`<span class="empty">none</span>`;
  $("at").innerHTML="checked "+new Date().toLocaleTimeString()+' · <button type="button" onclick="load();loadLimits()">Refresh</button>';
}
load(); // S192: no timed redraw (operator: "not reload") - use the Refresh button
function nextReset(r){ if(!r||r.type==="none")return null; const now=new Date();
  if(r.type==="date") return new Date(r.at);
  if(r.type==="daily_utc"){const [h,m]=r.time.split(":").map(Number); const d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),now.getUTCDate(),h,m)); if(d<=now)d.setUTCDate(d.getUTCDate()+1); return d;}
  if(r.type==="weekly_at"){const d=new Date(r.at); while(d<=now)d.setUTCDate(d.getUTCDate()+7); return d;}
  if(r.type==="monthly_day"){const d=new Date(Date.UTC(now.getUTCFullYear(),now.getUTCMonth(),r.day)); if(d<=now)d.setUTCMonth(d.getUTCMonth()+1); return d;}
  return null;}
function inTime(d){const m=Math.round((d-Date.now())/60000); if(m<0)return "passed"; if(m<60)return "in "+m+" min"; if(m<2880)return "in "+Math.floor(m/60)+" h "+(m%60)+" min"; return "in "+Math.round(m/1440)+" days";}
async function loadLimits(){ const L=await get("/api/limits"); if(!L)return;
  $("limits").innerHTML=(L.agents||[]).map(a=>{const d=nextReset(a.reset); const out=/OUT|REACHED|ran out|ENDS/.test(a.status||"");
    return `<tr><td><b>${esc(a.agent)}</b>${a.note?`<div class="meta">${esc(a.note)}</div>`:""}</td><td>${esc(a.plan)}<div class="meta">${esc(a.limit)}</div></td>
    <td class="${out?"out":""}">${esc(a.status||"-")} ${a.is_live?'<span class="live">LIVE</span>':""}<div class="meta">${esc(a.source||"")}</div></td>
    <td>${d?esc(d.toLocaleString([], {weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}))+`<div class="meta">${inTime(d)}</div>`:'<span class="meta">no reset - top-up</span>'}</td></tr>`;}).join("");
  $("limat").textContent="· registry "+(L.updated||"")+", live rows re-read every 10 min";}
loadLimits();

async function loadMeters(){ const D=await get("/api/meters"); if(!D||!D.meters)return;
  const col=u=>u>=90?"#ef4444":u>=70?"#f59e0b":"#22c55e";
  const left=iso=>{if(!iso)return"";const ms=Date.parse(iso)-Date.now();if(!(ms>0))return"";const h=Math.floor(ms/36e5);return h>=24?` · resets ${Math.floor(h/24)}d ${h%24}h`:` · resets ${h}h ${Math.floor(ms%36e5/6e4)}m`;};
  $("meters").innerHTML=D.meters.meters.map(m=>`<div class="mc"><b>${m.agent}</b> <span class="pl">${m.plan}${m.live?"":" · stale/no reading"}</span>`+
    (m.windows.length?m.windows.map(w=>{const u=Math.max(0,Math.min(100,+w.used_pct||0));return `<div class="bar"><i style="width:${u}%;background:${col(+w.used_pct||0)}"></i></div><div class="wr"><span>${w.name}: ${(+w.used_pct).toFixed(0)}% used${left(w.resets_at)}</span></div>`;}).join(""):`<div class="wr"><span>${m.note||"no reading"}</span></div>`)+
    (m.windows.length&&m.note?`<div class="wr"><span>${m.note}</span></div>`:"")+`</div>`).join("");
  const r=D.meters.router_today; $("metat").textContent=`PC ${D.pc} · model router today: ${r.prompts} prompts `+Object.entries(r.requests_by_model).map(([k,v])=>k.replace("claude-","")+" "+v).join(", ");
  $("picks").innerHTML=Object.entries(D.picks).map(([k,p])=>`<div class="${p.pick?"":"no"}"><b>${k}</b> &rarr; ${p.pick?"<b>"+p.pick+"</b>":"queue (none free)"}<br><span style="opacity:.7">${p.pick?p.reason:p.ranked.map(x=>x.seat+": "+x.why).join("<br>")}</span></div>`).join("");
}
loadMeters(); setInterval(loadMeters,60000);

</script>
</body>
</html>
