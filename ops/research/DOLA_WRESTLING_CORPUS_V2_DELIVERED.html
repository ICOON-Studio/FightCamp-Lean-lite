// ─── CAPSULE RENDERING ───────────────────────────────────────────────
function makeCapsuleMesh(p0, p1, r, color) {
  const obj = new THREE.Group();
  const dir = new THREE.Vector3().subVectors(p1, p0);
  const len = dir.length();
  const mid = new THREE.Vector3().addVectors(p0, p1).multiplyScalar(0.5);

  if (len > 0.001) {
    const cylGeo = new THREE.CylinderGeometry(r, r, len, 12, 1, true);
    const mat = new THREE.MeshPhongMaterial({color, flatShading:true});
    const cyl = new THREE.Mesh(cylGeo, mat);
    cyl.position.copy(mid);
    cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
    obj.add(cyl);
  }
  const sphGeo = new THREE.SphereGeometry(r, 12, 10);
  [p0, p1].forEach(p => {
    const s = new THREE.Mesh(sphGeo, new THREE.MeshPhongMaterial({color}));
    s.position.copy(p);
    obj.add(s);
  });
  return obj;
}

// ─── SEGMENT-SEGMENT DISTANCE (Ericson 5.1.9) ───────────────────────
function segmentData(p0, p1, q0, q1) {
  const u = new THREE.Vector3().subVectors(p1, p0);
  const v = new THREE.Vector3().subVectors(q1, q0);
  const w = new THREE.Vector3().subVectors(p0, q0);
  const a = u.dot(u), b = u.dot(v), c = v.dot(v);
  const d = u.dot(w), e = v.dot(w);
  const det = a*c - b*b;
  let s = 0, t = 0;

  if (det < 1e-10) {
    s = 0; t = (b*s + e) / c; t = THREE.MathUtils.clamp(t, 0, 1);
  } else {
    s = (b*e - c*d) / det;
    t = (a*e - b*d) / det;
    s = THREE.MathUtils.clamp(s, 0, 1);
    t = THREE.MathUtils.clamp(t, 0, 1);
  }

  const pS = new THREE.Vector3().addScaledVector(u, s).add(p0);
  const qT = new THREE.Vector3().addScaledVector(v, t).add(q0);
  return { dist: pS.distanceTo(qT), s, t, pS, qT };
}

function surfaceGap(capA, capB) {
  const { dist } = segmentData(capA.p0, capA.p1, capB.p0, capB.p1);
  return dist - (capA.r + capB.r);
}

// ─── GRIP POSITION ───────────────────────────────────────────────────
function gripPoint(cap, blend) {
  return new THREE.Vector3().lerpVectors(cap.p0, cap.p1, THREE.MathUtils.clamp(blend, 0, 1));
}

// ─── TRANSFORM UTILITIES ─────────────────────────────────────────────
function buildWorldTransform(state) {
  const t = new THREE.Vector3(state.x || 0, state.y || 0, state.z || 0);
  const yaw = state.yaw || 0;
  const pitch = state.pitch || 0;
  const roll = state.roll || 0;

  const xf = new THREE.Matrix4();
  xf.makeTranslation(t.x, t.y, t.z);
  
  const my = new THREE.Matrix4(); my.makeRotationY(yaw);
  const mp = new THREE.Matrix4(); mp.makeRotationX(pitch);
  const mr = new THREE.Matrix4(); mr.makeRotationZ(roll);
  
  xf.multiply(my).multiply(mp).multiply(mr);
  return xf;
}

function applyRotationAroundPoint(pt, rotVec, p0, p1) {
  const q = new THREE.Quaternion().setFromEuler(
    new THREE.Euler(rotVec.x, rotVec.y, rotVec.z, 'XYZ')
  );
  const v0 = new THREE.Vector3().subVectors(p0, pt).applyQuaternion(q).add(pt);
  const v1 = new THREE.Vector3().subVectors(p1, pt).applyQuaternion(q).add(pt);
  return [v0, v1];
}

// ─── BUILD CAPSULES — NOW WITH LIVE LIMB ROTATIONS ────────────────────
function buildCapsules(state) {
  const out = {};
  const baseXf = buildWorldTransform(state);
  const baseInv = baseXf.clone().invert();

  // First build unrotated torso in local space
  const torsoDef = LIMBS.torso;
  let p0 = new THREE.Vector3(...torsoDef.p0).applyMatrix4(baseXf);
  let p1 = new THREE.Vector3(...torsoDef.p1).applyMatrix4(baseXf);
  out.torso = { p0, p1, r: torsoDef.r, name:'torso' };

  // Process each limb — apply stored rotation around joint
  for (const [name, def] of Object.entries(LIMBS)) {
    if (name === 'torso') continue;
    
    const limbRot = state.limbs?.[name] || 0;
    const joint = new THREE.Vector3(...def.joint).applyMatrix4(baseXf);
    
    // Base segment endpoints in world space
    let w0 = new THREE.Vector3(...def.p0).applyMatrix4(baseXf);
    let w1 = new THREE.Vector3(...def.p1).applyMatrix4(baseXf);
    
    // Apply rotation around joint — single angle = Y-axis at shoulder
    if (limbRot !== 0) {
      const q = new THREE.Quaternion().setFromAxisAngle(
        new THREE.Vector3(0, 1, 0), limbRot
      );
      const rPt = (p) => p.clone().sub(joint).applyQuaternion(q).add(joint);
      w0 = rPt(w0);
      w1 = rPt(w1);
    }
    
    out[name] = { p0:w0, p1:w1, r:def.r, name };
  }
  return out;
}

// ─── COST EVALUATOR — NOW AUDITS ALL PAIRS ──────────────────────────
function makeCostFn(pose) {
  return (fullState) => {
    const F1 = buildCapsules(fullState.F1);
    const F2 = buildCapsules(fullState.F2);
    let total = 0;
    
    // All-pairs penetration check
    let worstPen = 0, penPair = '';
    for (const [n1, c1] of Object.entries(F1)) {
      for (const [n2, c2] of Object.entries(F2)) {
        const gap = surfaceGap(c1, c2);
        if (gap < 0) {
          const pen = -gap;
          total += pen * pen * 900;
          if (pen > worstPen) { worstPen = pen; penPair = `F1.${n1} ↔ F2.${n2}`; }
        }
      }
    }

    // Declared contact targets
    let worstTouch = 0, touchPair = '';
    for (const c of pose.contacts || []) {
      const [b1, n1] = c.a.split('.');
      const [b2, n2] = c.b.split('.');
      const capA = b1 === 'F1' ? F1[n1] : F2[n1];
      const capB = b2 === 'F1' ? F1[n2] : F2[n2];
      const gap = surfaceGap(capA, capB);
      const err = Math.abs(gap - (c.off || 0));
      total += err * err * 1200;
      if (err > worstTouch) { worstTouch = err; touchPair = `${c.a} ↔ ${c.b}`; }
    }

    // Grips
    let worstGrip = 0, gripPair = '';
    for (const g of pose.grips || []) {
      const [bFrom, nFrom] = g.from.split('.');
      const [bTo,   nTo]   = g.to.split('.');
      const capFrom = bFrom === 'F1' ? F1[nFrom] : F2[nFrom];
      const capTo   = bTo   === 'F1' ? F1[nTo]   : F2[nTo];
      const handPos = capFrom.p1;
      const targetPos = gripPoint(capTo, g.blend);
      const err = handPos.distanceTo(targetPos) - (g.off || 0);
      const gripErr = Math.abs(err);
      total += gripErr * gripErr * 1500;
      if (gripErr > worstGrip) { worstGrip = gripErr; gripPair = `${g.from} → ${g.to} @${g.blend}`; }
    }

    // Mat violation
    let worstMat = 0, matPair = '';
    for (const [bName, body] of [['F1',F1], ['F2',F2]]) {
      for (const [lName, cap] of Object.entries(body)) {
        const low = Math.min(cap.p0.y, cap.p1.y) - cap.r;
        const v = MAT_SURFACE_Y - low;
        if (v > 0) {
          total += v * v * 1200;
          if (v > worstMat) { worstMat = v; matPair = `${bName}.${lName}`; }
        }
      }
    }

    // Hold lift — now surfaced and weighted
    let worstHold = 0, holdPart = '';
    for (const [bName, parts] of Object.entries(pose.hold || {})) {
      const body = bName === 'F1' ? F1 : F2;
      for (const p of parts) {
        const cap = body[p];
        const lowest = Math.min(cap.p0.y, cap.p1.y) - cap.r;
        const lift = Math.max(0, lowest - MAT_SURFACE_Y);
        if (lift > 0.001) {
          total += lift * lift * 1000;
          if (lift > worstHold) { worstHold = lift; holdPart = `${bName}.${p}`; }
        }
      }
    }

    return { 
      cost: total, worstPen, penPair, worstTouch, touchPair,
      worstGrip, gripPair, worstMat, matPair, worstHold, holdPart
    };
  };
}

function makeInitial(pose) {
  return {
    F1: { pitch:0, roll:0, ...pose.init.F1, limbs:zeroLimbs() },
    F2: { pitch:0, roll:0, ...pose.init.F2, limbs:zeroLimbs() }
  };
}

function perturb(state, dof, delta) {
  const s = cloneState(state);
  const [body, cat, sub] = dof.split('.');
  if (sub) {
    if (!s[body][cat]) s[body][cat] = {};
    s[body][cat][sub] = (s[body][cat][sub] || 0) + delta;
  } else {
    s[body][cat] = (s[body][cat] || 0) + delta;
  }
  return s;
}

function listRootDOFs() {
  const out = [];
  for (const b of ['F1','F2']) {
    for (const k of ['x','y','z','yaw','pitch','roll']) out.push(`${b}.${k}`);
  }
  return out;
}

function listLimbDOFs() {
  const out = [];
  for (const b of ['F1','F2']) {
    for (const l of ['rArm','lArm']) out.push(`${b}.limbs.${l}`); // Start with shoulders only
  }
  return out;
}

function listAllDOFs() {
  return [...listRootDOFs(), ...listLimbDOFs()];
}

function solvePose(pose, statusCb) {
  let state = makeInitial(pose);
  let costFn = makeCostFn(pose);
  let evals = 0;
  const best = (s) => { ++evals; return { ...costFn(s), state:s }; };
  let curr = best(state);

  const runPhase = (label, dofList, stepSz) => {
    let improved;
    let step = stepSz;
    do {
      improved = false;
      for (const dof of dofList) {
        for (const sc of [1, 0.4, 0.15]) {
          for (const sign of [-1, 1]) {
            const trial = best(perturb(curr.state, dof, sign*sc*step));
            if (trial.cost < curr.cost) {
              curr = trial;
              improved = true;
              statusCb({...curr, evals, phase:label});
              break;
            }
          }
        }
      }
      if (!improved) step *= 0.45;
    } while (step > 0.004 && evals < 20000);
  };

  runPhase('Root Placement', listRootDOFs(), STEP_ROOT.pos);
  runPhase('Shoulder Refine', listLimbDOFs(), STEP_LIMB);
  runPhase('Root Polish', listRootDOFs(), STEP_ROOT.pos);

  return { ...curr, evals };
}

// ─── RENDERING ───────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0c10);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
camera.position.set(1.8, 1.2, 2.2);
const renderer = new THREE.WebGLRenderer({antialias:true});
const container = document.getElementById('canvas-container');
container.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.DirectionalLight(0xffffff, 1.2).position.set(3,4,2));
scene.add(new THREE.AmbientLight(0xffffff, 0.5));

const matMesh = new THREE.Mesh(
  new THREE.PlaneGeometry(6,6),
  new THREE.MeshPhongMaterial({color:0x1a3d3b, side:THREE.DoubleSide})
);
matMesh.rotation.x = -Math.PI/2;
matMesh.position.y = MAT_SURFACE_Y - 0.005;
scene.add(matMesh);

let vizGroup = new THREE.Group(); scene.add(vizGroup);

function renderPose(state) {
  vizGroup.clear();
  for (const [bName, body] of [['F1',buildCapsules(state.F1)], ['F2',buildCapsules(state.F2)]]) {
    for (const [name, cap] of Object.entries(body)) {
      const src = LIMBS[name];
      vizGroup.add(makeCapsuleMesh(cap.p0, cap.p1, cap.r, src.color));
    }
  }
}

function resize() {
  const r = container.getBoundingClientRect();
  renderer.setSize(r.width, r.height);
  camera.aspect = r.width / r.height;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();

// ─── UI ──────────────────────────────────────────────────────────────
const select = document.getElementById('poseSelect');
for (const [k,p] of Object.entries(POSES)) {
  const opt = document.createElement('option');
  opt.value = k;
  opt.textContent = `[${p.category}] ${p.name}`;
  select.appendChild(opt);
}

function fmtM(v) { return v.toFixed(4).padStart(8); }

function showStatus(result) {
  const area = document.getElementById('statusArea');
  const penOk = result.worstPen <= PASS_PEN;
  const toOk = result.worstTouch <= PASS_TOUCH;
  const gOk  = result.worstGrip <= PASS_GRIP;
  const mOk  = result.worstMat <= PASS_MAT;
  const hOk  = result.worstHold <= PASS_HOLD;
  const pass = penOk && toOk && gOk && mOk && hOk;

  area.innerHTML = `
    <h3>${result.phase || 'Final Result'}</h3>
    <div class="status ${pass?'pass':'fail'}">
      Penetration: <span class="val ${penOk?'ok':'bad'}">${fmtM(result.worstPen)} m</span><br>
      &nbsp;All-pairs worst: ${result.penPair || '—'}<br>
      Contact err: <span class="val ${toOk?'ok':'bad'}">${fmtM(result.worstTouch)} m</span><br>
      &nbsp;Worst pair: ${result.touchPair || '—'}<br>
      Grip error:  <span class="val ${gOk?'ok':'bad'}">${fmtM(result.worstGrip)} m</span><br>
      &nbsp;Worst: ${result.gripPair || '—'}<br>
      Mat violation:<span class="val ${mOk?'ok':'bad'}">${fmtM(result.worstMat)} m</span><br>
      &nbsp;Worst: ${result.matPair || '—'}<br>
      Hold lift:   <span class="val ${hOk?'ok':'bad'}">${fmtM(result.worstHold)} m</span><br>
      &nbsp;Lifted: ${result.holdPart || '—'}<br>
      Evaluations: ${result.evals}<br>
      <strong>${pass ? '✓ ALL PASS' : '✗ FAIL — see above'}</strong>
    </div>
  `;
}

document.getElementById('solveBtn').addEventListener('click', async () => {
  const key = select.value;
  const pose = POSES[key];
  document.getElementById('statusArea').innerHTML = `<div class="status">Solving: ${pose.name}…</div>`;
  await new Promise(r => setTimeout(r, 30));

  const result = solvePose(pose, (mid) => {
    renderPose(mid.state);
    showStatus(mid);
  });

  renderPose(result.state);
  showStatus(result);
});

renderPose(makeInitial(POSES.collarTie));
</script>
