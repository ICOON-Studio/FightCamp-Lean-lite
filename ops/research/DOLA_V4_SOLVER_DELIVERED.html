<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pose Solver — Surface Gap / Root DOF / Descent</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:monospace,system-ui; }
  html, body { height:100%; overflow:hidden; background:#0b0c10; color:#e6e6e6; }
  #split { display:flex; height:100vh; }
  #panel { width:380px; background:#1f2833; padding:12px; overflow-y:auto; border-right:2px solid #45a29e; }
  #panel h2 { font-size:1.1em; margin:0.6em 0 0.3em; color:#66fcf1; border-bottom:1px solid #45a29e; padding-bottom:0.2em; }
  #panel h3 { font-size:0.95em; margin:0.5em 0 0.2em; color:#c5c6c7; }
  .status { margin:0.4em 0; padding:0.5em; border-radius:4px; background:#0b0c10; font-size:0.85em; line-height:1.5; }
  .pass { border-left:3px solid #4ade80; }
  .fail { border-left:3px solid #f87171; }
  .val { display:inline-block; width:90px; text-align:right; font-weight:bold; }
  .ok { color:#4ade80; }
  .bad { color:#f87171; }
  button { width:100%; padding:0.7em; margin:0.5em 0; background:#45a29e; color:#000; border:none; border-radius:4px; font-weight:bold; cursor:pointer; font-size:1em; }
  button:hover { background:#66fcf1; }
  select { width:100%; padding:0.5em; margin:0.3em 0; background:#0b0c10; color:#e6e6e6; border:1px solid #45a29e; border-radius:4px; }
  #canvas-container { flex:1; position:relative; }
  small { color:#888; font-size:0.75em; }
</style>
</head>
<body>
<div id="split">
  <div id="panel">
    <h2>Pose Solver v4</h2>
    <select id="poseSelect"></select>
    <button id="solveBtn">SOLVE — Dig Out & Converge</button>
    <div id="statusArea"></div>
    <h3>Pass Criteria</h3>
    <div class="status">
      pen ≤ 0.006 m<br>
      touch ≤ 0.012 m<br>
      mat ≤ 0.012 m
    </div>
    <h3>Notes</h3>
    <div class="status">
      • Surface gap, not centre distance<br>
      • 6 root DOF/body, 3-phase solve<br>
      • Descent only — never accept uphill<br>
      • No aliased parts<br>
      • Starts deliberately overlapping
    </div>
  </div>
  <div id="canvas-container"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── CONSTANTS ───────────────────────────────────────────────────────
const MAT_SURFACE_Y = 0;
const PASS_PEN   = 0.006;
const PASS_TOUCH = 0.012;
const PASS_MAT   = 0.012;

// ─── GEOMETRY: Capsule segment = p0→p1 with radius ───────────────────
function makeCapsule(p0, p1, r, color) {
  const obj = new THREE.Group();
  const dir = new THREE.Vector3().subVectors(p1, p0);
  const len = dir.length();
  const mid = new THREE.Vector3().addVectors(p0, p1).multiplyScalar(0.5);

  if (len > 0.001) {
    const cylGeo = new THREE.CylinderGeometry(r, r, len, 12, 1, true);
    const mat = new THREE.MeshPhongMaterial({color, flatShading:true});
    const cyl = new THREE.Mesh(cylGeo, mat);
    cyl.position.copy(mid);
    cyl.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), dir.clone().normalize());
    obj.add(cyl);
  }
  const sphGeo = new THREE.SphereGeometry(r, 12, 10);
  [p0, p1].forEach(p => {
    const s = new THREE.Mesh(sphGeo, new THREE.MeshPhongMaterial({color}));
    s.position.copy(p);
    obj.add(s);
  });
  obj.userData = { p0:p0.clone(), p1:p1.clone(), r };
  return obj;
}

// ─── SEGMENT-SEGMENT DISTANCE (Ericson 5.1.9) ───────────────────────
function segmentDistance(p0, p1, q0, q1) {
  const u = new THREE.Vector3().subVectors(p1, p0);
  const v = new THREE.Vector3().subVectors(q1, q0);
  const w = new THREE.Vector3().subVectors(p0, q0);
  const a = u.dot(u), b = u.dot(v), c = v.dot(v);
  const d = u.dot(w), e = v.dot(w);
  const det = a*c - b*b;
  let s = 0, t = 0;

  if (det < 1e-10) {
    s = 0; t = (b*s + e) / c; t = THREE.MathUtils.clamp(t, 0, 1);
  } else {
    s = (b*e - c*d) / det;
    t = (a*e - b*d) / det;
    s = THREE.MathUtils.clamp(s, 0, 1);
    t = THREE.MathUtils.clamp(t, 0, 1);
  }

  const pS = new THREE.Vector3().addScaledVector(u, s).add(p0);
  const qT = new THREE.Vector3().addScaledVector(v, t).add(q0);
  return pS.distanceTo(qT);
}

function surfaceGap(capA, capB) {
  const d = segmentDistance(capA.p0, capA.p1, capB.p0, capB.p1);
  return d - (capA.r + capB.r); // <0 = penetrating
}

// ─── LIMB DEFINITION — NO ALIASES ────────────────────────────────────
const LIMBS = {
  torso:    { p0:[0,0.50,0], p1:[0,0.85,0], r:0.14, color:0x4299e1 },
  head:     { p0:[0,0.85,0], p1:[0,1.00,0], r:0.11, color:0xed8936 },
  neck:     { p0:[0,0.82,0], p1:[0,0.88,0], r:0.08, color:0xd69e2e }, // REAL
  rArm:     { p0:[0.12,0.75,0], p1:[0.38,0.60,0], r:0.06, color:0x48bb78 },
  lArm:     { p0:[-0.12,0.75,0], p1:[-0.38,0.60,0], r:0.06, color:0x48bb78 },
  rLeg:     { p0:[0.08,0.50,0], p1:[0.12,0.15,0], r:0.07, color:0xe53e3e },
  lLeg:     { p0:[-0.08,0.50,0], p1:[-0.12,0.15,0], r:0.07, color:0xe53e3e },
  rHip:     { p0:[0.05,0.48,0], p1:[0.10,0.40,0], r:0.09, color:0xc53030 }, // REAL
  back:     { p0:[0,0.60,0.08], p1:[0,0.80,0.04], r:0.12, color:0x2b6cb0 }   // REAL
};

// ─── POSE DEFINITIONS — ALL `off:` NO `dist:` ────────────────────────
const POSES = {
  sideControl: {
    name: 'Side Control / Mount',
    // Start overlapping deliberately
    init: { F1:{x:0,y:0.5,z:0, yaw:0}, F2:{x:0.12,y:0.5,z:-0.08, yaw:0.3} },
    contacts: [
      { a:'F1.torso', b:'F2.torso', off:0.00, tol:0.012 }
    ]
  },
  closedGuard: {
    name: 'Closed Guard',
    init: { F1:{x:0,y:0.5,z:0, yaw:0}, F2:{x:-0.15,y:0.5,z:0.05, yaw:-0.25} },
    contacts: [
      { a:'F1.rArm',  b:'F2.torso', off:0.00, tol:0.012 },
      { a:'F1.rLeg',  b:'F2.torso', off:0.00, tol:0.012 }
    ]
  },
  armbar: {
    name: 'Armbar',
    init: { F1:{x:0,y:0.5,z:0, yaw:0}, F2:{x:0.2,y:0.5,z:0.1, yaw:Math.PI} },
    contacts: [
      { a:'F1.rLeg',  b:'F2.rArm',  off:0.00, tol:0.012 }
    ]
  },
  rearNaked: {
    name: 'Rear Naked Choke',
    init: { F1:{x:0,y:0.5,z:-0.1, yaw:0}, F2:{x:0.05,y:0.5,z:0.15, yaw:0} },
    contacts: [
      { a:'F1.rArm',  b:'F2.neck',  off:0.00, tol:0.012 },
      { a:'F1.back',  b:'F2.torso', off:0.00, tol:0.012 }
    ]
  },
  mount: {
    name: 'Mount',
    init: { F1:{x:0,y:0.6,z:0, yaw:0}, F2:{x:0,y:0.4,z:0.05, yaw:0} },
    contacts: [
      { a:'F1.rLeg',  b:'F2.rHip', off:0.00, tol:0.012 },
      { a:'F1.torso', b:'F2.torso', off:0.00, tol:0.012 }
    ]
  }
};

// ─── BODY STATE → CAPSULES ────────────────────────────────────────────
function buildCapsules(state) {
  const out = {};
  const T = new THREE.Vector3(state.x, state.y, state.z);
  const Y = state.yaw;
  const rot = (p) => {
    const [x,y,z] = p;
    const c = Math.cos(Y), s = Math.sin(Y);
    return new THREE.Vector3(c*x - s*z, y, s*x + c*z).add(T);
  };
  for (const [name, def] of Object.entries(LIMBS)) {
    out[name] = {
      p0: rot(def.p0),
      p1: rot(def.p1),
      r:  def.r,
      name
    };
  }
  return out;
}

// ─── COST EVALUATOR ──────────────────────────────────────────────────
function makeCostFn(pose) {
  return (fullState) => {
    const F1 = buildCapsules(fullState.F1);
    const F2 = buildCapsules(fullState.F2);
    let total = 0;
    let worstPen = 0, worstTouch = 0, worstMat = 0;
    let penPair='', touchPair='', matPair='';

    // Contacts — surface gap
    for (const c of pose.contacts) {
      const gap = surfaceGap(F1[c.a.split('.')[1]], F2[c.b.split('.')[1]]);
      const err = Math.abs(gap - (c.off || 0));
      total += err * err * 1200;
      if (err > worstTouch) { worstTouch = err; touchPair = `${c.a} ↔ ${c.b}`; }
      if (gap < 0) {
        const pen = -gap;
        total += pen * pen * 900;
        if (pen > worstPen) { worstPen = pen; penPair = `${c.a} ↔ ${c.b}`; }
      }
    }

    // Mat violation — all capsules both bodies
    for (const [bName, body] of [['F1',F1], ['F2',F2]]) {
      for (const [lName, cap] of Object.entries(body)) {
        const low = Math.min(cap.p0.y, cap.p1.y) - cap.r;
        const v = MAT_SURFACE_Y - low;
        if (v > 0) {
          total += v * v * 1200;
          if (v > worstMat) { worstMat = v; matPair = `${bName}.${lName}`; }
        }
      }
    }
    return { cost:total, worstPen, worstTouch, worstMat, penPair, touchPair, matPair };
  };
}

// ─── SOLVER: Coordinate Descent, 3-Phase ─────────────────────────────
const STEP_ROOT = { xyz:0.06, ang:0.08 };
const STEP_LIMB = 0.08;

function cloneState(s) {
  return { F1:{...s.F1, limbs:{...s.F1.limbs}}, F2:{...s.F2, limbs:{...s.F2.limbs}} };
}

function zeroLimbs() {
  return { torso:0, head:0, neck:0, rArm:0, lArm:0, rLeg:0, lLeg:0, rHip:0, back:0 };
}

function makeInitial(pose) {
  return {
    F1: { ...pose.init.F1, limbs:zeroLimbs() },
    F2: { ...pose.init.F2, limbs:zeroLimbs() }
  };
}

function perturb(state, dof, delta) {
  const s = cloneState(state);
  const [body, key, sub] = dof.split('.');
  if (sub) s[body][key][sub] += delta;
  else s[body][key] += delta;
  return s;
}

function listRootDOFs() {
  const out = [];
  for (const b of ['F1','F2']) {
    for (const k of ['x','y','z','yaw','pitch','roll']) out.push(`${b}.${k}`);
  }
  return out;
}
function listAllDOFs() {
  const out = listRootDOFs();
  for (const b of ['F1','F2']) {
    for (const l of Object.keys(LIMBS)) out.push(`${b}.limbs.${l}`);
  }
  return out;
}

function solvePose(pose, statusCb) {
  let state = makeInitial(pose);
  let costFn = makeCostFn(pose);
  let evals = 0;
  const best = (s) => { ++evals; return { ...costFn(s), state:s }; };
  let curr = best(state);

  const runPhase = (label, dofList, stepSz, penEnable) => {
    let improved;
    let step = stepSz;
    do {
      improved = false;
      for (const dof of dofList) {
        for (const sc of [1, 0.4, 0.15]) {
          for (const sign of [-1, 1]) {
            const trial = best(perturb(curr.state, dof, sign*sc*step));
            if (trial.cost < curr.cost) {
              curr = trial;
              improved = true;
              statusCb({...curr, evals, phase:label});
              break;
            }
          }
        }
      }
      if (!improved) step *= 0.45;
    } while (step > 0.004 && evals < 15000);
  };

  // Phase 1 — Root only, establish placement
  runPhase('Root Placement', listRootDOFs(), STEP_ROOT.xyz, false);
  // Phase 2 — All DOFs, resolve contact & penetration
  runPhase('Full Refine', listAllDOFs(), STEP_LIMB, true);
  // Phase 3 — Root only, final polish
  runPhase('Root Polish', listRootDOFs(), STEP_ROOT.xyz, false);

  return { ...curr, evals };
}

// ─── RENDERING ───────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0c10);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
camera.position.set(1.8, 1.2, 2.2);
const renderer = new THREE.WebGLRenderer({antialias:true});
const container = document.getElementById('canvas-container');
container.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const light1 = new THREE.DirectionalLight(0xffffff, 1.2);
light1.position.set(3,4,2);
scene.add(light1, new THREE.AmbientLight(0xffffff, 0.5));

const matGeo = new THREE.PlaneGeometry(6,6);
const matMat = new THREE.MeshPhongMaterial({color:0x1a3d3b, side:THREE.DoubleSide});
const matMesh = new THREE.Mesh(matGeo, matMat);
matMesh.rotation.x = -Math.PI/2;
matMesh.position.y = MAT_SURFACE_Y - 0.005;
scene.add(matMesh);

let vizGroup = new THREE.Group(); scene.add(vizGroup);

function renderPose(state) {
  vizGroup.clear();
  for (const [bName, body] of [['F1',buildCapsules(state.F1)], ['F2',buildCapsules(state.F2)]]) {
    for (const [name, cap] of Object.entries(body)) {
      const src = LIMBS[name];
      const mesh = makeCapsule(cap.p0, cap.p1, cap.r, src.color);
      vizGroup.add(mesh);
    }
  }
}

function resize() {
  const r = container.getBoundingClientRect();
  renderer.setSize(r.width, r.height);
  camera.aspect = r.width / r.height;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
})();

// ─── UI ──────────────────────────────────────────────────────────────
const select = document.getElementById('poseSelect');
for (const [k,p] of Object.entries(POSES)) {
  const opt = document.createElement('option');
  opt.value = k; opt.textContent = p.name;
  select.appendChild(opt);
}

function fmtM(v) { return v.toFixed(4).padStart(8); }

function showStatus(result) {
  const area = document.getElementById('statusArea');
  const penOk = result.worstPen <= PASS_PEN;
  const toOk = result.worstTouch <= PASS_TOUCH;
  const mOk  = result.worstMat <= PASS_MAT;
  const pass = penOk && toOk && mOk;

  area.innerHTML = `
    <h3>${result.phase || 'Result'}</h3>
    <div class="status ${pass?'pass':'fail'}">
      Penetration: <span class="val ${penOk?'ok':'bad'}">${fmtM(result.worstPen)} m</span><br>
      &nbsp;&nbsp;Worst pair: ${result.penPair || '—'}<br>
      Contact err: <span class="val ${toOk?'ok':'bad'}">${fmtM(result.worstTouch)} m</span><br>
      &nbsp;&nbsp;Worst pair: ${result.touchPair || '—'}<br>
      Mat violation:<span class="val ${mOk?'ok':'bad'}">${fmtM(result.worstMat)} m</span><br>
      &nbsp;&nbsp;Worst: ${result.matPair || '—'}<br>
      Evaluations: ${result.evals}<br>
      <strong>${pass ? '✓ PASS' : '✗ FAIL'}</strong>
    </div>
  `;
}

document.getElementById('solveBtn').addEventListener('click', async () => {
  const key = select.value;
  const pose = POSES[key];
  document.getElementById('statusArea').innerHTML = `<div class="status">Solving…</div>`;
  await new Promise(r => setTimeout(r, 30));

  const result = solvePose(pose, (mid) => {
    renderPose(mid.state);
    showStatus(mid);
  });

  renderPose(result.state);
  showStatus(result);
});

// Initial preview
renderPose(makeInitial(POSES.sideControl));
</script>
</body>
</html>
