<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FightCamp - card game prototype (boxing)</title>
<style>
/* FightCamp card prototype: one dark room, warm brown and gold, all art in CSS.
   Sized to fit 1280x720 and 1920x1080 without scrolling. */
:root{
  --bg:#151211; --panel:#221c18; --panel2:#2b231d; --line:#43332a; --line2:#5a4436;
  --fg:#f2e9dd; --muted:#b7a595; --gold:#e3ab45; --gold-ink:#231a12;
  --red:#d9534a; --blue:#5f92d8; --green:#74bd7c; --amber:#e0a83c; --purple:#a98bd6;
  --display:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 50% -10%,#2a211b 0%,var(--bg) 60%);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.35}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:baseline;gap:14px;padding:8px 18px;border-bottom:1px solid var(--line);background:#1b1614}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:15px;color:var(--gold);text-transform:uppercase}
.brand span{color:var(--muted);letter-spacing:.04em;font-weight:400;margin-left:8px;font-size:12px;text-transform:none}
.where{margin-left:auto;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-family:var(--mono)}
.screen{flex:1;min-height:0;padding:14px 18px;display:flex;flex-direction:column;gap:12px}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:700;letter-spacing:.02em}
h1{font-size:clamp(22px,2.1vw,34px)}
h2{font-size:clamp(16px,1.35vw,22px)}
h3{font-size:clamp(13px,1.05vw,16px)}
.muted{color:var(--muted)}
.tiny{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.lead{color:#d9cbba;max-width:70ch}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.btn{padding:10px 18px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);font-weight:600}
.btn:hover{border-color:var(--gold);background:#33291f}
.btn.primary{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.primary:hover{background:#f0bc5d}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* --- boxer pick ------------------------------------------------------- */
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.fighter{border:1px solid var(--line);border-radius:14px;background:linear-gradient(180deg,#271f1a,#1f1a16);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left}
.fighter:hover{border-color:var(--gold)}
.fighter .who{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.fighter .style{color:var(--gold);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;font-size:12px;color:var(--muted)}
.bar{height:7px;border-radius:4px;background:#33291f;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#a8752f,#e3ab45)}
.bar.hurt i{background:linear-gradient(90deg,#8a2f28,#d9534a)}
.bar.wind i{background:linear-gradient(90deg,#3d6a43,#74bd7c)}
.deckpeek{display:flex;flex-wrap:wrap;gap:5px;font-size:11px;color:#c9b9a6}
.deckpeek span{border:1px solid var(--line);border-radius:999px;padding:1px 7px;background:#241d18}

/* --- card faces ------------------------------------------------------- */
.card{position:relative;display:flex;flex-direction:column;gap:5px;padding:10px 11px 9px;border-radius:11px;
  border:1px solid var(--line2);background:linear-gradient(180deg,#2e251f,#211b17);text-align:left;
  min-height:118px;transition:transform .09s ease,border-color .09s ease,box-shadow .09s ease}
.card:hover:not([disabled]){transform:translateY(-3px);border-color:var(--gold);box-shadow:0 8px 18px #0006}
.card .kind{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.card .name{font-family:var(--display);font-weight:700;font-size:clamp(13px,1.02vw,17px);line-height:1.05}
.card .effect{font-size:clamp(10px,.74vw,12px);color:#c7b7a4;line-height:1.3}
.card .cost{position:absolute;top:-8px;right:-6px;min-width:26px;height:26px;border-radius:999px;
  display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:700;
  background:#1b1512;border:1px solid var(--line2);color:var(--gold)}
.card.punch{border-color:#6f3b34;background:linear-gradient(180deg,#33231f,#221a17)}
.card.punch .name{color:#f0b6ad}
.card.defence{border-color:#33496a;background:linear-gradient(180deg,#222a36,#1b1e24)}
.card.defence .name{color:#b7cdec}
.card.footwork{border-color:#3d5a3c;background:linear-gradient(180deg,#212a22,#1b1f1b)}
.card.footwork .name{color:#bfe0c0}
.card[disabled]{opacity:.45;cursor:not-allowed}
.card.gassed{border-style:dashed}
.card.gassed .cost{color:#e69a90;border-color:#6f3b34}
.card.chosen{border-color:var(--gold);box-shadow:0 0 0 2px #e3ab4533,0 10px 22px #0007}
.card.corner{border-color:#6a5327;background:linear-gradient(180deg,#322a1c,#221d16)}
.card.corner .name{color:#f0d69b}
.card.facedown{background:repeating-linear-gradient(135deg,#2b2119 0 8px,#241c16 8px 16px);border-color:var(--line2);align-items:center;justify-content:center;color:var(--muted);font-family:var(--mono);letter-spacing:.2em;font-size:11px}
.card.small{min-height:0;padding:8px}
.card.small .effect{display:none}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:11px;color:var(--muted)}
.badge.costly{border-color:#6f3b34;color:#e6a49c}
.badge.free{border-color:#3d5a3c;color:#a9d7ac}

/* --- camp ------------------------------------------------------------- */
.camp{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;min-height:0}
.offers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-content:start}
.side{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px;display:flex;flex-direction:column;gap:8px;min-height:0;overflow:auto}
.history{display:flex;flex-direction:column;gap:5px;font-size:12px;color:#d3c4b1}
.history li{list-style:none}

/* --- scouting --------------------------------------------------------- */
.file{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.sheet{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:10px}
.habits{display:flex;flex-direction:column;gap:8px}
.habit{border-left:3px solid var(--amber);padding:6px 10px;background:#2b231c;border-radius:0 8px 8px 0;color:#e7d9c6}
.habit.blank{border-left-color:var(--line2);color:var(--muted);font-style:italic}

/* --- fight ------------------------------------------------------------ */
.fight{display:grid;grid-template-rows:auto minmax(0,1.15fr) minmax(0,.85fr) auto;gap:10px;min-height:0;height:100%;flex:1}
.scorestrip{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:12px;color:var(--muted)}
.pips{display:flex;gap:4px}
.pips i{width:9px;height:9px;border-radius:2px;background:#3a2d24;display:block}
.pips i.on{background:var(--gold)}
.pips i.now{background:#f6d79a}
.arena{display:grid;grid-template-columns:minmax(180px,1fr) minmax(260px,1.15fr) minmax(180px,1fr);gap:12px;min-height:0;overflow:hidden}
.cornerbox{border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,#241d19,#1d1815);padding:10px 12px;display:flex;flex-direction:column;gap:7px;min-height:0}
.cornerbox.foe{align-items:flex-end;text-align:right}
.cornerbox .nm{font-family:var(--display);font-weight:700;font-size:clamp(14px,1.15vw,19px)}
.cornerbox .stl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.meters{display:flex;flex-direction:column;gap:4px;width:100%;margin-top:auto}
.meter{display:grid;grid-template-columns:58px 1fr auto;gap:7px;align-items:center;font-size:11px;color:var(--muted);font-family:var(--mono)}
.meter .lab{text-transform:uppercase;letter-spacing:.08em}
.meter .val{min-width:34px;text-align:right;color:#cbbba8}
.stage{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative}
.slots{display:flex;gap:14px;align-items:center;justify-content:center;width:100%}
.slot{width:min(168px,15vw)}
.line{min-height:2.6em;text-align:center;color:#ecdfcd;font-size:clamp(12px,1vw,15px);max-width:34ch}
.verdict{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.verdict.good{color:var(--green)}
.verdict.bad{color:var(--red)}
.logwrap{min-height:0;border:1px solid var(--line);border-radius:12px;background:#1d1815;display:flex;flex-direction:column;overflow:hidden}
.logwrap .hd{display:flex;gap:10px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);overflow:hidden;white-space:nowrap}
.logwrap .hd>span{overflow:hidden;text-overflow:ellipsis;text-transform:none;letter-spacing:.02em;font-size:11px}
.logwrap .hd>span:first-child{text-transform:uppercase;letter-spacing:.1em;flex:none}
.log{overflow:auto;padding:6px 10px;font-size:12px;display:flex;flex-direction:column;gap:3px}
.log div{display:grid;grid-template-columns:64px 1fr;gap:8px}
.log .r{color:#8d7a68;font-family:var(--mono)}
.log .kd{color:var(--red);font-weight:700}
.hand{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.handwrap{display:flex;flex-direction:column;gap:6px}
.handhd{display:flex;gap:10px;align-items:baseline;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.small-note{font-size:11px;color:#9d8b79}
.modebar .btn{font-size:11px;padding:8px 10px}
.reads{gap:5px}.readline{font-size:12px;line-height:1.35;overflow-wrap:anywhere}

/* --- corner / result --------------------------------------------------- */
.corner{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-content:start}
.corner .card{min-height:150px}
.result{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-content:start}
.verdictline{font-family:var(--display);font-size:clamp(24px,2.6vw,40px);color:var(--gold);font-weight:700}
table.cards{border-collapse:collapse;width:100%;font-size:13px}
table.cards th,table.cards td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
table.cards th{color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
table.cards td.n{font-family:var(--mono);text-align:right}
.win{color:var(--green)} .lose{color:var(--red)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--muted)}
@media (max-height:800px){
  .screen{padding:10px 14px;gap:8px}
  .card{min-height:100px;padding:8px 10px}
  .cornerbox{padding:8px 10px;gap:5px}
  .log{font-size:11px}
  h1{font-size:clamp(20px,1.8vw,28px)}
}
@media (max-width:1100px){
  .camp,.file,.result{grid-template-columns:1fr}
  .arena{grid-template-columns:1fr 1fr;grid-template-areas:"p p" "s s"}
  .cornerbox.foe{order:2}
  .stage{grid-column:1/-1;order:3}
  .hand{grid-template-columns:repeat(5,minmax(0,1fr))}
  .card .effect{display:none}
}
@media (max-width:640px){
  .screen{padding:8px;gap:8px}
  .hand{grid-template-columns:repeat(2,minmax(0,1fr))}
  .arena{grid-template-columns:1fr}
  .cornerbox.foe{order:0;text-align:left;align-items:stretch}
  .offers,.corner{grid-template-columns:1fr}
  .card{min-height:0}
  .top{padding:6px 10px}
  .brand span{display:none}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">FightCamp<span>card game prototype - boxing</span></div>
    <div class="where" id="where">loading</div>
  </header>
  <main class="screen" id="screen"></main>
</div>
<script src="rules-data.js"></script>
<script src="rules-ai.js"></script>
<script src="rules-tell.js"></script>
<script src="rules-judge.js"></script>
<script src="rules-exchange.js"></script>
<script src="rules-camp.js"></script>
<script src="rules.js"></script>
<script src="ui-helpers.js"></script>
<script src="ui.js"></script>
</body>
</html>
