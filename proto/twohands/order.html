<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ring Switches</title>
<style>
:root{color-scheme:dark;--bg:#151211;--panel:#221c18;--panel2:#2b231d;--line:#43332a;--line2:#5a4436;--fg:#f2e9dd;--muted:#b7a595;--gold:#e3ab45;--red:#d9534a;--blue:#5f92d8;--green:#74bd7c}
*{box-sizing:border-box}html{font-size:clamp(13px,1.02vw,21px)}html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 50% -10%,#2a211b 0%,var(--bg) 60%);color:var(--fg);font:1.05rem/1.35 "Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.app{min-height:100%;display:grid;grid-template-rows:auto auto auto 1fr;gap:.6rem;padding:.6rem max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;gap:1.1rem;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:.45rem;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}.top b{color:var(--gold)}
.lab{font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.ticks{display:inline-flex;gap:3px;vertical-align:middle;margin-left:.4rem}.ticks i{width:1.1rem;height:.55rem;border-radius:2px;background:#3a2e26;border:1px solid var(--line2)}.ticks i.done{background:var(--muted)}.ticks i.cur{background:var(--gold);border-color:var(--gold)}
.men{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.man{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.5rem .8rem;display:grid;grid-template-columns:auto 1fr;gap:.15rem .8rem;align-items:center}
.man h2{margin:0;font-size:1.15rem;grid-column:1/3}.you h2{color:var(--blue)}.him h2{color:var(--red)}.man .note{grid-column:1/3;color:var(--muted);font-size:.85rem}
.bar{display:flex;height:.85rem;border-radius:4px;background:#3a2e26;border:1px solid var(--line2);overflow:hidden}.bar i{display:block;height:100%;transition:width .35s}
.bar u{display:block;height:100%;background:repeating-linear-gradient(45deg,#e3ab45,#e3ab45 4px,#8a6a2c 4px,#8a6a2c 8px);transition:width .2s}
.hp i{background:var(--red)}.st i{background:var(--green)}.gb i{background:var(--blue)}
.tag{display:inline-block;padding:1px .5rem;border-radius:.7rem;border:1px solid var(--red);color:#ffb3ad;font-size:.78rem;margin-left:.4rem}
.duo{display:grid;grid-template-columns:minmax(18rem,38%) 1fr;gap:.8rem;align-items:stretch}
.stage{position:relative;height:clamp(10rem,27vh,17rem);border-radius:.6rem;overflow:hidden;background:linear-gradient(#1c2230 0%,#2a3447 56%,#4f74ad 56%,#35507f 100%);border:1px solid var(--line2)}
.stage:before,.stage:after{content:"";position:absolute;left:0;right:0;height:3px;background:#c9382f;opacity:.85}.stage:before{top:30%}.stage:after{top:43%;background:#e8e1d6}
.stage img{position:absolute;top:-17%;height:126%;left:50%;transform:translateX(-50%) scaleX(-1);z-index:1;filter:drop-shadow(0 8px 6px rgba(0,0,0,.45))}
.stage .nm{position:absolute;bottom:.4rem;z-index:2;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.8rem;text-shadow:0 1px 3px #000}.nm.you{left:.7rem;color:#9cc0f5}.nm.him{right:.7rem;color:#ff9d95}
.pop{position:absolute;top:20%;z-index:3;font-weight:800;font-size:2rem;text-shadow:0 2px 6px #000;opacity:0;pointer-events:none}.pop.p0{left:22%}.pop.p1{right:22%}
.pop.go{animation:pop .9s ease-out}.pop.dmg{color:#ff6b5e}.pop.ok{color:#8fe39a;font-size:1.4rem}
@keyframes pop{0%{opacity:0;transform:translateY(12px) scale(.7)}15%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-36px)}}
.stage.shake{animation:shake .28s}@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.stage img.act{animation:act .24s ease-out}@keyframes act{0%{filter:brightness(1.7) drop-shadow(0 8px 6px rgba(0,0,0,.45));transform:translateX(-50%) scaleX(-1) scale(.95)}100%{filter:drop-shadow(0 8px 6px rgba(0,0,0,.45));transform:translateX(-50%) scaleX(-1) scale(1)}}
.cap{position:absolute;left:50%;bottom:.45rem;transform:translateX(-50%);z-index:4;background:rgba(20,16,14,.86);border:1px solid var(--gold);border-radius:.6rem;padding:.2rem .9rem;font-weight:700;white-space:nowrap;max-width:96%;overflow:hidden;text-overflow:ellipsis}.cap:empty{display:none}.cap.good{border-color:var(--green)}.cap.bad{border-color:var(--red)}
.sw.doing{border-color:#fff!important;box-shadow:0 0 0 3px #fff!important}
.rng{position:absolute;top:.4rem;left:50%;transform:translateX(-50%);z-index:3;display:flex;gap:4px}.rng span{padding:.1rem .6rem;border-radius:.7rem;border:1px solid var(--line2);background:rgba(20,16,14,.75);font-size:.78rem;color:var(--muted)}.rng span.on{border-color:var(--gold);color:var(--gold);font-weight:700}
.tell{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.6rem .8rem;display:flex;flex-direction:column;gap:.35rem;min-width:0;overflow:auto;max-height:clamp(10rem,27vh,17rem)}
.said{font-size:1.15rem;font-weight:600}
#tip{position:fixed;z-index:50;display:none;max-width:27rem;background:#120e0c;border:1px solid var(--gold);border-radius:.5rem;padding:.5rem .7rem;white-space:pre-line;font-size:.92rem;line-height:1.4;color:var(--fg);box-shadow:0 .4rem 1.2rem #000c;pointer-events:none}
.lab.hand{display:flex;align-items:center;gap:.45rem;cursor:help}.lab.hand svg{width:4.6rem;height:2.7rem;flex:none}.lab.hand i{font-style:normal;text-transform:none;letter-spacing:0;color:var(--muted);font-weight:400}
.srow[data-tip]{cursor:help}.srow[data-tip]:hover{border-color:var(--gold)}
.srow{display:grid;grid-template-columns:minmax(8rem,13rem) 1fr auto;gap:.6rem;align-items:center;padding:.3rem .6rem;border-radius:.45rem;border:1px solid var(--line2);background:var(--panel2)}
.srow em{font-style:normal;font-weight:700}.srow.good{border-color:var(--green)}.srow.good em{color:var(--green)}.srow.bad{border-color:var(--red)}.srow.bad em{color:#ff8f86}.srow.flat{color:var(--muted)}
.board{display:grid;grid-template-columns:1fr 1fr 13rem;gap:.6rem}
.grp{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.5rem .6rem;display:flex;flex-direction:column;gap:.35rem;min-width:0}
.sw{display:grid;grid-template-columns:1fr auto;gap:.1rem .5rem;align-items:center;text-align:left;padding:.26rem .6rem;border-radius:.5rem;border:1px solid var(--line2);background:var(--panel2);min-height:2.05rem}
.sw b{font-weight:600}.sw small{grid-column:1/3;color:var(--muted);font-size:.76rem;line-height:1.2}.sw .c{color:var(--gold);font-size:.8rem}
.sw.on{border-color:var(--gold);background:#3a2c18;box-shadow:0 0 0 2px var(--gold)}.sw.home.on{border-color:var(--green);background:#1f2e22;box-shadow:0 0 0 2px var(--green)}
.sw:disabled{cursor:not-allowed}.sw:disabled b,.sw:disabled .c{opacity:.45}.sw .why{color:#ff9d95;font-weight:600}.sw{position:relative}.sw .n{position:absolute;left:-.5rem;top:-.5rem;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--gold);color:#231a12;font-weight:800;display:grid;place-items:center;font-size:.9rem}
.seq{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}.seq button{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}.seq button.drag{cursor:grabbing;position:relative;z-index:3;opacity:.9;box-shadow:0 .3rem 1rem #000b}.seq button.gapL{box-shadow:-.3rem 0 0 var(--gold)}.seq button.gapR{box-shadow:.3rem 0 0 var(--gold)}.seq button{padding:.25rem .7rem;border-radius:.7rem;border:1px solid var(--gold);background:#3a2c18;font-weight:600}.seq button b{color:var(--gold);margin-right:.3rem}
.under{display:grid;grid-template-columns:1fr auto;gap:.8rem;align-items:center}
.lines{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}.ln{padding:.2rem .6rem;border-radius:.7rem;border:1px solid var(--line2);font-size:.85rem}.ln.cov{border-color:var(--green);color:#bfe6c3}.ln.open{border-color:var(--red);color:#ffb3ad}
.btn{padding:.65rem 1.3rem;border-radius:.55rem;border:1px solid var(--line2);background:var(--panel2);font-weight:600;min-height:44px}
.btn.go{background:var(--gold);color:#231a12;border-color:var(--gold);animation:pulse 1.4s infinite}.btn:disabled{opacity:.4;animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(227,171,69,.25)}}
.opps{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}.opp{background:var(--panel2);border:1px solid var(--line2);border-radius:.6rem;padding:.6rem .7rem;text-align:left}.opp b{display:block;font-size:1.1rem;color:#ff9d95}.opp small{display:block;color:var(--muted)}.opp.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.how{color:var(--muted);line-height:1.5}.how b{color:var(--fg)}
.burst{position:absolute;z-index:3;width:var(--s,40px);height:var(--s,40px);margin:calc(var(--s,40px)/-2) 0 0 calc(var(--s,40px)/-2);pointer-events:none;opacity:0;background:radial-gradient(circle,#fff 0 20%,#ffe27a 21% 40%,#ff7a3d 41% 64%,#c9382f 65%);clip-path:polygon(50% 0,61% 30%,93% 16%,75% 45%,100% 60%,69% 66%,73% 100%,50% 77%,27% 100%,31% 66%,0 60%,25% 45%,7% 16%,39% 30%)}
.burst.go{animation:burst .45s ease-out}.burst.blk{background:radial-gradient(circle,transparent 0 40%,#e8f2ff 41% 56%,transparent 57%);clip-path:none}
@keyframes burst{0%{opacity:1;transform:scale(.25) rotate(-14deg)}30%{opacity:1;transform:scale(1.1) rotate(3deg)}100%{opacity:0;transform:scale(1.35) rotate(9deg)}}
.pop.at{left:auto;right:auto;transform:translateX(-50%)}.pop.at.go{animation:popat .95s ease-out}@keyframes popat{0%{opacity:0;margin-top:10px}15%{opacity:1;margin-top:0}100%{opacity:0;margin-top:-34px}}
.bar.hurt{animation:hurt .55s ease-out}@keyframes hurt{0%{box-shadow:0 0 0 3px #fff;filter:brightness(2.2)}100%{box-shadow:0 0 0 0 transparent;filter:none}}
.rng i.gp{width:.7rem;height:.7rem;border-radius:2px;background:var(--gold);align-self:center;opacity:.9}.rng i.gp.lost{background:#5a2a26;opacity:.9}.rng i.rope{width:4px;height:1.3rem;border-radius:2px;background:#e8e1d6;align-self:center}.rng .gr{display:flex;gap:3px;padding:0 .35rem;align-items:center}
.bar s{display:block;height:100%;margin-left:auto;background:repeating-linear-gradient(135deg,#6a302b,#6a302b 4px,#2a1614 4px,#2a1614 8px)}
.note.his{display:grid;gap:.05rem;cursor:help}.note.his i{font-style:normal;display:inline-block;min-width:6.3rem}.note.his span+span b{font-weight:400;color:var(--fg)}
.sw .hab{grid-column:1/3;color:var(--gold);font-size:.76rem;font-weight:700}
@media (max-width:900px){html{font-size:14px}.duo{grid-template-columns:1fr}.board{grid-template-columns:1fr 1fr}.opps{grid-template-columns:1fr}.under{grid-template-columns:1fr}.btn{width:100%}}
@media (prefers-reduced-motion:reduce){.btn.go,.stage.shake,.pop.go,.burst.go,.bar.hurt{animation:none}.pop.go{opacity:1}}

/* COMPACT1 (S559): small toggle buttons, an icon each, the details in the tooltip (owner: "make the cells smaller like toggle buttons add a bit of art and toolitps") */
.board{grid-template-columns:1.25fr 1fr 1.25fr}
.grp{display:grid;grid-template-columns:repeat(auto-fill,minmax(8.4rem,1fr));gap:.3rem;align-content:start;padding:.4rem .5rem}
.grp>.lab{grid-column:1/-1;margin-bottom:.05rem}.grp>.lab.hand svg{width:3rem;height:1.8rem}.grp>.lab.hand i{display:none}
.sw{grid-template-columns:auto 1fr auto;gap:0 .35rem;padding:.18rem .45rem;min-height:2.1rem;font-size:.86rem;line-height:1.15}
.sw small{display:none}.sw .ic{display:grid;place-items:center;width:1.45rem;height:1.45rem;border-radius:.35rem;background:#1a1512;color:var(--muted)}
.sw .ic svg{width:1.15rem;height:1.15rem}.sw.on .ic{color:var(--gold)}.sw.home.on .ic{color:var(--green)}
.sw .c{font-size:.75rem;white-space:nowrap;color:var(--green);font-weight:700}   /* S562: a stamina number, in the stamina bar's green: -2 a punch costs, +1 a held hand gives back */.sw.far{border-style:dashed}.sw.far b{opacity:.6}
.sw .flag{position:absolute;right:-.35rem;top:-.4rem;width:1.05rem;height:1.05rem;border-radius:50%;display:grid;place-items:center;font-size:.7rem;font-weight:800}
.sw .flag.why{background:#d9534a;color:#fff}.sw .flag.hab{background:var(--gold);color:#231a12}
.sw .n{left:-.4rem;top:-.4rem;width:1.2rem;height:1.2rem;font-size:.75rem}

/* STAGE1 (S559, owner on kick.html: "why the mi,long ranges are covering the fighter heads ? can you make the fight scene bigger ?") */
.duo{grid-template-columns:minmax(24rem,64%) 1fr}
.stage{height:clamp(15rem,46vh,31rem)}.tell{max-height:clamp(15rem,46vh,31rem)}
.rng{top:.45rem;left:.5rem;transform:none}   /* the empty top-left corner: never on a head or a boot */

/* DESK1 (S559, owner: "where you describe the action can you put a faded background of the ... tv table" - our own crew,
   three original commentators made with Ludo: no real people, no logos) */
.tell{position:relative;isolation:isolate}.tell::before{content:"";position:absolute;inset:0;z-index:-1;background:url(img/commdesk.webp) center 30%/cover no-repeat;opacity:.2;border-radius:inherit;pointer-events:none}

/* RINGUI1 (S559): the range plates on the floor (true toe-to-toe gaps) and the commentators' calls */
.rng>span:not(.gr){display:none}
#ruler{position:absolute;inset:0;z-index:2;pointer-events:none}
#ruler .gap{position:absolute;height:8px;border-radius:4px;background:rgba(227,171,69,.45);box-shadow:0 0 12px rgba(227,171,69,.75);transition:left .4s,width .4s,background .2s}
#ruler .gap i{position:absolute;top:-9px;width:3px;height:26px;border-radius:2px;background:#ffe27a}#ruler .gap i:first-child{left:-2px}#ruler .gap i:last-child{right:-2px}
#ruler .gap.ok{background:rgba(116,189,124,.55);box-shadow:0 0 12px rgba(116,189,124,.8)}#ruler .gap.no{background:rgba(217,83,74,.5);box-shadow:0 0 12px rgba(217,83,74,.8)}
#ruler .gap.flash{animation:plateflash .9s ease-out}@keyframes plateflash{0%{box-shadow:0 0 0 6px rgba(255,226,122,.9)}100%{box-shadow:0 0 12px rgba(227,171,69,.75)}}
#ruler .plabel{position:absolute;transform:translateX(-50%);font-size:.95rem;background:rgba(10,12,16,.55);padding:.1rem .5rem;border-radius:.4rem;color:#f2e9dd;text-shadow:0 1px 3px #000;white-space:nowrap}#ruler .plabel b{color:var(--gold);letter-spacing:.06em;text-transform:uppercase}#ruler .plabel u{color:#ff8f86;text-decoration:none;font-weight:700}
#desklight{position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:0;transition:opacity .4s;background:radial-gradient(ellipse 18% 55% at var(--x,50%) 42%,rgba(255,196,110,.42),transparent 70%);mix-blend-mode:screen}#desklight.on{opacity:1}
#call{position:sticky;bottom:0;margin-top:auto;background:rgba(18,14,12,.9);border-left:3px solid var(--gold);border-radius:.4rem;padding:.4rem .6rem;font-size:.98rem;display:none}#call.on{display:block;animation:callin .35s ease-out}
#call b{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}#call.w0{border-left-color:#ff8f86}#call.w0 b{color:#ff8f86}#call.w2{border-left-color:#9cc0f5}#call.w2 b{color:#9cc0f5}
@keyframes callin{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}

/* BODYUI2 (S562, owner Q-343 "Body view ... make it how you pick switches on the main page?" - "Yes, replace the board";
   S559: "i do not want text near the fighters (tubes or circles on the fighters are forbidden) make a pointer outlining to
   the available options menu"): the limb under the mouse glows (its outline, from a part mask rendered from the 3D beside
   each picture); its switches sit in ONE fixed panel left of the ring; a thin line runs from the lit limb to it, BEHIND the
   men. The old board below the ring is gone: the same buttons live in the panel (body_ui.js picks which). */
.duo{grid-template-columns:17.5rem minmax(24rem,1fr) minmax(13rem,23%)}
.stage{height:clamp(15rem,60vh,42rem)}.tell{max-height:clamp(15rem,60vh,42rem)}   /* the board moved beside the ring: the ring takes its height */
.side{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.4rem;display:flex;flex-direction:column;gap:.35rem;min-width:0;overflow:auto;max-height:clamp(15rem,60vh,42rem);transition:border-color .2s}
.side.w0{border-color:#8fc0ff}.side.w1{border-color:#ff8a80}
.side .hd{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:.1rem .2rem}.side .hd b{color:var(--fg)}.side.w0 .hd b{color:#9cc0f5}.side.w1 .hd b{color:#ff9d95}
.side .hd small{display:block;text-transform:none;letter-spacing:0;font-size:.75rem;color:var(--muted)}.side .hd small[data-tip]{cursor:help;text-decoration:underline dotted}
.side .hd.hint{border:1px dashed var(--gold);border-radius:.5rem;padding:.4rem .5rem;animation:pulse 1.4s infinite}
#side .board{display:flex;flex-direction:column;gap:.35rem}#side .board .grp{padding:.3rem;grid-template-columns:1fr 1fr}#side .board.part .grp>.lab{display:none}#side .opps{grid-template-columns:1fr}
#sum{display:flex;flex-direction:column;gap:.25rem}#sum button{display:grid;grid-template-columns:5.2rem 1fr;gap:.4rem;text-align:left;padding:.3rem .5rem;border-radius:.45rem;border:1px solid var(--line2);background:var(--panel2);font-size:.85rem}
#sum button i{font-style:normal;color:var(--muted)}#sum button b{font-weight:600}#sum button:hover{border-color:#8fc0ff}
#his{display:none;flex-direction:column;gap:.25rem;font-size:.85rem;line-height:1.25}
#his .row{display:grid;grid-template-columns:1fr auto auto;gap:.1rem .45rem;align-items:center;padding:.25rem .45rem;border-radius:.45rem;border:1px solid var(--line2);background:var(--panel2);cursor:help}
#his .row b{font-weight:600}#his .row em{font-style:normal;font-size:.75rem;color:var(--muted)}#his .row u{text-decoration:none;font-size:.75rem;font-weight:700;padding:0 .35rem;border-radius:.6rem;border:1px solid}
#his .row u.ok{color:#bfe6c3;border-color:var(--green)}#his .row u.open{color:#ffb3ad;border-color:var(--red)}#his .row u.far{color:var(--muted);border-color:var(--line2)}
#his .row.far b{opacity:.55}#his .row small{grid-column:1/-1;color:var(--muted);font-size:.74rem}#his .note2{color:var(--muted);font-size:.78rem;padding:.1rem .2rem}
#glow{position:absolute;z-index:2;pointer-events:none}
#pointer{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:0;pointer-events:none;overflow:visible}
.stage.over{cursor:pointer}
#seqwords{display:flex;flex-direction:column;gap:.1rem;font-size:.88rem;color:var(--fg)}#seqwords b{color:var(--gold);margin-right:.35rem}#seqwords u{color:#ff8f86;text-decoration:none;font-weight:700}#seqwords .meet{color:var(--muted);font-size:.8rem}
</style><script src="ring_ui.js" defer></script><script src="body_ui.js" defer></script></head>
<body><div class="app">
  <div class="top"><span class="brand">Ring Switches</span><span id="where"></span><span id="score"></span><span class="lab" style="margin-left:auto">point at a limb to set it - the order you click is the order you throw</span><button class="btn" id="mute" style="padding:.2rem .6rem;min-height:0;font-size:.85rem">Sound on</button></div>
  <div class="men"><div class="man you" id="you"></div><div class="man him" id="him"></div></div>
  <div class="duo"><div class="side" id="side"><div class="board" id="board"></div></div><div class="stage" id="stage"><div class="rng" id="rng"></div><img id="pic" alt="" src="img/guard.webp"><span class="burst" id="burst"></span><span class="pop p0" id="pop0"></span><span class="pop p1" id="pop1"></span><span class="cap" id="cap"></span><span class="nm you">You</span><span class="nm him" id="nmhim">Him</span></div>
    <div class="tell"><div class="said" id="said"></div><div id="story"></div></div></div>
  <div><div class="under" style="margin-bottom:.5rem"><div class="lines" id="lines"></div><div id="acts"></div></div></div>
</div>
<script>
// S555: THIS PAGE IS THE SOURCE (the owner: "i want version with the order of actions"). It was generated from switch.html by
// tools/make_order.py until S555; that generator is gone and switch.html is the old version without order, no longer built on.
// The rules are everything above the page mark (four dashes, then "the page"): tools/rules.mjs reads them, rules_test.mjs tests them.
// RING SWITCHES (S551 toy). Owner: "what if put everything that the fighter can do in the fight as action toggable
// buttons like the jab,uppercut push,backoff,step in , guard low, guard up etc"; "holding a card can turn to a defence is
// reasonable , i like the idea". No decks, no timing: you set switches, both men act at once, the beat plays out.
// S555 THE BALANCED SLICE (the owner: "need better balance , i want this slice to be perfectly balance to move on"): the numbers in
// N / ACT and five rules below were chosen on tools/balance.mjs - two equal men who both play each beat's solved mix box at all
// three ranges, every punch gets thrown, bouts end both ways (docs/RINGSWITCH_BALANCE_S555.md has the table). keep: 0 = the S554
