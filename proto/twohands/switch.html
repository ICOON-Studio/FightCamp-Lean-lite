<body><div class="app">
  <div class="top"><span class="brand">Ring Switches</span><span id="where"></span><span id="score"></span><span class="lab" style="margin-left:auto">every action is a switch - a hand left off defends</span><button class="btn" id="mute" style="padding:.2rem .6rem;min-height:0;font-size:.85rem">Sound on</button></div>
  <div class="men"><div class="man you" id="you"></div><div class="man him" id="him"></div></div>
  <div class="duo"><div class="stage" id="stage"><div class="rng" id="rng"></div><img id="pic" alt="" src="img/guard.webp"><span class="pop p0" id="pop0"></span><span class="pop p1" id="pop1"></span><span class="cap" id="cap"></span><span class="nm you">You</span><span class="nm him" id="nmhim">Him</span></div>
    <div class="tell"><div class="said" id="said"></div><div id="story"></div></div></div>
  <div><div class="under" style="margin-bottom:.5rem"><div class="lines" id="lines"></div><div id="acts"></div></div><div class="board" id="board"></div></div>
</div>
<script>
// RING SWITCHES (S551 toy). Owner: "what if put everything that the fighter can do in the fight as action toggable
// buttons like the jab,uppercut push,backoff,step in , guard low, guard up etc"; "holding a card can turn to a defence is
// reasonable , i like the idea". No decks, no timing: you set switches, both men act at once, the beat plays out.
// A feel test: every number is in N / ACT and is a first guess.
const N = { hp: 22, st: 8, rec: 1, hold: 1, guard: 6, grec: 1, rounds: 3, beats: 6, kd: [9, 7], counter: 1 };   // rec: stamina back a beat, + hold for each hand kept home
const RNG = { 1: 'Inside', 2: 'Mid', 3: 'Long' };
// a punch: which hand, stamina, health it takes, speed (1 first), the ranges it reaches, the line it travels on
const ACT = {
  jab: { n: 'Jab', h: 0, st: 1, d: 1, sp: 1, reach: [2, 3], line: 'straight', pic: 'jab' },
  hook: { n: 'Lead hook', h: 0, st: 2, d: 3, sp: 2, reach: [1, 2], line: 'side', pic: 'lead_hook' },
  lup: { n: 'Lead uppercut', h: 0, st: 3, d: 4, sp: 3, reach: [1], line: 'under', pic: 'lead_uppercut' },
  lbody: { n: 'Body hook', h: 0, st: 2, d: 2, sp: 2, reach: [1, 2], line: 'body', body: 1, pic: 'body_hook' },
  feint: { n: 'Feint', h: 0, st: 1, feint: 1, t: 'Draws his hands: your rear-hand punch this beat cannot be covered.' },
  push: { n: 'Push off', h: 0, st: 1, push: 1, t: 'Inside only: shoves him back to Mid before the punches. Breaks a clinch.' },
  cross: { n: 'Cross', h: 1, st: 2, d: 3, sp: 2, reach: [2], line: 'straight', pic: 'cross' },
  over: { n: 'Overhand', h: 1, st: 3, d: 4, sp: 3, reach: [1, 2], line: 'side', pic: 'rear_hook', run: 'overhand' },
  rup: { n: 'Rear uppercut', h: 1, st: 3, d: 4, sp: 3, reach: [1], line: 'under', pic: 'rear_uppercut' },
  rbody: { n: 'Body cross', h: 1, st: 2, d: 2, sp: 2, reach: [2], line: 'body', body: 1, pic: 'body_cross' },
};
const LINE = { straight: 'Head, straight', side: 'Head, from the side', under: 'Chin, from below', body: 'Body' };
// said in HIS punches, so the player knows what each hold is for
const THREAT = { straight: 'His jab and cross', side: 'His hook and overhand', under: 'His uppercuts', body: 'His body punches' };
const STOPS = { straight: 'his jab and his cross', side: 'his lead hook and his overhand', under: 'his uppercuts', body: 'his body hook and body cross' };
const momentOf = (p, sl) => '';
const YOURS = { straight: 'jab or cross', side: 'lead hook or overhand', under: 'uppercut', body: 'body punch' };
// how to stop what he did last beat, and how to counter it
function answerTo(p) { if (!p || p.clinch) return ''; const ps = ['lead', 'rear'].filter((sl) => p[sl] && ACT[p[sl]].d); if (!ps.length) return '';
  return ps.map((sl) => { const a = ACT[p[sl]], mine = slotOf(a.line), h = COVER.high.includes(a.line) ? 'high' : 'low'; const gap = COVER[heightOf(p, sl)][sl === 'lead' ? 0 : 1]; return `his <b>${a.n}</b>${momentOf(p, sl)}: hold your <b>${mine} hand ${h}</b> to block it. While his ${sl} hand is out, your <b>${YOURS[gap]}</b> gets through`; }).join('; ') + '. A punch of his that you block or that misses makes your next punch a <b>counter</b> (+1 health).'; }
const FEET = { in: { n: 'Step in', st: 1, t: 'One place closer.' }, hold: { n: 'Hold your ground', st: 0, t: 'Stay where you are.' }, back: { n: 'Back off', st: 1, t: 'One place further. At Long you are giving ground toward the ropes.' } };
// what a hand LEFT OFF covers: it depends on where the guard is held
const COVER = { high: ['straight', 'side'], low: ['body', 'under'] };   // [lead hand home, rear hand home]
const OPPS = [
  { n: 'The Jabber', t: 'Stays at Long behind the jab and backs off when you come in. Crosses when you stand at Mid.', hp: 20, read: 0.75 },
  { n: 'The Slugger', t: 'Walks in. Overhands and hooks at Mid, uppercuts Inside. Throws with both hands, so he leaves lines open.', hp: 26, read: 0.45 },
  { n: 'The Body Snatcher', t: 'Gets to Mid or Inside and digs to the body to shorten your stamina. Keeps a hand home.', hp: 22, read: 0.6 },
];
const $ = (id) => document.getElementById(id), rnd = Math.random, pickOne = (a) => a[Math.floor(rnd() * a.length)], clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let F, P, oppI = 0, OPP = OPPS[0], round, beat, range, cards, phase = 'setup', mute = false, busy = false, popN = 0;
const plan0 = () => ({ lead: null, rear: null, hl: 'high', hr: 'high', feet: 'hold', clinch: false });   // lead / rear: a punch, or null = held where hl / hr says
const slotOf = (line) => (line === 'straight' || line === 'body' ? 'lead' : 'rear'), heightOf = (p, slot) => (slot === 'lead' ? p.hl : p.hr);
const LO = [{ lead: null, hl: 'high' }, { lead: null, hl: 'low' }, ...['jab', 'hook', 'lup', 'lbody', 'feint', 'push'].map((id) => ({ lead: id, hl: 'high' }))];
const RO = [{ rear: null, hr: 'high' }, { rear: null, hr: 'low' }, ...['cross', 'over', 'rup', 'rbody'].map((id) => ({ rear: id, hr: 'high' }))];
const man = (hp) => ({ hp, max: hp, st: N.st, cap: N.st, g: N.guard, pts: 0, kd: 0, ropes: 0, held: 0, last: null });
const snd = (n, v = 0.7) => { if (mute) return; try { const au = new Audio('snd/' + n + '.ogg'); au.volume = v; au.play().catch(() => {}); } catch (e) {} };
const pic = (n) => { $('pic').src = 'img/' + n + '.webp'; };
// RINGANIM1 (S552): every action is SEEN, frame by frame. img/anim/frames.json lists each run's pictures and their times
// from the contact (tools/pics2d_anim.gd records them from the 3D fight). A run that is not on disk falls back to its still.
let ANIM = {}; const PRE = {}, HOLD = 250, BIG_SLOW = 1.6, MAX_GAP = 350;   /* ms: the contact's hold, a big punch's slow-in, the longest wait between two pictures (a clinch settles for 1.3 s) */
fetch('img/anim/frames.json').then((r) => r.json()).then((j) => { ANIM = j.runs || {}; }).catch(() => {});
function warm(runs) { return Promise.all(runs.filter((n) => ANIM[n]).flatMap((n) => ANIM[n].files).filter((f) => !PRE[f]).map((f) => new Promise((ok) => { const im = new Image(); PRE[f] = im; im.onload = im.onerror = ok; im.src = 'img/anim/' + f; }))); }
const stepRun = (o) => { const m = /you (step in|back off)/.exec(o) || /he (steps in|backs off)/.exec(o); return m ? (m[0][0] === 'y' ? 'blue_' : 'red_') + (/in$/.test(m[1]) ? 'step_in' : 'back_off') : ''; };
const runOf = (e) => { const col = e.k ? 'red' : 'blue'; if (e.t === 'hit' || e.t === 'block' || e.t === 'miss') return `${col}_${ACT[e.id].run || ACT[e.id].pic}_${e.t === 'hit' ? 'landed' : e.t === 'block' ? 'blocked' : 'missed'}`;
  if (e.t === 'clinch') return `${col}_clinch`; if (e.t === 'range') return stepRun(e.o || ''); if (e.t === 'flat' && e.k >= 0 && !e.id) return /^feint/.test(e.a) ? `${col}_feint` : /^push/.test(e.a) ? `${col}_push` : ''; return ''; };
// plays a run at its recorded times: the contact picture is held HOLD ms (onHit fires on it), a big punch's last three pictures in are slowed
function playRun(run, big, onHit, done) { const r = ANIM[run]; if (!r || !r.files.every((f) => PRE[f] && PRE[f].naturalWidth)) return false;
  const c = r.contact, at = Math.max(c, 0); let i = 0;
  const show = () => { $('pic').src = PRE[r.files[i]].src; if (i === at) onHit(); if (i >= r.files.length - 1) return done();
    let wait = Math.min(MAX_GAP, (r.offs[i + 1] - r.offs[i]) * 1000); if (i === c) wait += HOLD; if (big && c - i >= 1 && c - i <= 3) wait *= BIG_SLOW; i++; setTimeout(show, wait); };
  show(); return true; }
function pop(who, text, cls) { const el = $('pop' + who); el.textContent = text; el.className = 'pop p' + who + ' ' + cls; void el.offsetWidth; el.classList.add('go'); }
function jolt() { const st = $('stage'); st.classList.remove('shake'); void st.offsetWidth; st.classList.add('shake'); }
const cost = (p) => (p.lead ? ACT[p.lead].st : 0) + (p.rear ? ACT[p.rear].st : 0) + FEET[p.feet].st + (p.clinch ? 1 : 0);
// the lines a man's plan covers, and why a line is open
function covers(m, p) { const c = {}; if (m.g <= 0 || p.clinch) return c; if (!p.lead) c[COVER[p.hl][0]] = 1; if (!p.rear) c[COVER[p.hr][1]] = 1; return c; }
const planWords = (p) => !p ? 'nothing yet' : p.clinch ? 'clinch' : [p.lead ? ACT[p.lead].n : 'lead hand ' + p.hl, p.rear ? ACT[p.rear].n : 'rear hand ' + p.hr, p.feet !== 'hold' && FEET[p.feet].n].filter(Boolean).join(' + ');

// ---- one beat: both plans at once. Returns the events in the order they happen.
function resolve(S, P) { const ev = [], f = S.f, say = (k, o) => ev.push({ k, ...o });
  for (const k of [0, 1]) { f[k].st -= cost(P[k]); f[k].last = { ...P[k] }; if (P[k].lead || P[k].rear) f[k].hist = [...(f[k].hist || []), { ...P[k] }].slice(-3); }
  const pusher = [0, 1].find((k) => P[k].lead === 'push' && !P[k].clinch), clincher = [0, 1].find((k) => P[k].clinch);
  if (clincher != null && (S.range > 2 || f[clincher].held)) { say(clincher, { t: 'flat', a: 'reaches to clinch', o: S.range > 2 ? 'too far away' : 'the referee will not allow two running' }); P[clincher] = { ...P[clincher], clinch: false, lead: null, rear: null }; }
  else if (clincher != null && pusher === 1 - clincher) { say(clincher, { t: 'flat', a: 'tries to clinch', o: 'shoved off' }); P[clincher] = { ...P[clincher], clinch: false, lead: null, rear: null }; }
  else if (clincher != null) { f[clincher].st = Math.min(f[clincher].cap, f[clincher].st + 3); f[clincher].held = 2; S.range = 2; say(clincher, { t: 'clinch', a: 'ties him up', o: 'no punch lands - the referee breaks them at Mid, +2 stamina' }); return ev; }
  // feet first
  let d = 0; for (const k of [0, 1]) { const ft = P[k].feet; if (ft === 'in') { d--; f[k].ropes = 0; } if (ft === 'back') { d++; if (S.range === 3) f[k].ropes++; } }
  const r0 = S.range; S.range = clamp(S.range + d, 1, 3);
  if (pusher != null && S.range === 1) { S.range = 2; say(pusher, { t: 'flat', a: 'pushes off', o: 'back to Mid' }); }
  if (S.range !== r0) ev.unshift({ k: -1, t: 'range', a: `${RNG[r0]} to ${RNG[S.range]}`, o: [0, 1].map((k) => P[k].feet === 'hold' ? '' : (k ? 'he ' : 'you ') + (P[k].feet === 'in' ? 'step' + (k ? 's' : '') + ' in' : 'back' + (k ? 's' : '') + ' off')).filter(Boolean).join(', ') });
  for (const k of [0, 1]) if (P[k].lead === 'feint') say(k, { t: 'flat', a: 'feints', o: P[k].rear ? 'his hands are drawn' : 'nothing behind it' });
  // punches, fastest first; equal speeds land together
  const shots = []; for (const k of [0, 1]) for (const id of [P[k].lead, P[k].rear]) if (id && ACT[id].d) shots.push({ k, id, a: ACT[id] });
  shots.sort((x, y) => x.a.sp - y.a.sp);
  const stun = [0, 0], opening = [0, 0], cov = [covers(f[0], P[0]), covers(f[1], P[1])];
  for (let i = 0; i < shots.length;) { let j = i; while (j < shots.length && shots[j].a.sp === shots[i].a.sp) j++;
    const tier = shots.slice(i, j), stunNow = [...stun], openNow = [...opening];
    for (const s of tier) { const A = f[s.k], D = f[1 - s.k], a = s.a, v = 1 - s.k;
      if (stunNow[s.k]) { say(s.k, { t: 'flat', id: s.id, a: a.n, o: 'beaten to the punch - never thrown' }); continue; }
      if (D.hp <= 0) continue;
      if (!a.reach.includes(S.range)) { say(s.k, { t: 'miss', id: s.id, a: a.n, o: S.range > Math.max(...a.reach) ? 'falls short at ' + RNG[S.range] : 'smothered - too close at ' + RNG[S.range] }); opening[v] = 1; continue; }
      const drawn = P[s.k].lead === 'feint' && a.h === 1;

// ---- the machine: reads the range, your guard as he sees it, and what you did LAST beat

      ids.map((id) => { const a = ACT[id], on = cur === id, room = left + (cur ? ACT[cur].st : 0), short = a.st > room, reach = a.d ? a.reach.includes(after) : true;
        const sub = a.d ? `${a.d} health - ${LINE[a.line].toLowerCase()} - reaches ${a.reach.map((r) => RNG[r]).join(', ')}` : a.t;

  $('acts').innerHTML = `<button class="btn go" id="go">Fight this beat</button>`; $('go').onclick = go; }
function go() { if (busy) return; busy = true; phase = 'play'; $('acts').innerHTML = ''; for (const b of $('board').querySelectorAll('.sw')) b.disabled = true;

      if (e.t === 'hit') { if (still) pic(`${col}_${ACT[e.id].pic}_landed`); snd(ACT[e.id].body ? 'punch_body_1' : e.dmg >= 4 ? 'punch_big_1' : e.dmg >= 3 ? 'punch_power_head_2' : 'punch_jab_head_1'); pop(1 - e.k, '-' + e.dmg, 'dmg'); if (e.k === 1) jolt(); }
      else if (e.t === 'block') { if (still) pic(`${col}_${ACT[e.id].pic}_blocked`); snd('punch_block_' + (1 + popN++ % 2)); pop(1 - e.k, 'blocked', 'ok'); }

/* a held guard is SEEN too: when both hands are held the same way the player settles into it (no take holds ONE hand) */
let heldShown = '';
