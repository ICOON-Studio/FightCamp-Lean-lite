<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Puncher's chance - what changed</title>
<style>
:root{--bg:#171210;--fg:#f3ece1;--muted:#9a9184;--gold:#e3ab45;--line:#3a3029}
html,body{margin:0}body{background:var(--bg);color:var(--fg);font:1.05rem/1.45 "Segoe UI",system-ui,sans-serif}
main{max-width:52rem;margin:0 auto;padding:1.6rem 1.2rem 3rem}
h1{font-size:1.5rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0 0 .2rem}
.now{color:var(--muted);margin:0 0 1.6rem}.now b{color:var(--fg)}
section{border-top:1px solid var(--line);padding:1rem 0}
h2{font-size:1.05rem;margin:0 0 .4rem;display:flex;gap:.8rem;align-items:baseline}
h2 span{color:var(--muted);font-weight:400;font-size:.9rem}
section.cur h2 b{color:var(--gold)}
ul{margin:0;padding-left:1.2rem}li{margin:.25rem 0}
a{color:var(--gold)}
</style><script src="version.js"></script></head>
<body><main>
<h1>Puncher's chance - what changed</h1>
<p class="now" id="now"></p>
<div id="list"></div>
<p class="now"><a href="order.html">Back to the ring</a></p>
</main><script>
(function () { var C = window.RS_CHANGES || [], esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  document.getElementById('now').innerHTML = C.length ? 'You are running <b>version ' + esc(C[0].v) + '</b> (' + esc(C[0].date) + '). Newest first.' : 'No version file found.';
  document.getElementById('list').innerHTML = C.map(function (e, i) { return '<section class="' + (i ? '' : 'cur') + '"><h2><b>' + esc(e.v) + '</b><span>' + esc(e.date) + '</span></h2><ul>' + e.items.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></section>'; }).join(''); })();
</script></body></html>
