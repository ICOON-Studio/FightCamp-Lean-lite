<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Two Hands</title>
<style>
:root{color-scheme:dark;--bg:#151211;--panel:#221c18;--panel2:#2b231d;--line:#43332a;--line2:#5a4436;--fg:#f2e9dd;--muted:#b7a595;--gold:#e3ab45;--red:#d9534a;--blue:#5f92d8;--green:#74bd7c}
*{box-sizing:border-box}html{font-size:clamp(13px,1.05vw,22px)}html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 50% -10%,#2a211b 0%,var(--bg) 60%);color:var(--fg);font:1.05rem/1.35 "Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.app{min-height:100%;display:grid;grid-template-rows:auto auto 1fr auto;gap:.7rem;padding:.7rem max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;gap:1.2rem;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:.5rem;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}.top b{color:var(--gold)}
.lab{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.men{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.man{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.6rem .8rem;display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;align-items:center}
.man h2{margin:0;font-size:1.2rem;grid-column:1/3}.you h2{color:var(--blue)}.him h2{color:var(--red)}
.bar{height:.9rem;border-radius:4px;background:#3a2e26;border:1px solid var(--line2);overflow:hidden}.bar i{display:block;height:100%;transition:width .35s}
.hp i{background:var(--red)}.st i{background:var(--green)}
.clock{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.25rem;color:var(--gold)}.clock.last{color:#ff8f86}.ticks{display:inline-flex;gap:3px;vertical-align:middle;margin-left:.4rem}.ticks i{width:1.1rem;height:.55rem;border-radius:2px;background:#3a2e26;border:1px solid var(--line2)}.ticks i.done{background:var(--muted)}.ticks i.cur{background:var(--gold);border-color:var(--gold)}
.tag{display:inline-block;padding:1px .5rem;border-radius:.7rem;border:1px solid var(--red);color:#ffb3ad;font-size:.8rem;margin-left:.4rem}
.duo{display:grid;grid-template-columns:minmax(18rem,40%) 1fr;gap:.8rem;align-items:start}.tell{display:flex;flex-direction:column;gap:.5rem;min-width:0}
.stage{position:relative;height:clamp(11rem,31vh,19rem);border-radius:.6rem;overflow:hidden;display:flex;justify-content:center;background:linear-gradient(#1c2230 0%,#2a3447 56%,#4f74ad 56%,#35507f 100%);border:1px solid var(--line2)}
.stage:before,.stage:after{content:"";position:absolute;left:0;right:0;height:3px;background:#c9382f;opacity:.85}.stage:before{top:30%}.stage:after{top:43%;background:#e8e1d6}
.stage img{position:absolute;top:-17%;height:126%;left:50%;transform:translateX(-50%) scaleX(-1);z-index:1;filter:drop-shadow(0 8px 6px rgba(0,0,0,.45))}
.stage .nm{position:absolute;bottom:.4rem;z-index:2;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem;text-shadow:0 1px 3px #000}.stage .nm.you{left:.7rem;color:#9cc0f5}.stage .nm.him{right:.7rem;color:#ff9d95}
.pop{position:absolute;top:22%;z-index:3;font-weight:800;font-size:2.1rem;text-shadow:0 2px 6px #000;opacity:0;pointer-events:none}.pop.p0{left:24%}.pop.p1{right:24%}
.pop.go{animation:pop .9s ease-out}.pop.dmg{color:#ff6b5e}.pop.ok{color:#8fe39a;font-size:1.5rem}
@keyframes pop{0%{opacity:0;transform:translateY(12px) scale(.7)}15%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-38px) scale(1)}}
.stage.shake{animation:shake .28s}.stage.flash:before{box-shadow:0 0 0 100vmax rgba(217,83,74,.28)}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.mute{margin-left:.6rem;padding:.2rem .6rem;border-radius:.4rem;border:1px solid var(--line2);background:var(--panel2);font-size:.85rem}
@media (prefers-reduced-motion:reduce){.stage.shake{animation:none}.pop.go{animation:none;opacity:1}}
.table{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.8rem;display:flex;flex-direction:column;gap:.6rem;min-height:15rem}
.said{font-size:1.25rem;font-weight:600;min-height:1.7rem}.sub{color:var(--muted);min-height:1.3rem}
.combo{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;min-height:3rem}
.story{display:grid;gap:.3rem;width:100%}.srow{display:grid;grid-template-columns:1.6rem minmax(9rem,14rem) 1fr auto;gap:.7rem;align-items:center;padding:.4rem .7rem;border-radius:.5rem;border:1px solid var(--line2);background:var(--panel2);font-size:1.05rem}
.srow em{font-style:normal;font-weight:700}.srow.good{border-color:var(--green)}.srow.good em{color:var(--green)}.srow.bad{border-color:var(--red)}.srow.bad em{color:#ff8f86}.srow.now{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}.srow.dim{opacity:.5}
@media (max-width:820px){.srow{grid-template-columns:1.2rem auto 1fr;gap:.4rem}.srow em{grid-column:2 / 4}}
.chip{padding:.35rem .7rem;border-radius:.5rem;border:1px solid var(--line2);background:var(--panel2)}.chip.now{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.chip.hit{border-color:var(--red)}.chip.safe{border-color:var(--green)}.chip.dim{opacity:.45}
.rows{display:grid;gap:.45rem}
.opt{display:grid;grid-template-columns:19rem 1fr;gap:.6rem;align-items:center}
.opt button{min-height:2.7rem;border-radius:.5rem;border:1px solid var(--line2);background:var(--panel2);text-align:left;padding:.3rem .6rem}
.opt button b{display:block}.opt button small{color:var(--muted);font-size:.8rem}.opt button kbd{float:right;color:var(--gold);font:inherit;font-weight:700}
.track{position:relative;height:2.2rem;border-radius:.4rem;background:#1a1513;border:1px solid var(--line2);overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:rgba(116,189,124,.45);border-left:1px solid var(--green);border-right:1px solid var(--green)}
.zone.risk{background:rgba(227,171,69,.5);border-color:var(--gold)}
.mark{position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 8px #fff;left:0}
.impact{position:absolute;top:0;bottom:0;width:1px;background:var(--red);opacity:.7}
.hands{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.hand{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.6rem}
.cards{display:flex;gap:.5rem;margin-top:.3rem}
.card{flex:1;min-height:5.6rem;background:var(--panel2);border:1px solid var(--line2);border-radius:.5rem;padding:.4rem .55rem;text-align:left;position:relative}
.card b{display:block}.card small{display:block;color:var(--muted);font-size:.8rem;line-height:1.25}.card .w{position:absolute;top:4px;right:.5rem;color:var(--gold);font-size:.82rem}
.card.pick{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}.card.no{opacity:.4;cursor:not-allowed}.card:not(.no):hover{border-color:var(--gold)}
.setup{display:grid;gap:.8rem}.opps{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem}
.opp{background:var(--panel2);border:1px solid var(--line2);border-radius:.6rem;padding:.6rem .7rem;text-align:left}.opp b{display:block;font-size:1.1rem;color:#ff9d95}.opp small{display:block;color:var(--muted);line-height:1.3}
.opp.pick{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.pack{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}.pk{background:var(--panel2);border:1px solid var(--line2);border-radius:.6rem;padding:.6rem .7rem}
.pk .ln{display:grid;grid-template-columns:1fr auto;align-items:center;gap:.5rem;padding:.15rem 0}.pk .ln small{display:block;color:var(--muted);font-size:.78rem}
.cnt{display:inline-flex;align-items:center;gap:.35rem}.cnt button{width:2.2rem;height:2.2rem;border-radius:.4rem;border:1px solid var(--line2);background:var(--panel);font-weight:700}.cnt b{min-width:1.2rem;text-align:center}
.pk .bad{color:#ff8f86}.pk .okc{color:var(--green)}
@media (max-width:820px){.opps{grid-template-columns:1fr}.pack{grid-template-columns:1fr}}
.acts{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap}
.btn{padding:.7rem 1.3rem;border-radius:.55rem;border:1px solid var(--line2);background:var(--panel2);font-weight:600;min-height:44px}
.btn.go{background:var(--gold);color:#231a12;border-color:var(--gold);animation:pulse 1.4s infinite}.btn:disabled{opacity:.4;animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(227,171,69,.25)}}
.log{font-size:.92rem;color:#d9cbba;max-height:4.4rem;overflow:auto}.log div{padding:1px 0;border-bottom:1px dotted #33281f}
@media (max-width:820px){html{font-size:14px}.duo{grid-template-columns:1fr}.opt{grid-template-columns:9.5rem 1fr}.card{min-height:6.5rem}.btn{flex:1}}
@media (prefers-reduced-motion:reduce){.btn.go{animation:none}}
</style></head>
<body><div class="app">
  <div class="top"><span class="brand">Two Hands</span><span id="where"></span><span id="score"></span><span class="lab" style="margin-left:auto">a deck for each hand - defend by timing</span><button class="mute" id="mute">Sound on</button></div>
  <div class="men"><div class="man you" id="you"></div><div class="man him" id="him"></div></div>
  <div class="table"><div class="duo"><div class="stage" id="stage"><img id="pic" alt="" src="img/guard.webp"><span class="pop p0" id="pop0"></span><span class="pop p1" id="pop1"></span><span class="nm you">You</span><span class="nm him" id="nmhim">Him</span></div><div class="tell"><div class="said" id="said"></div><div class="sub" id="sub"></div><div class="combo" id="combo"></div></div></div><div class="rows" id="rows"></div><span class="lab">What happened - newest on top</span><div class="log" id="log"></div></div>
  <div><div class="hands" id="hands"></div><div class="acts" id="acts" style="margin-top:.6rem"></div></div>
</div>
<script>
// TWO HANDS (S551 toy, owner: "you can use deck for each hand or even combine them ... decide what each move hits and give
// opponent various options"; defence by timing, "like Expedition 33"). A feel test, not a balanced game: every number is in N / MOVES.
const N = { hp: 12, st: 6, rec: 2, defCost: 1, bell: 4, spare: 1, ctrHalf: 80, ctrMs: 620, aiCtr: 0.5, rounds: 3, leads: 3, combo: 3, half: 170, alt: 0.8, rocked: 0.75, bit: 0.6, gapAlt: 380, gapSame: 620, counter: 2, kdBack: [5, 4], aiSkill: 0.8 };
// o: the defences that work against the move -> window size (1 = full). k: what the defence does.
const DEF = { block: { v: ['block', 'blocks'], n: 'Block', k: 'soak', t: 'Takes the sting out. His combination goes on.' }, elbow: { v: ['cover up against', 'covers up against'], n: 'Elbow block', k: 'soak', t: 'Covers the ribs. His combination goes on.' },
  slip: { v: ['slip', 'slips'], n: 'Slip', k: 'evade', t: 'It misses. Then a timed counter: land it to stop him.' }, duck: { v: ['duck under', 'ducks under'], n: 'Duck under', k: 'evade', t: 'It sails over. Then a timed counter: land it to stop him.' },
  parry: { v: ['parry', 'parries'], n: 'Parry', k: 'evade', t: 'You knock it aside. Then a timed counter: land it to stop him.' }, step: { v: ['step back', 'steps back'], n: 'Step back', k: 'away', t: 'It falls short and his combination ends. You give ground.' },
  lean: { v: ['lean back', 'leans back'], n: 'Lean back', k: 'away', t: 'It passes your chin and his combination ends. You give ground.' } };
const MOVES = {
  jab: { n: 'Jab', h: 0, hits: 'head', d: 1, p: 1, st: 1, ms: 700, chip: 0, o: { block: 1, slip: 0.55, parry: 0.42 } },
  hook: { n: 'Lead hook', h: 0, hits: 'head, from the side', d: 3, p: 2, st: 2, ms: 820, chip: 1, o: { block: 0.9, duck: 0.5, step: 0.7 } },
  lup: { n: 'Lead uppercut', h: 0, hits: 'chin, from below', d: 3, p: 2, st: 2, ms: 800, o: { lean: 0.6, slip: 0.42 } },
  lbody: { n: 'Lead body hook', h: 0, hits: 'ribs', d: 1, p: 1, st: 2, ms: 800, chip: 0, body: 1, o: { elbow: 0.8, step: 0.65 } },
  feint: { n: 'Feint', h: 0, hits: 'nothing', d: 0, p: 0, st: 1, ms: 520, feint: 1, o: {} },
  cross: { n: 'Cross', h: 1, hits: 'head, straight', d: 3, p: 2, st: 2, ms: 740, chip: 1, o: { block: 0.9, slip: 0.5, step: 0.7 } },
  over: { n: 'Overhand', h: 1, hits: 'head, over the top', d: 4, p: 2, st: 3, ms: 980, chip: 2, o: { block: 1, duck: 0.6, step: 0.8 } },
  rup: { n: 'Rear uppercut', h: 1, hits: 'chin, from below', d: 4, p: 2, st: 3, ms: 860, o: { lean: 0.6, slip: 0.42 } },
  rbody: { n: 'Body cross', h: 1, hits: 'stomach', d: 2, p: 1, st: 2, ms: 760, chip: 0, body: 1, o: { elbow: 0.8, step: 0.65 } },
};
// three opponents who fight differently: their own two decks, speed (ms x), health, and how the machine defends
const OPPS = [
  { n: 'The Jabber', t: 'Out-boxer. A fast jab, feints, and he counters well. Light hands, less health.', decks: [['jab', 'jab', 'jab', 'jab', 'jab', 'hook', 'feint', 'feint', 'feint', 'lbody'], ['cross', 'cross', 'cross', 'rbody', 'rbody', 'over']], ms: 0.88, hp: 10, ctr: 0.7, skill: 0.9, soak: 0.45 },
  { n: 'The Slugger', t: 'Slow and heavy. Overhands and uppercuts. He blocks, rarely slips, and takes a lot.', decks: [['jab', 'jab', 'hook', 'hook', 'hook', 'lup', 'lup', 'lbody'], ['over', 'over', 'over', 'rup', 'rup', 'cross', 'cross']], ms: 1.14, hp: 14, ctr: 0.3, skill: 0.7, soak: 0.8 },
  { n: 'The Body Snatcher', t: 'Pressure. He goes to the ribs to shorten your stamina, three punches at a time.', decks: [['jab', 'jab', 'jab', 'lbody', 'lbody', 'lbody', 'hook', 'feint'], ['rbody', 'rbody', 'rbody', 'cross', 'cross', 'rup']], ms: 1.0, hp: 12, ctr: 0.5, skill: 0.8, soak: 0.6 },
];
// your two hands: how many of each move you pack. A hand's deck must be exactly its size.
const PACK = [{ size: 10, max: 5, ids: ['jab', 'hook', 'lup', 'lbody', 'feint'] }, { size: 8, max: 4, ids: ['cross', 'over', 'rup', 'rbody'] }];
let mine = [{ jab: 4, hook: 2, lup: 1, lbody: 1, feint: 2 }, { cross: 3, over: 2, rup: 1, rbody: 2 }], oppI = 0, OPP = OPPS[0];
const packed = (h) => Object.values(mine[h]).reduce((x, y) => x + y, 0), myDecks = () => mine.map((c) => Object.entries(c).flatMap(([id, n]) => Array(n).fill(id)));
const DECKS = [['jab', 'jab', 'jab', 'jab', 'hook', 'hook', 'lup', 'lbody', 'feint', 'feint'], ['cross', 'cross', 'cross', 'over', 'over', 'rup', 'rbody', 'rbody']];
const HAND = ['Lead hand', 'Rear hand'], KEYS = ['a', 's', 'd'];
// pictures and sounds: the move -> its picture name; the attacker's colour (you are blue, he is red)
const PIC = { jab: 'jab', hook: 'lead_hook', lup: 'lead_uppercut', lbody: 'body_hook', cross: 'cross', over: 'rear_hook', rup: 'rear_uppercut', rbody: 'body_cross' };
let mute = false, popN = 0;
const snd = (n, v = 0.7) => { if (mute) return; try { const au = new Audio('snd/' + n + '.ogg'); au.volume = v; au.play().catch(() => {}); } catch (e) {} };
const pic = (n) => { const el = document.getElementById('pic'); if (el) el.src = 'img/' + n + '.webp'; };
function pop(who, text, cls) { const el = document.getElementById('pop' + who); el.textContent = text; el.className = 'pop p' + who + ' ' + cls; void el.offsetWidth; el.classList.add('go'); }
function jolt(hard) { const st = document.getElementById('stage'); st.classList.remove('shake', 'flash'); void st.offsetWidth; st.classList.add('shake'); if (hard) { st.classList.add('flash'); setTimeout(() => st.classList.remove('flash'), 160); } }
// one punch shown: kind = clean | soak | miss. att = who threw it (0 you, 1 him)
function fx(kind, att, id, dmg) { const m = MOVES[id], col = att ? 'red' : 'blue', vic = 1 - att;
  pic(`${col}_${PIC[id]}_${kind === 'clean' ? 'landed' : kind === 'soak' ? 'blocked' : 'missed'}`);
  if (kind === 'clean') { snd(m.body ? 'punch_body_1' : dmg >= 4 ? 'punch_big_1' : dmg >= 3 ? 'punch_power_head_2' : 'punch_jab_head_1'); pop(vic, '-' + dmg, 'dmg'); jolt(vic === 0); if (dmg >= 3) snd('crowd_club_oooh_1', 0.35); }
  else if (kind === 'soak') { snd('punch_block_' + (1 + popN++ % 2)); pop(vic, dmg ? '-' + dmg : 'blocked', dmg ? 'dmg' : 'ok'); }
  else { snd('punch_miss_whoosh_' + (1 + popN++ % 2)); pop(vic, 'missed', 'ok'); } }
function fxCounter(def) { pic(`${def ? 'red' : 'blue'}_cross_landed`); snd('punch_power_head_3'); pop(1 - def, '-' + N.counter, 'dmg'); jolt(def === 1); }
function fxDown(k) { setTimeout(() => { pic(`${k ? 'red' : 'blue'}_knockdown_2`); snd('knockdown_fall_4'); snd('crowd_club_cheer_1', 0.4); }, 380); }
const $ = (id) => document.getElementById(id), rnd = Math.random, pickOne = (a) => a[Math.floor(rnd() * a.length)];
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let F, round, turn, a, phase, pick, logs = [], cards = [], live = null;
const man = (src = DECKS, hp = N.hp) => ({ hp, max: hp, st: N.st, cap: N.st, pts: 0, kd: 0, ropes: 0, rocked: 0, bit: 0, src, decks: src.map((d) => shuffle([...d])), up: [[], []] });
function fill(m) { for (const h of [0, 1]) while (m.up[h].length < 2) { if (!m.decks[h].length) m.decks[h] = shuffle([...m.src[h]].filter((id) => !m.up[h].includes(id) || rnd() < 0.5)); m.up[h].push(m.decks[h].pop()); } }
const log = (t) => { logs.unshift(t); $('log').innerHTML = logs.slice(0, 30).map((l) => `<div>${l}</div>`).join(''); };
const cost = (ids) => ids.reduce((s, id) => s + MOVES[id].st, 0);

function draw() { $('stage').style.display = phase === 'setup' ? 'none' : ''; $('nmhim').textContent = OPP.n;
  for (const k of [0, 1]) { const m = F[k];
    $(k ? 'him' : 'you').innerHTML = `<h2>${k ? OPP.n : 'You'}${m.ropes >= 2 ? '<span class="tag">on the ropes</span>' : ''}${m.rocked ? '<span class="tag">rocked</span>' : ''}${m.kd ? `<span class="tag">down ${m.kd}x</span>` : ''}</h2>
      <span class="lab">Health ${Math.max(0, m.hp)} of ${m.max}</span><div class="bar hp"><i style="width:${100 * Math.max(0, m.hp) / m.max}%"></i></div>
      <span class="lab">Stamina ${m.st} of ${m.cap}</span><div class="bar st"><i style="width:${100 * m.st / N.st}%"></i></div>`; }
  { const all = 2 * N.leads, left = Math.max(0, all - turn), sec = left * (180 / all), last = left <= 1, cur = phase === 'shown' || phase === 'over' ? -1 : turn;
    $('where').innerHTML = `Round <b>${round}</b> of ${N.rounds} &nbsp; <span class="clock ${last ? 'last' : ''}" title="A round is ${all} exchanges: each man leads ${N.leads} times">${Math.floor(sec / 60)}:${String(Math.round(sec % 60)).padStart(2, '0')}</span><span class="ticks">${Array.from({ length: all }, (_, j) => `<i class="${j < turn ? 'done' : j === cur ? 'cur' : ''}"></i>`).join('')}</span> ${left === 0 ? 'the bell' : last ? '<b>last exchange of the round</b>' : left + ' exchanges to the bell'}`; }
  $('score').innerHTML = `Points this round: you <b>${F[0].pts}</b> - him <b>${F[1].pts}</b>` + cards.map((c, i) => ` &nbsp; R${i + 1} ${c[0]}-${c[1]}`).join('');
}
const face = (id, h, i, cls) => { const m = MOVES[id], o = Object.keys(m.o).map((k) => DEF[k].n.toLowerCase()).join(', ');
  return `<button class="card ${cls}" data-h="${h}" data-i="${i}"><span class="w">${m.st} stamina</span><b>${m.n}</b><small>${m.feint ? 'Lands nothing. If he bites, his next window shrinks.' : `Hits the ${m.hits}. ${m.d} health${m.body ? ', his stamina bar 1 shorter' : ''}.`}</small><small>${m.feint ? '' : 'He can: ' + o}</small></button>`; };
function hands(active) { const me = F[0];
  $('hands').innerHTML = [0, 1].map((h) => `<div class="hand"><span class="lab">${HAND[h]}</span><div class="cards">${me.up[h].map((id, i) => { const n = pick.findIndex((p) => p.h === h && p.i === i);
    const no = !active || (n < 0 && (pick.length >= N.combo || cost(pick.map((p) => p.id)) + MOVES[id].st > me.st)); return face(id, h, i, (n >= 0 ? 'pick ' : '') + (no ? 'no' : '')); }).join('')}</div></div>`).join('');
  if (active) for (const b of $('hands').querySelectorAll('.card')) b.onclick = () => { const h = +b.dataset.h, i = +b.dataset.i, n = pick.findIndex((p) => p.h === h && p.i === i);
    if (n >= 0) pick.splice(n, 1); else if (!b.classList.contains('no')) pick.push({ h, i, id: me.up[h][i] }); lead(); }; }
const chips = (ids, at, marks = []) => ids.map((id, i) => `<span class="chip ${i === at ? 'now' : ''} ${marks[i] || ''}">${i + 1}. ${MOVES[id].n}</span>`).join('');

// before the bout: pick the man in the other corner and pack your two hands
function setup() { phase = 'setup'; F = [man(myDecks()), man(OPP.decks, OPP.hp)]; round = 1; turn = 0; cards = []; logs = []; pick = []; xr = []; draw(); pic('guard');
  $('said').textContent = 'Who is in the other corner, and what is in your hands?'; $('sub').textContent = 'Two moves of each hand are always face up in the bout. What you pack is what can come up.';

      return `<div class="ln"><span><b>${m.n}</b><small>${m.feint ? 'draws a press; his next band shrinks' : `${m.d} health, ${m.st} stamina${m.body ? ', shortens his stamina bar' : ''} - he can ${Object.keys(m.o).map((k) => DEF[k].n.toLowerCase()).join(', ')}`}</small></span><span class="cnt"><button data-h="${h}" data-id="${id}" data-d="-1">-</button><b>${mine[h][id]}</b><button data-h="${h}" data-id="${id}" data-d="1">+</button></span></div>`; }).join('')}</div>`).join('')}</div></div>`;

function start() { F = [man(myDecks()), man(OPP.decks, OPP.hp)]; snd('bell_round_start_1', 0.5); round = 1; turn = 0; cards = []; logs = []; pick = []; a = rnd() < 0.5 ? 0 : 1; log(`Round 1. ${a ? 'He leads' : 'You lead'} first.`); for (const m of F) fill(m); draw(); hands(false);
  $('said').textContent = a ? 'He leads first. His punches come one at a time.' : 'You lead first.'; $('sub').textContent = 'When he punches: press a defence (A, S, D or tap it) while the white line is inside its band. Wide band = safe block. Narrow band = a counter.';
  $('combo').innerHTML = ''; $('rows').innerHTML = ''; $('acts').innerHTML = `<button class="btn go" id="next">${a ? 'Ready - let him come' : 'Start'}</button>`; $('next').onclick = next; }
function next() {

    if (round >= N.rounds) { const t = [0, 1].map((k) => cards.reduce((s, c) => s + c[k], 0)); return over(t[0] === t[1] ? `A DRAW ${t[0]}-${t[1]}` : `${t[0] > t[1] ? 'YOU WIN' : 'HE WINS'} on the cards ${t[0]}-${t[1]}`); }

  if (a === 0) lead(); else { const ids = aiCombo(); if (!ids.length) { F[1].st = Math.min(F[1].cap, F[1].st + N.combo * N.spare); log('He has nothing left to throw and covers up.'); return done('He has nothing left to throw and covers up.'); } defend(ids); }
}
function lead() { phase = 'lead'; const ids = pick.map((p) => p.id), ok = ids.length && MOVES[ids[ids.length - 1]].feint !== 1;
  $('said').textContent = 'Your lead: pick up to three moves from your two hands, in order.'; $('sub').textContent = `Changing hands makes the next punch come faster. A feint cannot be last. ${N.rec} stamina comes back each exchange, +${N.spare} for each of the three moves you do not throw.`;
  $('combo').innerHTML = ids.length ? chips(ids, -1) + `<span class="lab">${cost(ids)} stamina</span>` : ''; $('rows').innerHTML = ''; hands(true);
  const me0 = F[0], broke = ![0, 1].some((h) => me0.up[h].some((id) => !MOVES[id].feint && MOVES[id].st <= me0.st)), spare = (N.combo - ids.length) * N.spare;
  $('acts').innerHTML = (broke ? `<button class="btn go" id="rest">Cover up - you cannot pay for a punch (+${N.combo * N.spare} stamina)</button>` : `<span class="lab" style="align-self:center">${ids.length ? (spare ? `throwing ${ids.length}: +${spare} stamina back for holding the rest` : 'throwing all three: nothing held back') : 'fewer punches = stamina back'}</span>`) + `<button class="btn ${broke ? '' : 'go'}" id="go" ${ok ? '' : 'disabled'}>Throw it</button>`;

function aiCombo() { const m = F[1], out = []; let st = m.st, last = -1; const pool = [0, 1].flatMap((h) => m.up[h].map((id, i) => ({ h, i, id })));

// the story of the exchange on the table: one row a move - who threw what, what the other man did, what it cost
let xr = [];
const rec = (move, act, out, cls) => xr.push({ move, act, out, cls });
function story(att, ids, at, hidden) { return '<div class="story">' + ids.map((id, j) => { const r = xr[j], w = att ? 'His' : 'Your';
  if (r) return `<div class="srow ${r.cls}"><span>${j + 1}</span><b>${w} ${r.move}</b><span>${r.act}</span><em>${r.out}</em></div>`;
  if (j === at) return `<div class="srow now"><span>${j + 1}</span><b>${w} ${MOVES[id].feint && att ? '...' : MOVES[id].n}</b><span>coming now</span><em></em></div>`;
  return `<div class="srow dim"><span>${j + 1}</span><b>${at < 0 ? w + ' ' + MOVES[id].n : hidden ? 'face down' : w + ' ' + MOVES[id].n}</b><span>${at < 0 ? 'not thrown' : 'still to come'}</span><em></em></div>`; }).join('') + '</div>'; }

// he leads: each punch sweeps across; you press a defence in its band
function defend(ids) { phase = 'defend'; xr = []; hands(false); $('acts').innerHTML = ''; const marks = []; let i = 0, prev = null;
  const one = () => { if (i >= ids.length || F[0].hp <= 0) return finish(1, ids, marks);
    const id = ids[i], m = MOVES[id], D = F[0], opts = options(D, id), lead = 0.72, total = m.ms * OPP.ms + (prev == null ? 500 : MOVES[prev].h !== m.h ? N.gapAlt : N.gapSame);
    F[1].st -= m.st; draw(); pic('guard');
    $('said').textContent = m.feint ? 'He twitches...' : `His ${m.n} is coming - ${m.hits}.`; $('sub').textContent = m.feint ? '' : opts.length ? 'Press a defence when the white line is inside its band.' : 'Nothing you have stops this.';
    $('combo').innerHTML = story(1, ids, i, true);
    const shownOpts = m.feint ? ['block', 'slip', 'step'] : opts;
    $('rows').innerHTML = shownOpts.map((k, r) => { const hw = m.feint ? N.half * 0.6 : half(D, id, k, prev), l = 100 * (lead - hw / total), wdt = 100 * 2 * hw / total;
      return `<div class="opt"><button data-k="${k}"><kbd>${KEYS[r].toUpperCase()}</kbd><b>${DEF[k].n}${dcost(k) ? ' - ' + dcost(k) + ' stamina' : ''}</b><small>${DEF[k].t}</small></button><div class="track"><div class="zone ${DEF[k].k === 'soak' ? '' : 'risk'}" style="left:${l}%;width:${wdt}%"></div><div class="impact" style="left:${100 * lead}%"></div><div class="mark"></div></div></div>`; }).join('');
    const t0 = performance.now(); let pressed = null;
    const press = (k) => { if (pressed || !live) return; pressed = { k, t: performance.now() - t0 }; };
    for (const b of $('rows').querySelectorAll('button')) b.onpointerdown = (e) => { e.preventDefault(); press(b.dataset.k); };
    live = { keys: shownOpts, press };
    const tick = (now) => { const t = now - t0, endAt = m.feint ? total * 0.55 : total;
      for (const el of $('rows').querySelectorAll('.mark')) el.style.left = Math.min(100, 100 * t / total) + '%';

      live = null; let res;
      if (m.feint) { if (pressed) { D.bit = 1; res = 'hit'; log('He feints and you bite: your next band is smaller.'); $('said').textContent = 'A feint - and you bit.'; rec('Feint', 'You moved - there was no punch', 'your next band is smaller', 'bad'); } else { res = 'safe'; log('He feints. You do not move.'); $('said').textContent = 'A feint. You held still.'; rec('Feint', 'You held still', 'nothing lost', 'good'); } }
      else { if (pressed) D.st = Math.max(0, D.st - dcost(pressed.k)); const k = pressed && pressed.k, off = pressed ? Math.abs(pressed.t - lead * total) : 1e9, good = k && off <= half(D, id, k, prev); res = resolve(1, id, good ? k : null, pressed ? (pressed.t < lead * total ? 'too early' : 'too late') : 'no defence'); D.bit = 0; }
      marks[i] = res === 'hit' ? 'hit' : 'safe'; prev = id; i++; draw();
      if (res === 'evade') return setTimeout(() => sweepCounter((ok) => { counter(0, ok); draw(); $('rows').innerHTML = ''; if (ok || F[1].hp <= 0) setTimeout(() => finish(1, ids, marks), 700); else setTimeout(one, 450); }), 200);
      if (res === 'stop') return setTimeout(() => finish(1, ids, marks), 650); setTimeout(one, m.feint ? 250 : 420); };
    requestAnimationFrame(tick); };
  one(); }
// one punch from `att` meets defence `k` (null = it lands clean). Returns 'hit' | 'safe' | 'stop'
function resolve(att, id, k, whyNot) { const A = F[att], D = F[1 - att], m = MOVES[id], you = att === 1, his = you ? 'His' : 'Your', who = you ? 'You' : 'He', g = you ? 'good' : 'bad', b = you ? 'bad' : 'good';
  const miss = { 'too early': 'You pressed too early', 'too late': 'You pressed too late', 'no defence': 'You did not defend', 'nothing stops it': 'He has no answer to it' }[whyNot] || (whyNot ? whyNot[0].toUpperCase() + whyNot.slice(1) : '');
  if (!k) { D.hp -= m.d; A.pts += m.p; D.rocked = 1; if (m.body) { D.cap = Math.max(3, D.cap - 1); D.st = Math.min(D.st, D.cap); }
    fx('clean', att, id, m.d); rec(m.n, miss + ' - it lands clean', `-${m.d} health${you ? '' : ' for him'}${m.body ? ', stamina bar shorter' : ''}${D.hp <= 0 ? ' - DOWN' : ''}`, b);
    const t = `${his} ${m.n} lands clean (${whyNot}): -${m.d} health${m.body ? ', stamina bar 1 shorter' : ''}.`; log(t); $('said').textContent = t; if (D.hp <= 0) { down(1 - att); return 'stop'; } return 'hit'; }
  const d = DEF[k]; D.rocked = 0;
  if (d.k === 'soak') { D.hp -= m.chip || 0; fx('soak', att, id, m.chip || 0); rec(m.n, `${who} ${d.v[you ? 0 : 1]} it`, m.chip ? `-${m.chip} health${you ? '' : ' for him'} gets through${D.hp <= 0 ? ' - DOWN' : ''}` : 'no damage', m.chip ? b : g); const t = `${who} ${d.v[you ? 0 : 1]} the ${m.n}${m.chip ? ' - ' + m.chip + ' health gets through' : ''}.`; log(t); $('said').textContent = t; if (D.hp <= 0) { down(1 - att); return 'stop'; } return 'safe'; }
  if (d.k === 'evade') { fx('miss', att, id, 0); rec(m.n, `${who} ${d.v[you ? 0 : 1]} it`, 'no damage', g); const t = `${who} ${d.v[you ? 0 : 1]} the ${m.n}.`; log(t); $('said').textContent = t; return 'evade'; }
  D.ropes++; fx('miss', att, id, 0); rec(m.n, `${who} ${d.v[you ? 0 : 1]}`, 'it falls short' + (D.ropes >= 2 ? (you ? ' - you are on the ropes' : ' - he is on the ropes') : ''), g); const t = `${who} ${d.v[you ? 0 : 1]}: the ${m.n} falls short.${D.ropes >= 2 ? (you ? ' You are on the ropes.' : ' He is on the ropes.') : ''}`; log(t); $('said').textContent = t; return 'stop'; }
// the counter after a slip, duck or parry: `def` is the man who evaded. It lands only if it is timed.
function counter(def, ok) { const A = F[1 - def], D = F[def], you = def === 0, r = xr[xr.length - 1];

    const t = `${you ? 'Your' : 'His'} counter lands: -${N.counter} health for ${you ? 'him' : 'you'}. ${you ? 'His' : 'Your'} combination ends.`; log(t); $('said').textContent = t; if (A.hp <= 0) down(1 - def); }
  else { r.act += you ? ' - your counter misses' : ' - his counter misses'; const t = `${you ? 'Your' : 'His'} counter misses. ${you ? 'He keeps coming.' : 'You keep going.'}`; log(t); $('said').textContent = t; } }
function sweepCounter(cb) { const D = F[0], total = N.ctrMs, lead = 0.62, hw = N.ctrHalf * (0.7 + 0.3 * D.st / N.st);
  $('said').textContent = 'COUNTER! Press when the line is in the band.'; $('sub').textContent = 'Miss it and he keeps coming.';
  $('rows').innerHTML = `<div class="opt"><button data-k="counter"><kbd>A</kbd><b>Counter</b><small>${N.counter} health and his combination ends.</small></button><div class="track"><div class="zone risk" style="left:${100 * (lead - hw / total)}%;width:${100 * 2 * hw / total}%"></div><div class="impact" style="left:${100 * lead}%"></div><div class="mark"></div></div></div>`;
  const t0 = performance.now(); let pressed = null; const press = () => { if (pressed == null) pressed = performance.now() - t0; };
  $('rows').querySelector('button').onpointerdown = (e) => { e.preventDefault(); press(); }; live = { keys: ['counter', 'counter', 'counter'], press };
  const tick = (now) => { const t = now - t0; $('rows').querySelector('.mark').style.left = Math.min(100, 100 * t / total) + '%';
    if (t < total && pressed == null) return requestAnimationFrame(tick); live = null; cb(pressed != null && Math.abs(pressed - lead * total) <= hw); };
  requestAnimationFrame(tick); }
function down(k) { const m = F[k], w = k ? 'He' : 'You'; m.kd++; fxDown(k); if (m.kd > N.kdBack.length) { m.hp = 0; const t = `${k ? 'HE IS' : 'YOU ARE'} DOWN for the third time - health at 0.`; log(t); $('said').textContent = t; return true; }
  m.hp = N.kdBack[m.kd - 1]; m.rocked = 0; F[1 - k].pts += 3; const t = `${k ? 'HE IS' : 'YOU ARE'} DOWN - health hit 0. ${w} get${k ? 's' : ''} up with ${m.hp} health; 3 points to ${k ? 'you' : 'him'}. Down three times and the referee stops it.`; log(t); $('said').textContent = t; return false; }
// you lead: he defends the same way, his hands played by the machine (you watch the same sweep, quicker)
function attack(ids) { phase = 'attack'; xr = []; hands(false); $('acts').innerHTML = ''; $('rows').innerHTML = ''; const marks = []; let i = 0, prev = null;

    else { const opts = options(D, id), soak = opts.find((k) => DEF[k].k === 'soak'), other = opts.filter((k) => DEF[k].k !== 'soak');
      const k = !opts.length ? null : soak && (rnd() < OPP.soak || !other.length) ? soak : pickOne(other); if (k) D.st = Math.max(0, D.st - dcost(k)); const ok = k && rnd() < Math.min(0.95, OPP.skill * half(D, id, k, prev) / (N.half * 0.6));

function done(text) { phase = 'shown'; if (text) $('said').textContent = text; $('sub').textContent = ''; $('rows').innerHTML = ''; hands(false); draw(); turn++; a = 1 - a;
  $('acts').innerHTML = `<button class="btn go" id="next">${a ? 'His turn - get ready' : 'Your turn'}</button>`; $('next').onclick = next; }

for (const c of ['red', 'blue']) for (const k of Object.values(PIC)) for (const r of ['landed', 'blocked', 'missed']) new Image().src = `img/${c}_${k}_${r}.webp`;
for (const n of ['red_knockdown_2', 'blue_knockdown_2']) new Image().src = `img/${n}.webp`;
window.addEventListener('keydown', (e) => { const k = e.key.toLowerCase(); if (live) { const r = KEYS.indexOf(k); if (r >= 0 && live.keys[r]) { e.preventDefault(); live.press(live.keys[r]); } return; }
  if (k === 'enter' || k === ' ') { e.preventDefault(); (document.getElementById('next') || document.getElementById('again') || document.getElementById('go'))?.click(); } });
setup();

if (/peek=/.test(location.search)) { mute = true; start(); a = 1; next(); }
