<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Two Hands</title>
<style>
:root{color-scheme:dark;--bg:#151211;--panel:#221c18;--panel2:#2b231d;--line:#43332a;--line2:#5a4436;--fg:#f2e9dd;--muted:#b7a595;--gold:#e3ab45;--red:#d9534a;--blue:#5f92d8;--green:#74bd7c}
*{box-sizing:border-box}html{font-size:clamp(13px,1.05vw,22px)}html,body{height:100%;margin:0}
body{background:radial-gradient(1200px 700px at 50% -10%,#2a211b 0%,var(--bg) 60%);color:var(--fg);font:1.05rem/1.35 "Segoe UI",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.app{min-height:100%;display:grid;grid-template-rows:auto auto 1fr auto;gap:.7rem;padding:.7rem max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;gap:1.2rem;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:.5rem;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}.top b{color:var(--gold)}
.lab{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.men{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.man{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.6rem .8rem;display:grid;grid-template-columns:auto 1fr;gap:.2rem .8rem;align-items:center}
.man h2{margin:0;font-size:1.2rem;grid-column:1/3}.you h2{color:var(--blue)}.him h2{color:var(--red)}
.bar{height:.9rem;border-radius:4px;background:#3a2e26;border:1px solid var(--line2);overflow:hidden}.bar i{display:block;height:100%;transition:width .35s}
.hp i{background:var(--red)}.st i{background:var(--green)}
.tag{display:inline-block;padding:1px .5rem;border-radius:.7rem;border:1px solid var(--red);color:#ffb3ad;font-size:.8rem;margin-left:.4rem}
.table{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.8rem;display:flex;flex-direction:column;gap:.6rem;min-height:15rem}
.said{font-size:1.25rem;font-weight:600;min-height:1.7rem}.sub{color:var(--muted);min-height:1.3rem}
.combo{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;min-height:3rem}
.story{display:grid;gap:.3rem;width:100%}.srow{display:grid;grid-template-columns:1.6rem minmax(9rem,14rem) 1fr auto;gap:.7rem;align-items:center;padding:.4rem .7rem;border-radius:.5rem;border:1px solid var(--line2);background:var(--panel2);font-size:1.05rem}
.srow em{font-style:normal;font-weight:700}.srow.good{border-color:var(--green)}.srow.good em{color:var(--green)}.srow.bad{border-color:var(--red)}.srow.bad em{color:#ff8f86}.srow.now{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}.srow.dim{opacity:.5}
@media (max-width:820px){.srow{grid-template-columns:1.2rem 1fr}.srow em{grid-column:2}}
.chip{padding:.35rem .7rem;border-radius:.5rem;border:1px solid var(--line2);background:var(--panel2)}.chip.now{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.chip.hit{border-color:var(--red)}.chip.safe{border-color:var(--green)}.chip.dim{opacity:.45}
.rows{display:grid;gap:.45rem}
.opt{display:grid;grid-template-columns:11rem 1fr;gap:.6rem;align-items:center}
.opt button{min-height:3rem;border-radius:.5rem;border:1px solid var(--line2);background:var(--panel2);text-align:left;padding:.3rem .6rem}
.opt button b{display:block}.opt button small{color:var(--muted);font-size:.8rem}.opt button kbd{float:right;color:var(--gold);font:inherit;font-weight:700}
.track{position:relative;height:2.2rem;border-radius:.4rem;background:#1a1513;border:1px solid var(--line2);overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:rgba(116,189,124,.45);border-left:1px solid var(--green);border-right:1px solid var(--green)}
.zone.risk{background:rgba(227,171,69,.5);border-color:var(--gold)}
.mark{position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 8px #fff;left:0}
.impact{position:absolute;top:0;bottom:0;width:1px;background:var(--red);opacity:.7}
.hands{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.hand{background:var(--panel);border:1px solid var(--line);border-radius:.7rem;padding:.6rem}
.cards{display:flex;gap:.5rem;margin-top:.3rem}
.card{flex:1;min-height:5.6rem;background:var(--panel2);border:1px solid var(--line2);border-radius:.5rem;padding:.4rem .55rem;text-align:left;position:relative}
.card b{display:block}.card small{display:block;color:var(--muted);font-size:.8rem;line-height:1.25}.card .w{position:absolute;top:4px;right:.5rem;color:var(--gold);font-size:.82rem}
.card.pick{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}.card.no{opacity:.4;cursor:not-allowed}.card:not(.no):hover{border-color:var(--gold)}
.acts{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap}
.btn{padding:.7rem 1.3rem;border-radius:.55rem;border:1px solid var(--line2);background:var(--panel2);font-weight:600;min-height:44px}
.btn.go{background:var(--gold);color:#231a12;border-color:var(--gold);animation:pulse 1.4s infinite}.btn:disabled{opacity:.4;animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(227,171,69,.25)}}
.log{font-size:.92rem;color:#d9cbba;max-height:7rem;overflow:auto}.log div{padding:1px 0;border-bottom:1px dotted #33281f}
@media (max-width:820px){html{font-size:14px}.opt{grid-template-columns:8.5rem 1fr}.card{min-height:6.5rem}.btn{flex:1}}
@media (prefers-reduced-motion:reduce){.btn.go{animation:none}}
</style></head>
<body><div class="app">
  <div class="top"><span class="brand">Two Hands</span><span id="where"></span><span id="score"></span><span class="lab" style="margin-left:auto">a deck for each hand - defend by timing</span></div>
  <div class="men"><div class="man you" id="you"></div><div class="man him" id="him"></div></div>
  <div class="table"><div class="said" id="said"></div><div class="sub" id="sub"></div><div class="combo" id="combo"></div><div class="rows" id="rows"></div><span class="lab">What happened - newest on top</span><div class="log" id="log"></div></div>
  <div><div class="hands" id="hands"></div><div class="acts" id="acts" style="margin-top:.6rem"></div></div>
</div>
<script>
// TWO HANDS (S551 toy, owner: "you can use deck for each hand or even combine them ... decide what each move hits and give
// opponent various options"; defence by timing, "like Expedition 33"). A feel test, not a balanced game: every number is in N / MOVES.
const N = { hp: 12, st: 6, rec: 2, defCost: 1, bell: 4, rounds: 3, leads: 3, combo: 3, half: 170, alt: 0.8, rocked: 0.75, bit: 0.6, gapAlt: 380, gapSame: 620, counter: 2, kdBack: [5, 4], aiSkill: 0.8 };
// o: the defences that work against the move -> window size (1 = full). k: what the defence does.
const DEF = { block: { v: ['block', 'blocks'], n: 'Block', k: 'soak', t: 'Takes the sting out. His combination goes on.' }, elbow: { v: ['cover up against', 'covers up against'], n: 'Elbow block', k: 'soak', t: 'Covers the ribs. His combination goes on.' },
  slip: { v: ['slip', 'slips'], n: 'Slip', k: 'evade', t: 'It misses. You counter and his combination ends.' }, duck: { v: ['duck under', 'ducks under'], n: 'Duck under', k: 'evade', t: 'It sails over. You counter and his combination ends.' },
  parry: { v: ['parry', 'parries'], n: 'Parry', k: 'evade', t: 'You knock it aside. You counter and his combination ends.' }, step: { v: ['step back', 'steps back'], n: 'Step back', k: 'away', t: 'It falls short and his combination ends. You give ground.' },
  lean: { v: ['lean back', 'leans back'], n: 'Lean back', k: 'away', t: 'It passes your chin and his combination ends. You give ground.' } };
const MOVES = {
  jab: { n: 'Jab', h: 0, hits: 'head', d: 1, p: 1, st: 1, ms: 700, chip: 0, o: { block: 1, slip: 0.55, parry: 0.42 } },
  hook: { n: 'Lead hook', h: 0, hits: 'head, from the side', d: 3, p: 2, st: 2, ms: 820, chip: 1, o: { block: 0.9, duck: 0.5, step: 0.7 } },
  lup: { n: 'Lead uppercut', h: 0, hits: 'chin, from below', d: 3, p: 2, st: 2, ms: 800, o: { lean: 0.6, slip: 0.42 } },
  lbody: { n: 'Lead body hook', h: 0, hits: 'ribs', d: 1, p: 1, st: 2, ms: 800, chip: 0, body: 1, o: { elbow: 0.8, step: 0.65 } },
  feint: { n: 'Feint', h: 0, hits: 'nothing', d: 0, p: 0, st: 1, ms: 520, feint: 1, o: {} },
  cross: { n: 'Cross', h: 1, hits: 'head, straight', d: 3, p: 2, st: 2, ms: 740, chip: 1, o: { block: 0.9, slip: 0.5, step: 0.7 } },
  over: { n: 'Overhand', h: 1, hits: 'head, over the top', d: 4, p: 2, st: 3, ms: 980, chip: 2, o: { block: 1, duck: 0.6, step: 0.8 } },
  rup: { n: 'Rear uppercut', h: 1, hits: 'chin, from below', d: 4, p: 2, st: 3, ms: 860, o: { lean: 0.6, slip: 0.42 } },
  rbody: { n: 'Body cross', h: 1, hits: 'stomach', d: 2, p: 1, st: 2, ms: 760, chip: 0, body: 1, o: { elbow: 0.8, step: 0.65 } },
};
const DECKS = [['jab', 'jab', 'jab', 'jab', 'hook', 'hook', 'lup', 'lbody', 'feint', 'feint'], ['cross', 'cross', 'cross', 'over', 'over', 'rup', 'rbody', 'rbody']];
const HAND = ['Lead hand', 'Rear hand'], KEYS = ['a', 's', 'd'];
const $ = (id) => document.getElementById(id), rnd = Math.random, pickOne = (a) => a[Math.floor(rnd() * a.length)];
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let F, round, turn, a, phase, pick, logs = [], cards = [], live = null;
const man = () => ({ hp: N.hp, st: N.st, cap: N.st, pts: 0, kd: 0, ropes: 0, rocked: 0, bit: 0, decks: DECKS.map((d) => shuffle([...d])), up: [[], []] });
function fill(m) { for (const h of [0, 1]) while (m.up[h].length < 2) { if (!m.decks[h].length) m.decks[h] = shuffle([...DECKS[h]].filter((id) => !m.up[h].includes(id) || rnd() < 0.5)); m.up[h].push(m.decks[h].pop()); } }
const log = (t) => { logs.unshift(t); $('log').innerHTML = logs.slice(0, 30).map((l) => `<div>${l}</div>`).join(''); };
const cost = (ids) => ids.reduce((s, id) => s + MOVES[id].st, 0);

function draw() {
  for (const k of [0, 1]) { const m = F[k];
    $(k ? 'him' : 'you').innerHTML = `<h2>${k ? 'Him' : 'You'}${m.ropes >= 2 ? '<span class="tag">on the ropes</span>' : ''}${m.rocked ? '<span class="tag">rocked</span>' : ''}${m.kd ? `<span class="tag">down ${m.kd}x</span>` : ''}</h2>
      <span class="lab">Health ${Math.max(0, m.hp)} of ${N.hp}</span><div class="bar hp"><i style="width:${100 * Math.max(0, m.hp) / N.hp}%"></i></div>
      <span class="lab">Stamina ${m.st} of ${m.cap}</span><div class="bar st"><i style="width:${100 * m.st / N.st}%"></i></div>`; }
  $('where').innerHTML = `Round <b>${round}</b> of ${N.rounds} - exchange <b>${Math.min(turn + 1, 2 * N.leads)}</b> of ${2 * N.leads}`;
  $('score').innerHTML = `Points this round: you <b>${F[0].pts}</b> - him <b>${F[1].pts}</b>` + cards.map((c, i) => ` &nbsp; R${i + 1} ${c[0]}-${c[1]}`).join('');
}
const face = (id, h, i, cls) => { const m = MOVES[id], o = Object.keys(m.o).map((k) => DEF[k].n.toLowerCase()).join(', ');
  return `<button class="card ${cls}" data-h="${h}" data-i="${i}"><span class="w">${m.st} stamina</span><b>${m.n}</b><small>${m.feint ? 'Lands nothing. If he bites, his next window shrinks.' : `Hits the ${m.hits}. ${m.d} health${m.body ? ', his stamina bar 1 shorter' : ''}.`}</small><small>${m.feint ? '' : 'He can: ' + o}</small></button>`; };
function hands(active) { const me = F[0];
  $('hands').innerHTML = [0, 1].map((h) => `<div class="hand"><span class="lab">${HAND[h]}</span><div class="cards">${me.up[h].map((id, i) => { const n = pick.findIndex((p) => p.h === h && p.i === i);
    const no = !active || (n < 0 && (pick.length >= N.combo || cost(pick.map((p) => p.id)) + MOVES[id].st > me.st)); return face(id, h, i, (n >= 0 ? 'pick ' : '') + (no ? 'no' : '')); }).join('')}</div></div>`).join('');
  if (active) for (const b of $('hands').querySelectorAll('.card')) b.onclick = () => { const h = +b.dataset.h, i = +b.dataset.i, n = pick.findIndex((p) => p.h === h && p.i === i);
    if (n >= 0) pick.splice(n, 1); else if (!b.classList.contains('no')) pick.push({ h, i, id: me.up[h][i] }); lead(); }; }
const chips = (ids, at, marks = []) => ids.map((id, i) => `<span class="chip ${i === at ? 'now' : ''} ${marks[i] || ''}">${i + 1}. ${MOVES[id].n}</span>`).join('');

function start() { F = [man(), man()]; round = 1; turn = 0; cards = []; logs = []; pick = []; a = rnd() < 0.5 ? 0 : 1; log(`Round 1. ${a ? 'He leads' : 'You lead'} first.`); for (const m of F) fill(m); draw(); hands(false);
  $('said').textContent = a ? 'He leads first. His punches come one at a time.' : 'You lead first.'; $('sub').textContent = 'When he punches: press a defence (A, S, D or tap it) while the white line is inside its band. Wide band = safe block. Narrow band = a counter.';
  $('combo').innerHTML = ''; $('rows').innerHTML = ''; $('acts').innerHTML = `<button class="btn go" id="next">${a ? 'Ready - let him come' : 'Start'}</button>`; $('next').onclick = next; }
function next() {
  if (turn >= 2 * N.leads) { const [x, y] = F, w = x.pts === y.pts ? -1 : x.pts > y.pts ? 0 : 1, sc = [w === 1 ? 9 : 10, w === 0 ? 9 : 10]; cards.push(sc); log(`BELL. The judges give the round ${sc[0]}-${sc[1]}.`);
    if (round >= N.rounds) { const t = [0, 1].map((k) => cards.reduce((s, c) => s + c[k], 0)); return over(t[0] === t[1] ? `A DRAW ${t[0]}-${t[1]}` : `${t[0] > t[1] ? 'YOU WIN' : 'HE WINS'} on the cards ${t[0]}-${t[1]}`); }
    round++; turn = 0; for (const m of F) { m.pts = 0; m.st = Math.min(m.cap, m.st + N.bell); m.ropes = 0; m.rocked = 0; } log(`Round ${round}.`); }
  for (const m of F) { if (turn) m.st = Math.min(m.cap, m.st + N.rec); fill(m); }
  F[a].ropes = 0; pick = []; draw();
  if (a === 0) lead(); else { const ids = aiCombo(); if (!ids.length) { F[1].st = Math.min(F[1].cap, F[1].st + 2); log('He takes a breath.'); return done('He takes a breath.'); } defend(ids); }
}
function lead() { phase = 'lead'; const ids = pick.map((p) => p.id), ok = ids.length && MOVES[ids[ids.length - 1]].feint !== 1;
  $('said').textContent = 'Your lead: pick up to three moves from your two hands, in order.'; $('sub').textContent = `Changing hands makes the next punch come faster. A feint cannot be last. Only ${N.rec} stamina comes back each exchange.`;
  $('combo').innerHTML = ids.length ? chips(ids, -1) + `<span class="lab">${cost(ids)} stamina</span>` : ''; $('rows').innerHTML = ''; hands(true);
  $('acts').innerHTML = `<button class="btn" id="rest">Breather (+2 stamina)</button><button class="btn go" id="go" ${ok ? '' : 'disabled'}>Throw it</button>`;
  $('rest').onclick = () => { F[0].st = Math.min(F[0].cap, F[0].st + 2); log('You take a breath.'); done('You take a breath.'); };
  $('go').onclick = () => { const me = F[0]; for (const h of [0, 1]) me.up[h] = me.up[h].filter((_, i) => !pick.some((p) => p.h === h && p.i === i)); attack(ids); }; }
function aiCombo() { const m = F[1], out = []; let st = m.st, last = -1; const pool = [0, 1].flatMap((h) => m.up[h].map((id, i) => ({ h, i, id })));
  const want = st >= 5 ? 3 : st >= 3 ? 2 : st >= 1 ? 1 : 0;
  while (out.length < want) { const can = pool.filter((p) => !out.includes(p) && MOVES[p.id].st <= st && !(MOVES[p.id].feint && out.length === want - 1)); if (!can.length) break;
    const alt = can.filter((p) => p.h !== last), p = pickOne(alt.length && rnd() < 0.75 ? alt : can); out.push(p); st -= MOVES[p.id].st; last = p.h; }
  while (out.length && MOVES[out[out.length - 1].id].feint) out.pop();
  for (const h of [0, 1]) m.up[h] = m.up[h].filter((_, i) => !out.some((p) => p.h === h && p.i === i)); return out.map((p) => p.id); }
// the window a defence gets against one punch of a combination, in ms either side of the impact
function half(D, id, key, prev) { const m = MOVES[id]; let w = N.half * m.o[key]; if (prev != null && MOVES[prev].h !== m.h) w *= N.alt; if (D.rocked) w *= N.rocked; if (D.bit) w *= N.bit; return w * (0.7 + 0.3 * D.st / N.st); }
const dcost = (k) => (DEF[k].k === 'soak' ? 0 : N.defCost);
const options = (D, id) => Object.keys(MOVES[id].o).filter((k) => !(DEF[k].k === 'away' && D.ropes >= 2) && D.st >= dcost(k));
// the story of the exchange on the table: one row a move - who threw what, what the other man did, what it cost
let xr = [];
const rec = (move, act, out, cls) => xr.push({ move, act, out, cls });
function story(att, ids, at, hidden) { return '<div class="story">' + ids.map((id, j) => { const r = xr[j], w = att ? 'His' : 'Your';
  if (r) return `<div class="srow ${r.cls}"><span>${j + 1}</span><b>${w} ${r.move}</b><span>${r.act}</span><em>${r.out}</em></div>`;
  if (j === at) return `<div class="srow now"><span>${j + 1}</span><b>${w} ${MOVES[id].feint && att ? '...' : MOVES[id].n}</b><span>coming now</span><em></em></div>`;
  return `<div class="srow dim"><span>${j + 1}</span><b>${at < 0 ? w + ' ' + MOVES[id].n : hidden ? 'face down' : w + ' ' + MOVES[id].n}</b><span>${at < 0 ? 'not thrown' : 'still to come'}</span><em></em></div>`; }).join('') + '</div>'; }

// he leads: each punch sweeps across; you press a defence in its band
function defend(ids) { phase = 'defend'; xr = []; hands(false); $('acts').innerHTML = ''; const marks = []; let i = 0, prev = null;
  const one = () => { if (i >= ids.length || F[0].hp <= 0) return finish(1, ids, marks);
    const id = ids[i], m = MOVES[id], D = F[0], opts = options(D, id), lead = 0.72, total = m.ms + (prev == null ? 500 : MOVES[prev].h !== m.h ? N.gapAlt : N.gapSame);
    F[1].st -= m.st; draw();
    $('said').textContent = m.feint ? 'He twitches...' : `His ${m.n} is coming - ${m.hits}.`; $('sub').textContent = m.feint ? '' : opts.length ? 'Press a defence when the white line is inside its band.' : 'Nothing you have stops this.';
    $('combo').innerHTML = story(1, ids, i, true);
    const shownOpts = m.feint ? ['block', 'slip', 'step'] : opts;
    $('rows').innerHTML = shownOpts.map((k, r) => { const hw = m.feint ? N.half * 0.6 : half(D, id, k, prev), l = 100 * (lead - hw / total), wdt = 100 * 2 * hw / total;
      return `<div class="opt"><button data-k="${k}"><kbd>${KEYS[r].toUpperCase()}</kbd><b>${DEF[k].n}${dcost(k) ? ' - ' + dcost(k) + ' stamina' : ''}</b><small>${DEF[k].t}</small></button><div class="track"><div class="zone ${DEF[k].k === 'soak' ? '' : 'risk'}" style="left:${l}%;width:${wdt}%"></div><div class="impact" style="left:${100 * lead}%"></div><div class="mark"></div></div></div>`; }).join('');
    const t0 = performance.now(); let pressed = null;
    const press = (k) => { if (pressed || !live) return; pressed = { k, t: performance.now() - t0 }; };
    for (const b of $('rows').querySelectorAll('button')) b.onpointerdown = (e) => { e.preventDefault(); press(b.dataset.k); };
    live = { keys: shownOpts, press };
    const tick = (now) => { const t = now - t0, endAt = m.feint ? total * 0.55 : total;
      for (const el of $('rows').querySelectorAll('.mark')) el.style.left = Math.min(100, 100 * t / total) + '%';
      if (t < endAt && !(pressed && !m.feint)) return requestAnimationFrame(tick);
      live = null; let res;
      if (m.feint) { if (pressed) { D.bit = 1; res = 'hit'; log('He feints and you bite: your next band is smaller.'); $('said').textContent = 'A feint - and you bit.'; rec('Feint', 'You moved - there was no punch', 'your next band is smaller', 'bad'); } else { res = 'safe'; log('He feints. You do not move.'); $('said').textContent = 'A feint. You held still.'; rec('Feint', 'You held still', 'nothing lost', 'good'); } }
      else { if (pressed) D.st = Math.max(0, D.st - dcost(pressed.k)); const k = pressed && pressed.k, off = pressed ? Math.abs(pressed.t - lead * total) : 1e9, good = k && off <= half(D, id, k, prev); res = resolve(1, id, good ? k : null, pressed ? (pressed.t < lead * total ? 'too early' : 'too late') : 'no defence'); D.bit = 0; }
      marks[i] = res === 'hit' ? 'hit' : 'safe'; prev = id; i++; draw();
      if (res === 'stop') return setTimeout(() => finish(1, ids, marks), 650); setTimeout(one, m.feint ? 250 : 420); };
    requestAnimationFrame(tick); };
  one(); }
// one punch from `att` meets defence `k` (null = it lands clean). Returns 'hit' | 'safe' | 'stop'
function resolve(att, id, k, whyNot) { const A = F[att], D = F[1 - att], m = MOVES[id], you = att === 1, his = you ? 'His' : 'Your', who = you ? 'You' : 'He', g = you ? 'good' : 'bad', b = you ? 'bad' : 'good';
  const miss = { 'too early': 'You pressed too early', 'too late': 'You pressed too late', 'no defence': 'You did not defend', 'nothing stops it': 'He has no answer to it' }[whyNot] || (whyNot ? whyNot[0].toUpperCase() + whyNot.slice(1) : '');
  if (!k) { D.hp -= m.d; A.pts += m.p; D.rocked = 1; if (m.body) { D.cap = Math.max(3, D.cap - 1); D.st = Math.min(D.st, D.cap); }

function down(k) { const m = F[k], w = k ? 'He' : 'You'; m.kd++; if (m.kd > N.kdBack.length) { m.hp = 0; const t = `${k ? 'HE IS' : 'YOU ARE'} DOWN for the third time - health at 0.`; log(t); $('said').textContent = t; return true; }

// you lead: he defends the same way, his hands played by the machine (you watch the same sweep, quicker)
