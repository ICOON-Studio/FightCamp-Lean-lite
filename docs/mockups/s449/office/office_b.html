<!doctype html>
<html><head><meta charset="utf-8"><title>Office computer B - the monitor on the desk (S449)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1080px;overflow:hidden;position:relative;background:#0b0f15}
.bg{position:absolute;inset:0;background:url(img/office_bg.jpg) center/cover;filter:brightness(.55) blur(2px)}
.glow{position:absolute;inset:0;background:radial-gradient(900px 520px at 50% 46%,rgba(120,170,255,.16),rgba(0,0,0,0) 70%)}
.mon{position:absolute;left:170px;top:40px;width:1580px;height:930px;background:#0d0f12;border-radius:22px;padding:22px 22px 46px;
 box-shadow:0 0 0 2px #2a2f36,0 40px 90px rgba(0,0,0,.75),inset 0 0 0 1px #000}
.mon::after{content:"FIGHTCAMP";position:absolute;left:0;right:0;bottom:12px;text-align:center;font:600 14px Arial;letter-spacing:6px;color:#4b5260}
.scr{width:1536px;height:862px;overflow:hidden;border-radius:6px;position:relative;background:#0b0f15}
.scr iframe{width:1920px;height:1080px;border:0;transform:scale(.8);transform-origin:0 0}
.stand{position:absolute;left:860px;top:968px;width:200px;height:60px;background:linear-gradient(180deg,#1a1d22,#0e1013);clip-path:polygon(30% 0,70% 0,100% 100%,0 100%)}
.desk{position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(180deg,#5a3a22,#3b2414);box-shadow:0 -6px 18px rgba(0,0,0,.5)}
.mug{position:absolute;right:120px;bottom:40px;width:70px;height:80px;border-radius:6px 6px 14px 14px;background:linear-gradient(90deg,#c9c3b8,#efe9df,#bdb6aa)}
.lamp{position:absolute;left:40px;top:120px;width:300px;height:500px;background:radial-gradient(160px 200px at 60% 70%,rgba(255,200,120,.25),rgba(0,0,0,0) 70%)}
</style></head><body>
<div class="bg"></div><div class="glow"></div><div class="lamp"></div>
<div class="mon"><div class="scr"><iframe src="office_a.html"></iframe></div></div>
<div class="stand"></div><div class="desk"></div>
</body></html>
