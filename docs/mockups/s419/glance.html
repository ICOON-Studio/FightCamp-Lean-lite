<!doctype html>
<html><head><meta charset="utf-8"><title>At a glance A and B</title>
<style>
:root{--gold:#f0bd4f;--chalk:#f3efe4;--red:#c9342a;--green:#6fd48a;--orange:#f0953a;--blue:#6aa8ff;}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1920px;height:1080px;overflow:hidden;background:#15191c;color:var(--chalk);font-family:"Bahnschrift","Segoe UI",Arial,sans-serif;position:relative}
.lab{position:absolute;top:14px;font-size:30px;font-weight:700;color:#8b949b}
.stage{position:absolute;top:60px;width:800px;height:1000px;}
.scale{width:400px;height:500px;transform:scale(2);transform-origin:0 0;position:relative}
.board{position:absolute;inset:0;border:9px solid #5b3a20;border-radius:5px;background:radial-gradient(ellipse at 30% 15%,#2f3336,transparent 60%),linear-gradient(#1f2123,#171819);
 box-shadow:0 0 0 2px #1d1008,inset 0 0 0 2px #8a5f36,inset 0 0 30px #000c}
.in{position:absolute;left:9px;top:8px;right:9px;bottom:8px}
.t{font-size:22px;font-weight:700;color:var(--gold);letter-spacing:.5px;line-height:26px}
.abs{position:absolute}
.txt{font-size:20px;line-height:22px;color:var(--chalk)}
.badge{position:absolute;border-radius:8px;border:2px solid #ffffff2a;background:#0007;display:flex;align-items:center;gap:6px;padding:0 8px}
.badge.g{border-color:#3d8d52;background:#12301c99}
.badge.o{border-color:#b9662b;background:#3a200d99}
.badge.r{border-color:#c9342a;background:#4a151199}
.num{font-size:32px;font-weight:700;line-height:32px}
.cap{font-size:20px;line-height:20px}
svg{display:block}
</style></head><body>
<div class="lab" style="left:100px">A</div><div class="lab" style="left:1020px">B</div>

<!-- ===================== VARIANT A: the ring ===================== -->
<div class="stage" style="left:100px"><div class="scale"><div class="board"><div class="in">
 <div class="abs t" style="left:0;top:0" title="The boxer on one glance"></div>

 <!-- ring diagram: top-down ring, Lucy at long range, steady beat -->
 <div class="abs" id="ring" style="left:0;top:32px;width:364px;height:140px" title="Where Lucy likes to stand in the ring: out at long range, pace steady. Opens the Fight plan.">
  <svg width="364" height="150" viewBox="0 0 364 150">
   <rect x="2" y="2" width="360" height="132" rx="6" fill="#26352b" stroke="#8a5f36" stroke-width="2"/>
   <rect x="9" y="9" width="346" height="118" rx="3" fill="none" stroke="#c9342a" stroke-width="3"/>
   <rect x="17" y="17" width="330" height="102" rx="2" fill="none" stroke="#e8e2d4" stroke-width="2" opacity=".55"/>
   <!-- range arc: long range -->
   <line x1="92" y1="61" x2="250" y2="61" stroke="#f0bd4f" stroke-width="3" stroke-dasharray="3 8"/>
   <path d="M240 51 l12 10 l-12 10" fill="none" stroke="#f0bd4f" stroke-width="3"/>
   <!-- Lucy -->
   <circle cx="72" cy="61" r="22" fill="#d94a3b" stroke="#fff" stroke-width="3"/>
   <text x="72" y="70" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">L</text>
   <!-- opponent -->
   <circle cx="288" cy="61" r="22" fill="#4b5157" stroke="#9aa3aa" stroke-width="3"/>
   <text x="288" y="69" text-anchor="middle" font-size="22" font-weight="700" fill="#cfd6db">?</text>
   <!-- distance label -->
   <text x="172" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#f0bd4f">Long range</text>
   <!-- steady beat: evenly spaced punches -->
   <g fill="#f3efe4"><circle cx="140" cy="84" r="5"/><circle cx="172" cy="84" r="5"/><circle cx="204" cy="84" r="5"/></g>
   <text x="172" y="110" text-anchor="middle" font-size="20" fill="#cfd6db">Steady</text>
   <text x="12" y="146" font-size="1" fill="none"> </text>
  </svg>
 </div>

 <!-- Best -->
 <div class="abs txt" style="left:0;top:176px;color:var(--green);font-weight:700">BEST</div>
 <div class="badge g" style="left:0;top:198px;width:176px;height:50px" title="Heart 85, Lucy's top stat (elite). Keeps going when hurt. Opens Overview attributes.">
  <svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.800-8 11-8 11z" fill="none" stroke="#6fd48a" stroke-width="2.2"/></svg>
  <span class="num" style="color:#c9a8ff">85</span><span class="cap">Heart</span></div>
 <div class="badge g" style="left:188px;top:198px;width:176px;height:50px" title="Discipline 69, strong. Sticks to the week and the plan. Opens Overview attributes.">
  <svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z" fill="none" stroke="#6fd48a" stroke-width="2.2"/></svg>
  <span class="num" style="color:#6fd48a">69</span><span class="cap">Discipline</span></div>

 <!-- Work on -->
 <div class="abs txt" style="left:0;top:256px;color:var(--orange);font-weight:700">WORK ON</div>
 <div class="badge o" style="left:0;top:278px;width:176px;height:50px" title="Coachability 45, weakest stat. Slows how fast Lucy learns. Opens Training to pick work.">
  <svg width="26" height="26" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.500" fill="none" stroke="#f0953a" stroke-width="2.200"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6M17 7l4 4-4 4" fill="none" stroke="#f0953a" stroke-width="2.200"/></svg>
  <span class="num" style="color:#f0953a">45</span><span class="cap">Coachab.</span></div>
 <div class="badge o" style="left:188px;top:278px;width:176px;height:50px" title="Confidence 51, fair. Rises with wins and a booked bout. Opens Find a bout.">
  <svg width="26" height="26" viewBox="0 0 24 24"><path d="M3 17l6-6 4 4 8-8M15 7h6v6" fill="none" stroke="#f0953a" stroke-width="2.200"/></svg>
  <span class="num" style="color:#f0953a">51</span><span class="cap">Confidence</span></div>

 <!-- Temper + grow -->
 <div class="badge r" style="left:0;top:336px;width:364px;height:44px" title="Temper: Trades when hit. Lucy swaps punches instead of backing off. Opens the Fight plan.">
  <svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 3-7 1 2 3 2 3-5z" fill="none" stroke="#ff8d80" stroke-width="2.200"/></svg>
  <span class="cap" style="font-size:22px;font-weight:700;color:#ff8d80">Trades</span></div>

 <div class="abs" style="left:0;top:388px;width:364px;height:60px" title="Room to grow: Lucy is 59 now, ceiling about 84. A lot left. Opens Training.">
  <svg width="364" height="60" viewBox="0 0 364 60">
   <rect x="0" y="14" width="364" height="22" rx="11" fill="#0009" stroke="#ffffff30" stroke-width="2"/>
   <rect x="2" y="16" width="190" height="18" rx="9" fill="#6aa8ff"/>
   <rect x="192" y="16" width="136" height="18" rx="9" fill="#6aa8ff" opacity=".28" stroke="#6aa8ff" stroke-dasharray="4 4"/>
   <rect x="326" y="6" width="4" height="38" fill="#fff"/>
   <text x="0" y="58" font-size="22" font-weight="700" fill="#cfd6db">59</text>
   <text x="364" y="58" text-anchor="end" font-size="22" font-weight="700" fill="#6aa8ff">A lot</text><text x="328" y="58" text-anchor="end" font-size="1"> </text>
  </svg>
 </div>
</div></div></div></div>

<!-- ===================== VARIANT B: the card ===================== -->
<div class="stage" style="left:1020px"><div class="scale"><div class="board"><div class="in">
 <!-- ribbon: class -->
 <div class="abs" style="left:0;top:0;width:364px;height:64px;border-radius:8px;background:linear-gradient(#a26d3a,#6b4527);box-shadow:inset 0 0 0 2px #f0bd4f;display:flex;align-items:center;gap:10px;padding:0 12px" title="Out-boxer: Lucy's style. Wins from range with the jab and footwork. Opens the Playbook.">
  <svg width="40" height="40" viewBox="0 0 24 24"><path d="M6 11c0-4 2-7 7-7 4 0 6 2 6 6v4a5 5 0 0 1-5 5H9a3 3 0 0 1-3-3zM6 17h9v4H6z" fill="none" stroke="#f3efe4" stroke-width="2"/></svg>
  <span style="font-size:32px;font-weight:700;color:#fff;letter-spacing:.5px">OUT-BOXER</span></div>

 <!-- how she fights: range + busy -->
 <div class="badge" style="left:0;top:74px;width:178px;height:44px" title="Long range: Lucy stays out of reach and works the jab. Opens the Fight plan.">
  <svg width="40" height="26" viewBox="0 0 40 26"><circle cx="6" cy="13" r="5" fill="#d94a3b"/><circle cx="34" cy="13" r="5" fill="#8a949a"/><path d="M13 13h14m-4-4l4 4-4 4" fill="none" stroke="#f0bd4f" stroke-width="2.500"/></svg>
  <span class="cap" style="font-size:22px;font-weight:700">Long range</span></div>
 <div class="badge" style="left:186px;top:74px;width:178px;height:44px" title="Steady pace: not a flurry, not waiting. Opens the Fight plan pace line.">
  <svg width="40" height="26" viewBox="0 0 40 26"><g fill="#f3efe4"><rect x="2" y="9" width="6" height="8" rx="2"/><rect x="14" y="9" width="6" height="8" rx="2"/><rect x="26" y="9" width="6" height="8" rx="2"/></g></svg>
  <span class="cap" style="font-size:22px;font-weight:700">Steady</span></div>

 <!-- three big badges -->
 <div class="badge g" style="left:0;top:130px;width:116px;height:150px;flex-direction:column;justify-content:center;gap:2px;padding:0" title="Best: Heart 85, elite. Lucy keeps going when hurt. Opens Overview attributes.">
  <div class="cap" style="color:#6fd48a;font-weight:700">BEST</div>
  <svg width="48" height="48" viewBox="0 0 24 24"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.800-8 11-8 11z" fill="#6fd48a22" stroke="#6fd48a" stroke-width="1.800"/></svg>
  <div class="num" style="color:#c9a8ff;font-size:36px;line-height:38px">85</div>
  <div class="cap">Heart</div></div>
 <div class="badge o" style="left:124px;top:130px;width:116px;height:150px;flex-direction:column;justify-content:center;gap:2px;padding:0" title="Work on: Coachability 45, weakest. Slows learning. Opens Training.">
  <div class="cap" style="color:#f0953a;font-weight:700">WORK ON</div>
  <svg width="48" height="48" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.500" fill="#f0953a22" stroke="#f0953a" stroke-width="1.800"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6M17 7l4 4-4 4" fill="none" stroke="#f0953a" stroke-width="1.800"/></svg>
  <div class="num" style="color:#f0953a;font-size:36px;line-height:38px">45</div>
  <div class="cap" style="font-size:20px;letter-spacing:-.4px">Coachability</div></div>
 <div class="badge r" style="left:248px;top:130px;width:116px;height:150px;flex-direction:column;justify-content:center;gap:2px;padding:0" title="Temper: Trades when hit. Lucy swaps punches instead of backing off. Opens the Fight plan.">
  <div class="cap" style="color:#ff8d80;font-weight:700">TEMPER</div>
  <svg width="48" height="48" viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 3-7 1 2 3 2 3-5z" fill="#ff8d8022" stroke="#ff8d80" stroke-width="1.800"/></svg>
  <div class="cap" style="font-size:26px;line-height:38px;font-weight:700;color:#ff8d80">Trades</div>
  </div>

 <!-- growth meter -->
 <div class="abs" style="left:0;top:292px;width:364px;height:170px;border-radius:8px;background:#0007;border:2px solid #ffffff2a" title="Room to grow: Lucy rates 59 of a ceiling near 84. A lot left. Opens Training to spend it.">
  <div class="abs t" style="left:12px;top:8px;font-size:22px;color:#6aa8ff">ROOM</div>
  <div class="abs" style="left:12px;top:40px;font-size:40px;font-weight:700;line-height:44px">A lot</div>
  <svg class="abs" style="left:12px;top:92px" width="338" height="68" viewBox="0 0 338 68">
   <rect x="0" y="6" width="338" height="30" rx="15" fill="#000a" stroke="#ffffff30" stroke-width="2"/>
   <rect x="3" y="9" width="176" height="24" rx="12" fill="#6aa8ff"/>
   <rect x="179" y="9" width="126" height="24" rx="12" fill="#6aa8ff" opacity=".28" stroke="#6aa8ff" stroke-dasharray="4 4"/>
   <rect x="304" y="0" width="4" height="42" fill="#fff"/>
   <text x="3" y="64" font-size="22" font-weight="700" fill="#cfd6db">59</text>
   <text x="335" y="64" text-anchor="end" font-size="22" font-weight="700" fill="#cfd6db">84</text>
  </svg>
 </div>
</div></div></div></div>
</body></html>
