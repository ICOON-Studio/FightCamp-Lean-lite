<script>
const NS="http://www.w3.org/2000/svg";
function el(p,t,a,txt){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!==undefined)e.textContent=txt;p.appendChild(e);return e}
const C=2*Math.PI*23;
function col(v){return v>=55?"#5fcf6f":v>=35?"#ffa83a":v>=15?"#ff4a3a":"#ff1f1f"}
// ring gauge: v remaining, g = recently lost (ghost, white), unknown -> dashed ?
function ring(s,x,y,v,g,opts){opts=opts||{};
 const gr=el(s,"g",{});
 if(v===null){el(gr,"circle",{cx:x,cy:y,r:25,fill:"#15100c",stroke:"#9d8f78","stroke-width":3,"stroke-dasharray":"6 6"});el(gr,"text",{x:x,y:y+9,"text-anchor":"middle","font-size":28,"font-weight":900,fill:"#9d8f78"},"?");return gr}
 if(opts.pulse){[44,36].forEach((r,i)=>el(gr,"circle",{cx:x,cy:y,r:r,fill:"none",stroke:"#ff4a3a","stroke-width":i?3:4,opacity:i?.55:.3}));}
 el(gr,"circle",{cx:x,cy:y,r:23,fill:"#15100c",stroke:"#3a2f24","stroke-width":7});
 if(g){el(gr,"circle",{cx:x,cy:y,r:23,fill:"none",stroke:"#fff","stroke-width":7,"stroke-dasharray":(C*(v+g)/100)+" "+C,transform:`rotate(-90 ${x} ${y})`,opacity:.9});}
 el(gr,"circle",{cx:x,cy:y,r:23,fill:"none",stroke:col(v),"stroke-width":7,"stroke-dasharray":(C*v/100)+" "+C,transform:`rotate(-90 ${x} ${y})`,"stroke-linecap":"butt"});
 // doctor tick at 15
 const a=-Math.PI/2+2*Math.PI*0.15; el(gr,"line",{x1:x+19*Math.cos(a),y1:y+19*Math.sin(a),x2:x+28*Math.cos(a),y2:y+28*Math.sin(a),stroke:"#fff","stroke-width":2});
 el(gr,"text",{x:x,y:y+9,"text-anchor":"middle","font-size":26,"font-weight":900,fill:"#fff"},String(v));
 return gr}
function face(s,known,hurt){
 const skin=known?"#c68c63":"#c68c63";
 el(s,"circle",{cx:180,cy:150,r:74,fill:"#2a1f17",stroke:"#6b5036","stroke-width":4});
 el(s,"ellipse",{cx:180,cy:158,rx:58,ry:68,fill:skin});
 el(s,"path",{d:"M122 130C122 88 150 72 180 72s58 16 58 58c-18-18-40-26-58-26s-40 8-58 26z",fill:known?"#2a1a12":"#2a1a12"});
 if(hurt){
  // left eye closing: swelling purple, narrowed slit
  el(s,"ellipse",{cx:150,cy:140,rx:21,ry:17,fill:"#7a3a82",opacity:.95});
  el(s,"path",{d:"M135 141h30",stroke:"#1a0d1a","stroke-width":5,"stroke-linecap":"round"});
  el(s,"ellipse",{cx:210,cy:140,rx:14,ry:10,fill:"#fff"});el(s,"circle",{cx:210,cy:141,r:6,fill:"#5a3a8a"});
  el(s,"path",{d:"M192 108l16 20",stroke:"#d22",fill:"none","stroke-width":3});
  el(s,"ellipse",{cx:180,cy:70,rx:44,ry:20,fill:"#ff3a2a",opacity:.28});
 }else{
  el(s,"ellipse",{cx:152,cy:140,rx:14,ry:10,fill:"#fff"});el(s,"circle",{cx:152,cy:141,r:6,fill:"#3a2a1a"});
  el(s,"ellipse",{cx:208,cy:140,rx:14,ry:10,fill:"#fff"});el(s,"circle",{cx:208,cy:141,r:6,fill:"#3a2a1a"});
 }
 el(s,"path",{d:"M180 150v28l-8 4",fill:"none",stroke:"#8a5a3a","stroke-width":4,"stroke-linecap":"round"});
 el(s,"path",{d:"M160 204q20 10 40 0",fill:"none",stroke:"#7a3a2a","stroke-width":5,"stroke-linecap":"round"});
}
function body(s,x0,trunk,side){
 el(s,"circle",{cx:x0+90,cy:30,r:24,fill:"#c68c63"});
 el(s,"path",{d:`M${x0+25} 62 Q${x0+90} 48 ${x0+155} 62 L${x0+148} 230 L${x0+32} 230z`,fill:"#c68c63"});
 el(s,"rect",{x:x0+32,y:230,width:116,height:74,rx:8,fill:trunk});
 el(s,"rect",{x:x0+44,y:304,width:34,height:44,fill:"#c68c63"});el(s,"rect",{x:x0+102,y:304,width:34,height:44,fill:"#c68c63"});
 el(s,"circle",{cx:x0+12,cy:196,r:22,fill:side});el(s,"circle",{cx:x0+168,cy:196,r:22,fill:side});
}

})();
