<!doctype html>
<html><head><meta charset="utf-8"><title>Fight display C</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0b0d11}
body{position:relative;font-family:'Bahnschrift','Arial Narrow','Segoe UI',sans-serif;font-weight:700;color:#f2ead8}
.abs{position:absolute}
svg.i{width:1em;height:1em;display:inline-block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
svg.f{fill:currentColor;stroke:none}
.sh{text-shadow:0 2px 0 rgba(0,0,0,.8),0 0 6px rgba(0,0,0,.7)}
:root{--red:#e2473b;--red2:#ff8a54;--blue:#3b7de2;--blue2:#76b0ff;--gold:#f2c14e;--chalk:#f2ead8;--wood:#6b4a2f}

/* names */
.name{font-size:34px;letter-spacing:1px;height:36px;line-height:36px}
.drain{font-size:28px;line-height:36px;display:flex;align-items:center;gap:4px;color:#ffb066}
/* meter rows */
.chip{display:flex;align-items:center;gap:8px;background:rgba(10,11,14,.82);border:2px solid var(--wood);border-radius:6px;padding:0 10px;color:var(--chalk)}
.chip.e{height:56px;font-size:44px;width:125px}
.chip.t{height:30px;font-size:24px;width:125px;line-height:26px}
.chip .i{font-size:.62em}
.chip.t .i{font-size:24px}
.track{position:absolute;background:#15171c;border:2px solid #000;overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.07)}
.fill{position:absolute;top:0;bottom:0}
.hatch{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.5) 0 6px,rgba(255,255,255,0) 6px 12px)}
.L .track{transform:skewX(-14deg)}
.R .track{transform:skewX(14deg)}
.L .fill{right:0}
.R .fill{left:0}

/* panels */
.panel{background:rgba(12,13,17,.86);border:4px solid var(--wood);border-radius:8px;box-shadow:0 0 0 2px #2b1c10,inset 0 0 18px rgba(0,0,0,.7)}
.pip{position:absolute;width:32px;height:32px;border-radius:50%;border:3px solid #000}
.cnt{position:absolute;display:flex;gap:18px;align-items:baseline}
.cnt .g{display:flex;align-items:center;gap:6px}
.big{font-size:46px;line-height:46px}
.mid{font-size:26px;color:#cfc6b0}
.state{position:absolute;display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:23px;font-size:26px;border:3px solid}
.pill{position:absolute;display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:22px;border:3px solid;background:rgba(10,10,12,.92);font-size:32px}
.call{position:absolute;display:flex;align-items:center;gap:12px;height:56px;padding:0 18px;background:rgba(12,13,17,.86);border:3px solid var(--wood);border-radius:8px;font-size:28px}
</style></head><body>
